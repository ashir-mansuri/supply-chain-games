<style>
:root {

<main id="app" tabindex="-1"></main>
<script>
/* Export Desk engine: shipping route, currency hedging and cargo insurance for export orders */
const ED = (() => {
  const CUR = {
    EUR: { name: 'euro', symbol: '€', rate: 92 },
    USD: { name: 'US dollar', symbol: '$', rate: 84 }
  };
  const DEST = {
    DE: { city: 'Hamburg', country: 'Germany', cur: 'EUR', routes: [
      { id: 'suez', name: 'Sea via the Suez Canal', mode: 'sea', days: 26, cost: 200000 },
      { id: 'cape', name: 'Sea via the Cape of Good Hope', mode: 'sea', days: 36, cost: 260000 },
      { id: 'seaair', name: 'Sea to Dubai, then air', mode: 'seaair', days: 12, cost: 520000 },
      { id: 'air', name: 'Air from Ahmedabad', mode: 'air', days: 4, cost: 900000 }
    ] },
    US: { city: 'New York', country: 'USA', cur: 'USD', routes: [
      { id: 'suez', name: 'Sea via the Suez Canal', mode: 'sea', days: 32, cost: 240000 },
      { id: 'cape', name: 'Sea via the Cape of Good Hope', mode: 'sea', days: 40, cost: 290000 },
      { id: 'seaair', name: 'Sea to Dubai, then air', mode: 'seaair', days: 16, cost: 600000 },
      { id: 'air', name: 'Air from Ahmedabad', mode: 'air', days: 5, cost: 1100000 }
    ] },
    AE: { city: 'Dubai', country: 'UAE', cur: 'USD', routes: [
      { id: 'sea', name: 'Sea from Mundra', mode: 'sea', days: 6, cost: 80000 },
      { id: 'air', name: 'Air from Ahmedabad', mode: 'air', days: 2, cost: 300000 }
    ] },
    KE: { city: 'Mombasa', country: 'Kenya', cur: 'USD', routes: [
      { id: 'sea', name: 'Sea from Mundra', mode: 'sea', days: 14, cost: 150000 },
      { id: 'air', name: 'Air from Ahmedabad to Nairobi', mode: 'air', days: 4, cost: 600000 }
    ] }
  };
  // eight orders, the same in every game; events and currency moves change with the game code
  const ORDERS = [
    { dest: 'DE', customer: 'a water utility', amount: 60000, deadline: 40 },
    { dest: 'AE', customer: 'a construction firm', amount: 45000, deadline: 10 },
    { dest: 'US', customer: 'a farm equipment dealer', amount: 80000, deadline: 45 },
    { dest: 'DE', customer: 'a chemical plant', amount: 90000, deadline: 20 },
    { dest: 'KE', customer: 'an irrigation project', amount: 55000, deadline: 30 },
    { dest: 'US', customer: 'a city fire department', amount: 120000, deadline: 22 },
    { dest: 'DE', customer: 'a shipyard', amount: 70000, deadline: 32 },
    { dest: 'AE', customer: 'a hotel group', amount: 65000, deadline: 7 }
  ];
  const LATE_RATE = 0.01;     // 1% of order value per day late
  const LATE_CAP = 0.15;      // at most 15%
  const FORWARD_COST = 0.006; // a forward contract locks today's rate, less 0.6%
  const INSURE_RATE = 0.004;  // cargo insurance: 0.4% of order value
  const DAMAGE = { sea: 0.07, seaair: 0.05, air: 0.02 }; // chance of damage on the way
  const DAMAGE_LOSS = 0.35;   // share of the order lost when cargo is damaged
  const PRODUCTION = 0.72;    // cost of making the pumps, as a share of order value at today's rate

  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rand(seed) {
    let a = hash(seed);
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const normCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'PRACTICE';
  const pick = (code, tag, arr) => arr[Math.floor(rand(code + '|' + tag) * arr.length)];

  /* the news for each order: one Suez closure, one port strike, one currency shock, sometimes an air cargo squeeze */
  function events(code) {
    const c = normCode(code);
    const ev = new Array(ORDERS.length).fill(null).map(() => []);
    const suez = pick(c, 'suez', [2, 3, 5, 6]);           // ships through Suez booked for this order are held up
    ev[suez].push({ type: 'suez', extra: 14 });
    const strike = pick(c, 'strike', [0, 3, 6].filter((i) => i !== suez));
    ev[strike].push({ type: 'strike', extra: 7 });
    const fx = pick(c, 'fx', [1, 2, 4, 5, 6]);
    ev[fx].push({ type: 'fx', move: rand(c + '|fxdir') < 0.5 ? -0.07 : 0.06 });
    if (rand(c + '|aircrunch') < 0.6) ev[pick(c, 'airwhen', [3, 5, 7])].push({ type: 'aircrunch', mult: 1.8 });
    return ev;
  }
  /* warnings shown before you book */
  function warnings(code, i) {
    const out = [];
    events(code)[i].forEach((e) => {
      if (e.type === 'aircrunch') out.push({ kind: 'price', text: 'Air cargo space is short this month. Air and sea-air prices are 80% higher.' });
      if (e.type === 'suez' && rand(normCode(code) + '|suezwarn') < 0.7) out.push({ kind: 'warn', text: 'Shipping news: a grounded ship is slowing traffic near the Suez Canal.' });
      if (e.type === 'strike' && rand(normCode(code) + '|strikewarn') < 0.5) out.push({ kind: 'warn', text: 'Dock workers’ unions in Europe are threatening a strike.' });
    });
    return out;
  }

  function rateAtPayment(code, i, cur) {
    // ordinary drift of the rupee against the currency, plus any shock this order
    const drift = (rand(normCode(code) + '|drift|' + i + '|' + cur) * 2 - 1) * 0.03;
    let shock = 0;
    events(code)[i].forEach((e) => { if (e.type === 'fx') shock += e.move; });
    return CUR[cur].rate * (1 + drift + shock);
  }
  function routeCost(code, i, r) {
    let mult = 1;
    events(code)[i].forEach((e) => { if (e.type === 'aircrunch' && (r.mode === 'air' || r.mode === 'seaair')) mult = e.mult; });
    return Math.round(r.cost * mult);
  }

  function ship(code, i, choice) {
    const o = ORDERS[i];
    const d = DEST[o.dest];
    const r = d.routes.find((x) => x.id === choice.route) || d.routes[0];
    const cur = CUR[d.cur];
    const evs = events(code)[i];
    let days = r.days;
    const delays = [];
    evs.forEach((e) => {
      if (e.type === 'suez' && r.id === 'suez') { days += e.extra; delays.push('A ship ran aground in the Suez Canal. Your container waited ' + e.extra + ' days.'); }
      if (e.type === 'strike' && o.dest === 'DE' && r.mode === 'sea') { days += e.extra; delays.push('A dock strike in Hamburg held your container for ' + e.extra + ' days.'); }
    });
    const jitter = Math.round(rand(normCode(code) + '|jit|' + i + '|' + r.id) * (r.mode === 'air' ? 1 : 3));
    days += jitter;
    const late = Math.max(0, days - o.deadline);
    const todayRate = cur.rate;
    const payRate = rateAtPayment(code, i, d.cur);
    const usedRate = choice.hedge ? todayRate * (1 - FORWARD_COST) : payRate;
    const valueInr = o.amount * usedRate;
    const freight = routeCost(code, i, r);
    const insurance = choice.insure ? Math.round(o.amount * todayRate * INSURE_RATE) : 0;
    const damaged = rand(normCode(code) + '|dmg|' + i + '|' + r.mode) < DAMAGE[r.mode];
    const damageLoss = damaged ? Math.round(valueInr * DAMAGE_LOSS) : 0;
    const claim = damaged && choice.insure ? damageLoss : 0;
    const penalty = Math.round(valueInr * Math.min(LATE_CAP, late * LATE_RATE));
    const making = Math.round(o.amount * todayRate * PRODUCTION);
    const received = Math.round(valueInr);
    const profit = received - making - freight - insurance - penalty - damageLoss + claim;
    return { i, route: r.id, routeName: r.name, mode: r.mode, hedge: !!choice.hedge, insure: !!choice.insure, days, deadline: o.deadline, late, delays,
      todayRate, payRate, usedRate, received, making, freight, insurance, damaged, damageLoss, claim, penalty, profit };
  }

  function newGame(code, name) { return { v: 1, code: normCode(code), name: name || 'Player', i: 0, history: [], done: false }; }
  function play(s0, choice) {
    const s = JSON.parse(JSON.stringify(s0));
    s.history.push(ship(s.code, s.i, choice));
    s.i += 1;
    if (s.i >= ORDERS.length) s.done = true;
    return s;
  }
  function summary(s) {
    const sum = (k) => s.history.reduce((a, r) => a + r[k], 0);
    return {
      profit: sum('profit'), freight: sum('freight'), penalty: sum('penalty'), insurance: sum('insurance'),
      damageLoss: sum('damageLoss') - sum('claim'), onTime: s.history.filter((r) => r.late === 0).length,
      fxGain: s.history.reduce((a, r) => a + Math.round(ORDERS[r.i].amount * (r.usedRate - r.todayRate)), 0)
    };
  }

  const STRATEGIES = [
    { id: 'cheap', name: 'Cheapest every time', desc: 'Always the cheapest route. Never locks the rate, never insures.',
      choose: () => (i) => ({ route: DEST[ORDERS[i].dest].routes[0].id, hedge: false, insure: false }) },
    { id: 'safe', name: 'Fastest and safest every time', desc: 'Always flies. Always locks the rate and insures.',
      choose: () => (i) => ({ route: 'air', hedge: true, insure: true }) },
    { id: 'smart', name: 'Match the route to the deadline', desc: 'Takes the cheapest route expected to arrive with 3 days to spare, locks the rate and insures.',
      choose: () => (i) => {
        const o = ORDERS[i];
        const routes = DEST[o.dest].routes.slice().sort((a, b) => a.cost - b.cost);
        const r = routes.find((x) => x.days + 3 <= o.deadline) || routes[routes.length - 1];
        return { route: r.id, hedge: true, insure: true };
      } }
  ];
  function runStrategy(code, st) {
    let s = newGame(code, st.name);
    const f = st.choose();
    for (let i = 0; i < ORDERS.length; i++) s = play(s, f(i));
    return s;
  }
  function randomCode() {
    const w = ['CARGO', 'MUNDRA', 'KANDLA', 'HARBOUR', 'ANCHOR', 'CONTAINER', 'PORT', 'COMPASS'];
    return w[Math.floor(Math.random() * w.length)] + (10 + Math.floor(Math.random() * 90));
  }
  return { CUR, DEST, ORDERS, LATE_RATE, LATE_CAP, FORWARD_COST, INSURE_RATE, DAMAGE, DAMAGE_LOSS, PRODUCTION, events, warnings, rateAtPayment, routeCost, ship, newGame, play, summary, STRATEGIES, runStrategy, normCode, randomCode };
})();
if (typeof module !== 'undefined') module.exports = ED;

</script>
<script>
(function () {
  const app = document.getElementById('app');
  const SAVE_KEY = 'ed-game-v1';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = (n) => (n < 0 ? '−' : '') + '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
  const lakh = (n) => (n < 0 ? '−' : '') + '₹' + (Math.abs(n) / 1e5).toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' lakh';
  const fcy = (cur, n) => ED.CUR[cur].symbol + Math.round(n).toLocaleString('en-US');
  const rate = (n) => '₹' + n.toFixed(2);
  const pct = (x) => (x * 100).toFixed(1).replace('.0', '') + '%';

  let view = 'start', S = null, choice = null, formError = '', confirmRestart = false;

  function go(v) { view = v; render(); window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
  function save() { if (S) store.set(SAVE_KEY, S); }
  function resetChoice() { const d = ED.DEST[ED.ORDERS[S.i].dest]; choice = { route: null, hedge: null, insure: false }; }

  function render() {
    if (view === 'start') return renderStart();
    if (view === 'order') return renderOrder();
    if (view === 'result') return renderResult();
    if (view === 'final') return renderFinal();
  }

  function renderStart() {
    const saved = store.get(SAVE_KEY);
    const resumable = saved && !saved.done && saved.history && saved.history.length > 0;
    app.innerHTML = `
    <div class="wrap">
      <section class="hero">
        <div>
          <p class="kicker">A solo decision game about exporting, 8 orders</p>
          <h1>Export Desk</h1>
          <p style="font-size:20px;max-width:34em">You run the export desk at a pump maker in Rajkot. Eight orders arrive from customers in Germany, the USA, the UAE and Kenya. For each one you choose how to ship it, whether to lock in the exchange rate, and whether to insure the cargo. Deliver on time and protect your profit from delays, damage and currency swings.</p>
        </div>
        <form class="sheet" id="startForm" novalidate>
          <h3>Start a game</h3>
          <label for="name">Your name</label>
          <input type="text" id="name" maxlength="24" autocomplete="off" placeholder="For example, Riya">
          <div style="height:12px"></div>
          <label for="code">Game code</label>
          <div class="row" style="flex-wrap:nowrap">
            <input type="text" id="code" maxlength="16" autocomplete="off" value="${esc(ED.randomCode())}" style="text-transform:uppercase">
            <button type="button" class="btn small" data-act="newcode" style="margin-top:4px">New code</button>
          </div>
          <p class="tiny muted" style="margin-top:6px">Players with the same code face the same delays and currency moves, so results can be compared.</p>
          ${formError ? `<p class="err" role="alert">${esc(formError)}</p>` : ''}
          <button class="btn primary" type="submit" style="width:100%;margin-top:6px">Start the game</button>
          ${resumable ? `<button class="btn" type="button" data-act="resume" style="width:100%;margin-top:10px">Continue ${esc(saved.name)} (order ${saved.i + 1})</button>` : ''}
        </form>
      </section>
      <div class="grid2" style="margin-top:12px">
        <section class="sheet"><h3>How the money works</h3>
          <ul class="small" style="padding-left:1.2em;margin:0">
            <li>Customers pay in euros or US dollars when the pumps arrive. Making the pumps costs ${pct(ED.PRODUCTION)} of the order value.</li>
            <li>Late delivery costs ${pct(ED.LATE_RATE)} of the order value per day late, up to ${pct(ED.LATE_CAP)}.</li>
            <li>The rupee moves while your pumps are at sea. A <b>forward contract</b> locks today&rsquo;s rate, less ${pct(ED.FORWARD_COST)}.</li>
            <li><b>Cargo insurance</b> costs ${pct(ED.INSURE_RATE)} of the order value and pays for any damage on the way. Damaged cargo loses ${pct(ED.DAMAGE_LOSS)} of its value.</li>
          </ul></section>
        <section class="sheet"><h3>Ways to ship</h3>
          <ul class="small" style="padding-left:1.2em;margin:0">
            <li><b>Sea via Suez:</b> cheapest to Europe and the USA, but one canal can hold everything up.</li>
            <li><b>Sea via the Cape of Good Hope:</b> about 10 days longer, but avoids the canal.</li>
            <li><b>Sea to Dubai, then air:</b> faster, costs more than double.</li>
            <li><b>Air:</b> fastest and safest, but four to five times the price of sea.</li>
          </ul></section>
      </div>
      <p class="footer">The company, customers, prices and events in this game are made up for teaching.</p>
    </div>`;
    const f = document.getElementById('startForm');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      if (!name) { formError = 'Enter your name to start.'; renderStart(); document.getElementById('name').focus(); return; }
      formError = '';
      S = ED.newGame(document.getElementById('code').value, name);
      resetChoice(); save(); go('order');
    });
    document.getElementById('name').addEventListener('input', () => { if (formError) { formError = ''; f.querySelector('.err')?.remove(); } });
  }

  function bar(now) {
    const n = now === undefined ? S.i : now;
    const total = S.history.reduce((a, r) => a + r.profit, 0);
    return `<div class="gamebar"><div class="wrap"><span class="teamtag">${esc(S.name)}</span><span class="small muted">Code ${esc(S.code)}</span>
      <div class="steps8" aria-label="Orders">${ED.ORDERS.map((o, i) => { const h = S.history[i]; return `<span class="${i === n ? 'now' : h ? (h.late ? 'late' : 'ok') : ''}">${i + 1}</span>`; }).join('')}</div>
      <span class="score" title="Profit so far">${lakh(total)}</span></div></div>`;
  }

  function renderOrder() {
    const i = S.i;
    const o = ED.ORDERS[i];
    const d = ED.DEST[o.dest];
    const cur = ED.CUR[d.cur];
    const value = o.amount * cur.rate;
    const making = value * ED.PRODUCTION;
    const warns = ED.warnings(S.code, i);
    const fwd = cur.rate * (1 - ED.FORWARD_COST);
    const routeOpts = d.routes.map((r) => {
      const cost = ED.routeCost(S.code, i, r);
      const spare = o.deadline - r.days;
      const tag = spare >= 4 ? `<span class="tag ok">${spare} days to spare</span>` : spare >= 0 ? `<span class="tag risk">${spare === 0 ? 'no' : spare + (spare === 1 ? ' day' : ' days')} to spare</span>` : `<span class="tag late">about ${-spare} days late</span>`;
      return `<label class="opt"><input type="radio" name="route" value="${r.id}" ${choice.route === r.id ? 'checked' : ''}>
        <span><b>${r.name}</b><br><span class="meta">About ${r.days} days. Damage risk ${pct(ED.DAMAGE[r.mode])}.</span> ${tag}</span>
        <span class="right">${lakh(cost)}${cost !== r.cost ? '<br><span class="tag late" style="font-family:var(--body)">price up</span>' : ''}</span></label>`;
    }).join('');
    const insureCost = Math.round(value * ED.INSURE_RATE);
    const ready = choice.route && choice.hedge !== null;
    app.innerHTML = bar() + `
      <div class="wrap">
        <div class="order">
          <section class="sheet">
            <p class="kicker" style="margin:0">Order ${i + 1} of ${ED.ORDERS.length}</p>
            <h2>${d.city}, ${d.country}</h2>
            <p style="font-size:18px">${esc(o.customer.charAt(0).toUpperCase() + o.customer.slice(1))} orders pumps worth <b>${fcy(d.cur, o.amount)}</b>, to be delivered within <b>${o.deadline} days</b>.</p>
            <div class="facts">
              <div><b>${lakh(value)}</b><span>Order value at today&rsquo;s rate (${rate(cur.rate)} per ${cur.symbol})</span></div>
              <div><b>${lakh(making)}</b><span>Cost to make the pumps</span></div>
              <div><b>${o.deadline} days</b><span>Deadline</span></div>
            </div>
          </section>
          <section class="sheet"><h3>Shipping news</h3>
            ${warns.length ? `<ul class="news">${warns.map((w) => `<li class="${w.kind}">${esc(w.text)}</li>`).join('')}</ul>` : '<p class="muted">Nothing unusual this week.</p>'}
          </section>
        </div>
        <section class="sheet"><h3>1. How do you ship it?</h3><div class="choices" role="radiogroup" aria-label="Route">${routeOpts}</div></section>
        <section class="sheet section"><h3>2. How do you handle the ${cur.name}?</h3>
          <p class="small muted" style="margin:0">The customer pays ${fcy(d.cur, o.amount)} when the pumps arrive. Today ${cur.symbol}1 = ${rate(cur.rate)}.</p>
          <div class="choices" role="radiogroup" aria-label="Currency">
            <label class="opt"><input type="radio" name="hedge" value="no" ${choice.hedge === false ? 'checked' : ''}><span><b>Wait and convert on payment day</b><br><span class="meta">You get whatever the rate is then. It could be better or worse.</span></span><span class="right">?</span></label>
            <label class="opt"><input type="radio" name="hedge" value="yes" ${choice.hedge === true ? 'checked' : ''}><span><b>Lock the rate now with a forward contract</b><br><span class="meta">${cur.symbol}1 = ${rate(fwd)} on payment day, whatever happens.</span></span><span class="right">${lakh(o.amount * fwd)}</span></label>
          </div></section>
        <section class="sheet section"><h3>3. Insure the cargo?</h3>
          <div class="choices"><label class="opt"><input type="checkbox" id="insure" ${choice.insure ? 'checked' : ''}><span><b>Buy cargo insurance</b><br><span class="meta">Pays the full cost of any damage on the way.</span></span><span class="right">${inr(insureCost)}</span></label></div></section>
      </div>
      <div class="actionbar"><div class="wrap"><span class="muted small">${ready ? 'Ready to ship.' : 'Choose a route and how to handle the currency.'}</span><button class="btn primary" data-act="ship" ${ready ? '' : 'disabled'}>Ship order ${i + 1}</button></div></div>
      <div class="wrap footer">${confirmRestart ? `<span style="color:var(--red)">This deletes the game on this device.</span> <button class="btn small dark" data-act="restart-yes">Delete and start over</button> <button class="btn small" data-act="restart-no">Keep playing</button>` : `<button class="btn ghost small" data-act="restart">Start over</button>`}</div>`;
  }

  function renderResult() {
    const r = S.history[S.history.length - 1];
    const o = ED.ORDERS[r.i];
    const d = ED.DEST[o.dest];
    const cur = ED.CUR[d.cur];
    const rows = [
      ['Customer paid, in rupees', r.received],
      ['Cost to make the pumps', -r.making],
      ['Freight', -r.freight],
      ['Insurance', -r.insurance],
      ['Late delivery penalty', -r.penalty],
      ['Damaged cargo', -r.damageLoss],
      ['Insurance claim', r.claim]
    ].filter(([, v]) => v !== 0);
    const fxMove = r.payRate / r.todayRate - 1;
    app.innerHTML = bar(r.i) + `
      <div class="wrap" style="padding-bottom:40px">
        <h2 style="margin-top:22px">Order ${r.i + 1}: ${d.city}</h2>
        <div class="kpis">
          <div class="kpi ${r.late ? 'bad' : 'good'}"><div class="small muted">Arrived after</div><div class="bignum">${r.days} days</div><div class="small">${r.late ? r.late + (r.late === 1 ? ' day' : ' days') + ' late' : 'On time (deadline ' + r.deadline + ' days)'}</div></div>
          <div class="kpi"><div class="small muted">${cur.symbol}1 on payment day</div><div class="bignum">${rate(r.payRate)}</div><div class="small">${fxMove >= 0 ? 'up' : 'down'} ${pct(Math.abs(fxMove))} from ${rate(r.todayRate)}${r.hedge ? '. You had locked ' + rate(r.usedRate) : ''}</div></div>
          <div class="kpi ${r.damaged ? 'bad' : ''}"><div class="small muted">Cargo</div><div class="bignum">${r.damaged ? 'Damaged' : 'Safe'}</div><div class="small">${r.damaged ? (r.insure ? 'Insurance paid the loss' : 'Not insured: you lost ' + lakh(r.damageLoss)) : 'Arrived in good condition'}</div></div>
          <div class="kpi ${r.profit < 0 ? 'bad' : 'good'}"><div class="small muted">Profit on this order</div><div class="bignum">${lakh(r.profit)}</div></div>
        </div>
        ${r.delays.length ? `<ul style="font-size:18px">${r.delays.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <section class="sheet" style="max-width:600px"><h3>Where the money went</h3>
          <table class="small pl"><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${inr(v)}</td></tr>`).join('')}<tr class="total"><td>Profit</td><td>${inr(r.profit)}</td></tr></tbody></table></section>
        <div class="row" style="margin-top:20px"><button class="btn primary" data-act="${S.done ? 'final' : 'next'}">${S.done ? 'See the final report' : 'Next order'}</button></div>
      </div>`;
    app.querySelector('[data-act=next],[data-act=final]')?.focus({ preventScroll: true });
  }

  function renderFinal() {
    const you = ED.summary(S);
    const bench = ED.STRATEGIES.map((st) => ({ st, s: ED.summary(ED.runStrategy(S.code, st)) }));
    const rank = [{ n: 'you', p: you.profit }].concat(bench.map((b) => ({ n: b.st.id, p: b.s.profit }))).sort((a, b) => b.p - a.p);
    const pos = rank.findIndex((r) => r.n === 'you') + 1;
    const orderRows = S.history.map((r) => {
      const o = ED.ORDERS[r.i], d = ED.DEST[o.dest];
      return `<tr><td>${r.i + 1}. ${d.city}</td><td>${esc(r.routeName)}</td><td class="r">${r.days} / ${r.deadline}</td><td>${r.hedge ? 'Locked' : 'Waited'}</td><td>${r.insure ? 'Yes' : 'No'}${r.damaged ? ' (damaged)' : ''}</td><td class="r"><b>${lakh(r.profit)}</b></td></tr>`;
    }).join('');
    const benchRows = [{ name: S.name + ' (you)', desc: 'Your decisions', s: you }].concat(bench.map((b) => ({ name: b.st.name, desc: b.st.desc, s: b.s })))
      .map((r) => `<tr><td><b>${esc(r.name)}</b><br><span class="tiny muted">${esc(r.desc)}</span></td><td class="r"><b>${lakh(r.s.profit)}</b></td><td class="r">${r.s.onTime} of 8</td><td class="r">${lakh(r.s.freight)}</td><td class="r">${lakh(r.s.penalty)}</td><td class="r">${lakh(r.s.damageLoss)}</td></tr>`).join('');
    const result = `Export Desk | ${S.name} | code ${S.code} | profit ${lakh(you.profit)} | on time ${you.onTime} of 8`;
    app.innerHTML = bar(ED.ORDERS.length) + `
    <div class="wrap" style="padding-bottom:40px">
      <section style="padding:26px 0 6px">
        <p class="kicker">Final report for ${esc(S.name)}, game code ${esc(S.code)}</p>
        <h1 style="font-size:clamp(40px,6vw,60px)">${lakh(you.profit)}</h1>
        <p style="font-size:20px;max-width:40em">Total profit on eight export orders. You delivered ${you.onTime} of 8 on time. Against the three standard strategies below, you placed ${pos} of 4.</p>
      </section>
      <div class="kpis">
        <div class="kpi"><div class="small muted">Spent on freight</div><div class="bignum">${lakh(you.freight)}</div></div>
        <div class="kpi ${you.penalty ? 'bad' : ''}"><div class="small muted">Late penalties</div><div class="bignum">${lakh(you.penalty)}</div></div>
        <div class="kpi ${you.fxGain < 0 ? 'bad' : 'good'}"><div class="small muted">Gain or loss from currency</div><div class="bignum">${lakh(you.fxGain)}</div></div>
        <div class="kpi ${you.damageLoss ? 'bad' : ''}"><div class="small muted">Uninsured damage</div><div class="bignum">${lakh(you.damageLoss)}</div></div>
      </div>
      <section class="sheet tablewrap"><h3>Your orders</h3>
        <table class="small"><thead><tr><th>Order</th><th>Route</th><th class="r">Days / deadline</th><th>Currency</th><th>Insured</th><th class="r">Profit</th></tr></thead><tbody>${orderRows}</tbody></table></section>
      <section class="sheet tablewrap" style="margin-top:16px"><h3>How the strategies compare</h3>
        <table class="small"><thead><tr><th>Strategy</th><th class="r">Profit</th><th class="r">On time</th><th class="r">Freight</th><th class="r">Penalties</th><th class="r">Uninsured damage</th></tr></thead><tbody>${benchRows}</tbody></table>
        <p class="tiny muted" style="margin-top:8px">All four faced the same delays, damage and currency moves.</p></section>
      <div class="grid2" style="margin-top:16px">
        <section class="sheet"><h3>Talk it over</h3>
          <ol class="questions small">
            <li>When was air freight worth paying for, and when was it money thrown away?</li>
            <li>Did the shipping news change any of your choices? What happened when you ignored it?</li>
            <li>Locking the rate cost a little every time. When did it save you, and when did it cost you?</li>
            <li>Cargo insurance costs 0.4% of the order. Why do most exporters buy it anyway?</li>
            <li>The cheapest strategy sometimes wins and sometimes loses badly. What does that tell you about risk?</li>
          </ol></section>
        <section class="sheet"><h3>Share your result</h3>
          <p class="small">Copy this line to share your result.</p>
          <div class="copybox"><input type="text" id="resultLine" readonly value="${esc(result)}"><button class="btn primary" data-act="copy">Copy my result</button></div>
          <p class="small" id="copymsg" role="status"></p>
          <button class="btn" data-act="again" style="margin-top:8px">Play again</button></section>
      </div>
      <p class="footer">The company, customers, prices and events in this game are made up for teaching.</p>
    </div>`;
  }

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (view !== 'order') return;
    if (t.name === 'route') choice.route = t.value;
    if (t.name === 'hedge') choice.hedge = t.value === 'yes';
    if (t.id === 'insure') choice.insure = t.checked;
    const id = t.id, name = t.name, val = t.value;
    keepScroll(renderOrder);
    const el = id ? document.getElementById(id) : app.querySelector(`input[name="${name}"][value="${val}"]`);
    if (el) el.focus({ preventScroll: true });
  });
  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'newcode') { document.getElementById('code').value = ED.randomCode(); return; }
    if (act === 'resume') { S = store.get(SAVE_KEY); resetChoice(); go('order'); return; }
    if (act === 'ship') { S = ED.play(S, choice); save(); go('result'); return; }
    if (act === 'next') { resetChoice(); go('order'); return; }
    if (act === 'final') { go('final'); return; }
    if (act === 'restart') { confirmRestart = true; keepScroll(renderOrder); return; }
    if (act === 'restart-no') { confirmRestart = false; keepScroll(renderOrder); return; }
    if (act === 'restart-yes' || act === 'again') { confirmRestart = false; store.del(SAVE_KEY); S = null; go('start'); return; }
    if (act === 'copy') {
      const inp = document.getElementById('resultLine'), msg = document.getElementById('copymsg');
      try { await navigator.clipboard.writeText(inp.value); msg.textContent = 'Copied.'; }
      catch (err) { inp.focus(); inp.select(); msg.textContent = 'Select the line above and copy it.'; }
    }
  });

  render();
})();
</script>
</body>
</html>
