<script>
/* Coffee Chain engine: a four-stage coffee supply chain, modelled on the beer game */
const CC = (() => {
  const ROLES = [
    { id: 'cafe', name: 'Caf\u00e9', place: 'München', sellsTo: 'Kundschaft', buysFrom: 'Verteiler' },
    { id: 'dist', name: 'Verteiler', place: 'München', sellsTo: 'Caf\u00e9', buysFrom: 'Großhändler' },
    { id: 'whole', name: 'Großhändler', place: 'Frankfurt', sellsTo: 'Verteiler', buysFrom: 'Kaffeerösterei' },
    { id: 'roaster', name: 'Kaffeerösterei', place: 'Hamburg', sellsTo: 'Großhändler', buysFrom: 'Kaffeeplantagen' }
  ];
  const WEEKS = 24;
  const HOLD = 10;        // per bag in stock per week (shown as €0.50)
  const BACK = 20;        // per bag owed (backlog) per week (shown as €1.00)
  const START_INV = 120;
  const BASE = 40;        // bags a week before the change
  const STEP = 80;        // bags a week after the change
  const STEP_WEEK = 5;
  const demand = (w) => (w < STEP_WEEK ? BASE : STEP);

  function newGame(opts) {
    const s = {
      v: 1, team: opts.team || 'Team', share: !!opts.share, week: 1, done: false,
      roles: ROLES.map(() => ({ inv: START_INV, backlog: 0, pipe: [BASE, BASE], lastOrder: BASE, cost: 0, hist: [] })),
      demandHist: []
    };
    step(s);
    return s;
  }

  /* receive, take orders, ship, count costs for the current week */
  function step(s) {
    const w = s.week;
    const R = s.roles;
    const arrived = R.map((r) => { const a = r.pipe[0]; r.pipe = [r.pipe[1], 0]; r.inv += a; return a; });
    const d = demand(w);
    s.demandHist.push(d);
    // the coffee estates always deliver what the roaster ordered last week
    R[3].pipe[1] += R[3].lastOrder;
    for (let i = 0; i < 4; i++) {
      const r = R[i];
      const incoming = i === 0 ? d : R[i - 1].lastOrder;
      const need = incoming + r.backlog;
      const sent = Math.min(r.inv, need);
      r.inv -= sent;
      r.backlog = need - sent;
      if (i > 0) R[i - 1].pipe[1] += sent;
      const cost = r.inv * HOLD + r.backlog * BACK;
      r.cost += cost;
      r.hist.push({ week: w, arrived: arrived[i], incoming, sent, inv: r.inv, backlog: r.backlog, cost, order: null });
    }
  }

  /* everyone has ordered: record the orders and move to next week */
  function playWeek(s0, orders) {
    const s = JSON.parse(JSON.stringify(s0));
    if (s.done) return s;
    s.roles.forEach((r, i) => {
      const q = Math.max(0, Math.round(Number(orders[i]) || 0));
      r.lastOrder = q;
      r.hist[r.hist.length - 1].order = q;
    });
    if (s.week >= WEEKS) { s.done = true; return s; }
    s.week += 1;
    step(s);
    return s;
  }

  /* what a role sees: the goods on the way and the order it is waiting on */
  function view(s, i) {
    const r = s.roles[i];
    const h = r.hist[r.hist.length - 1];
    const upstreamOwes = i < 3 ? s.roles[i + 1].backlog : 0;
    return { r, h, nextWeek: r.pipe[0], inTwoWeeks: r.pipe[1], lastOrder: r.lastOrder, owedToYou: upstreamOwes };
  }

  /* computer players */
  const POLICIES = {
    // anchoring and adjustment, as estimated for real players of the beer game
    typical(s, i, mem) {
      const r = s.roles[i], h = r.hist[r.hist.length - 1];
      mem.exp = mem.exp === undefined ? BASE : mem.exp + 0.36 * (h.incoming - mem.exp);
      const stock = r.inv - r.backlog;
      const supplyLine = r.pipe[0] + r.pipe[1] + r.lastOrder + (i < 3 ? s.roles[i + 1].backlog : 0);
      return Math.max(0, Math.round(mem.exp + 0.26 * (170 - stock - 0.34 * supplyLine)));
    },
    pass(s, i) {
      const r = s.roles[i];
      return r.hist[r.hist.length - 1].incoming;
    },
    // plans from the café's customer sales (shared information) and counts goods already on the way
    shared(s, i, mem) {
      const r = s.roles[i];
      const d = s.demandHist[s.demandHist.length - 1];
      mem.exp = mem.exp === undefined ? BASE : mem.exp + 0.8 * (d - mem.exp);
      const stock = r.inv - r.backlog;
      const supplyLine = r.pipe[0] + r.pipe[1] + r.lastOrder + (i < 3 ? s.roles[i + 1].backlog : 0);
      return Math.max(0, Math.round(mem.exp + (mem.exp * 4 - stock - supplyLine) / 6));
    }
  };

  function runPolicy(name, opts) {
    let s = newGame(Object.assign({ team: name }, opts || {}));
    const mem = [{}, {}, {}, {}];
    while (!s.done) s = playWeek(s, [0, 1, 2, 3].map((i) => POLICIES[name](s, i, mem[i])));
    return s;
  }

  const BENCHMARKS = [
    { id: 'typical', name: 'Typische Spieler', desc: 'Computerspieler, die so bestellen, wie es die meisten Menschen in diesem Spiel tun.' },
    { id: 'pass', name: 'Bestellung weitergeben', desc: 'Jede Stufe bestellt genau das, was in dieser Woche bei ihr bestellt wurde.' },
    { id: 'shared', name: 'Planung nach Kundenverkäufen', desc: 'Jede Stufe sieht die Verkäufe des Caf\u00e9s, plant danach und rechnet die bereits unterwegs befindliche Ware mit.' }
  ];

  function summary(s) {
    const roleCosts = s.roles.map((r) => r.cost);
    const total = roleCosts.reduce((a, b) => a + b, 0);
    const orders = s.roles.map((r) => r.hist.filter((h) => h.order !== null).map((h) => h.order));
    const sd = (a) => { if (a.length < 2) return 0; const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((x, y) => x + (y - m) * (y - m), 0) / (a.length - 1)); };
    const dsd = sd(s.demandHist.slice(0, orders[0].length));
    const swing = orders.map((o) => (dsd ? sd(o) / dsd : 0));
    const peak = orders.map((o) => (o.length ? Math.max(...o) : 0));
    const backlogWeeks = s.roles.map((r) => r.hist.filter((h) => h.backlog > 0).length);
    return { total, roleCosts, swing, peak, backlogWeeks };
  }

  return { ROLES, WEEKS, HOLD, BACK, START_INV, BASE, STEP, STEP_WEEK, demand, newGame, playWeek, view, POLICIES, runPolicy, BENCHMARKS, summary };
})();
if (typeof module !== 'undefined') module.exports = CC;

</script>

const ONLINE = (() => {
  const FB_VER = '10.12.2';
  const cfg = (typeof window !== 'undefined' && window.FIREBASE_CONFIG) || null;
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  };
  const mode = 'off';   // online team play is switched off on this site
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src));
      document.head.appendChild(s);
    });
  }

  /* ---------- Firebase adapter ---------- */
  function firebaseAdapter() {
    let db = null;
    return {
      mode: 'firebase',
      async init() {
        const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
        if (!window.firebase) {
          await loadScript(base + 'firebase-app-compat.js');
          await loadScript(base + 'firebase-auth-compat.js');
          await loadScript(base + 'firebase-database-compat.js');
        }
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
        db = firebase.database();
      },
      async get(p) { const s = await db.ref(p).get(); return s.exists() ? s.val() : null; },
      set(p, v) { return db.ref(p).set(v); },
      update(p, obj) { return db.ref(p).update(obj); },
      remove(p) { return db.ref(p).remove(); },
      on(p, cb) {
        const ref = db.ref(p);
        const h = (s) => cb(s.exists() ? s.val() : null);
        ref.on('value', h);
        return () => ref.off('value', h);
      },
      async transaction(p, fn) {
        const r = await db.ref(p).transaction((cur) => {
          const out = fn(cur === undefined ? null : cur);
          return out; // undefined aborts
        });
        return { committed: r.committed, value: r.snapshot.exists() ? r.snapshot.val() : null };
      },
      presence(p, info) {
        const ref = db.ref(p);
        const conn = db.ref('.info/connected');
        const h = (s) => {
          if (s.val() === true) {
            ref.onDisconnect().update({ online: false }).then(() => ref.update(Object.assign({}, info, { online: true, seen: Date.now() })));
          }
        };
        conn.on('value', h);
        const t = setInterval(() => { ref.update({ seen: Date.now(), online: true }); }, 30000);
        return () => { conn.off('value', h); clearInterval(t); ref.update({ online: false }); };
      }
    };
  }

  /* ---------- demo adapter: one browser, many tabs ---------- */
  function demoAdapter() {
    const KEY = 'scg-demo-db';
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
    const listeners = new Set();
    const notify = () => listeners.forEach((l) => l.check());
    const save = (t) => { ls.set(KEY, JSON.stringify(t)); setTimeout(notify, 0); };
    const keys = (p) => p.split('/').filter(Boolean);
    const getAt = (t, p) => keys(p).reduce((o, k) => (o && typeof o === 'object' ? o[k] : undefined), t);
    function setAt(t, p, v) {
      const ks = keys(p);
      let o = t;
      for (let i = 0; i < ks.length - 1; i++) {
        if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {};
        o = o[ks[i]];
      }
      const last = ks[ks.length - 1];
      if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
    }
    window.addEventListener('storage', (e) => { if (e.key === KEY) notify(); });
    // tabs take turns writing, so one tab never overwrites another's change
    const withLock = (fn) => (navigator.locks && navigator.locks.request ? navigator.locks.request('scg-demo-db', () => fn()) : Promise.resolve(fn()));
    const api = {
      mode: 'demo',
      async init() {},
      async get(p) { const v = getAt(load(), p); return v === undefined ? null : clone(v); },
      set(p, v) { return withLock(() => { const t = load(); setAt(t, p, v); save(t); }); },
      update(p, obj) { return withLock(() => { const t = load(); Object.keys(obj).forEach((k) => setAt(t, p + '/' + k, obj[k])); save(t); }); },
      remove(p) { return withLock(() => { const t = load(); setAt(t, p, null); save(t); }); },
      on(p, cb) {
        let last;
        const l = { check() { const v = getAt(load(), p); const s = JSON.stringify(v === undefined ? null : v); if (s !== last) { last = s; cb(JSON.parse(s)); } } };
        listeners.add(l);
        setTimeout(() => l.check(), 0);
        return () => listeners.delete(l);
      },
      transaction(p, fn) {
        return withLock(() => {
          const t = load();
          const cur = getAt(t, p);
          const out = fn(cur === undefined ? null : clone(cur));
          if (out === undefined) return { committed: false, value: cur === undefined ? null : cur };
          setAt(t, p, out); save(t);
          return { committed: true, value: out };
        });
      },
      presence(p, info) {
        const beat = () => api.update(p, Object.assign({}, info, { online: true, seen: Date.now() }));
        beat();
        const t = setInterval(beat, 4000);
        const bye = () => { const tr = load(); const cur = getAt(tr, p); if (cur) { cur.online = false; setAt(tr, p, cur); ls.set(KEY, JSON.stringify(tr)); } };
        window.addEventListener('pagehide', bye);
        return () => { clearInterval(t); window.removeEventListener('pagehide', bye); bye(); notify(); };
      }
    };
    return api;
  }

  const db = mode === 'firebase' ? firebaseAdapter() : mode === 'demo' ? demoAdapter() : null;
  let initP = null;
  function init() {
    if (!db) return Promise.reject(new Error('Online play is not set up.'));
    if (!initP) initP = db.init().catch((e) => { initP = null; throw e; });
    return initP;
  }

  /* ---------- helpers ---------- */
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }
  const pinHash = (code, pin) => hash('pin|' + code + '|' + pin);
  function encodePin(pin, pw) {
    let out = '';
    for (let i = 0; i < pin.length; i++) out += String.fromCharCode(48 + ((pin.charCodeAt(i) - 48 + pw.charCodeAt(i % pw.length)) % 10));
    return out;
  }
  function decodePin(enc, pw) {
    let out = '';
    for (let i = 0; i < enc.length; i++) out += String.fromCharCode(48 + ((((enc.charCodeAt(i) - 48 - pw.charCodeAt(i % pw.length)) % 10) + 10) % 10));
    return out;
  }
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() { let c = ''; for (let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
  const normCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  function newPin() { return String(1000 + Math.floor(Math.random() * 9000)); }

  function memberId(game) {
    const k = 'scg-member-' + game;
    let id = ss.get(k);
    if (!id) { id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); ss.set(k, id); }
    return id;
  }
  /* demo mode runs every player in one browser, so it keeps each tab's login separate */
  const sesStore = mode === 'demo'
    ? { get: ss.get, set: ss.set, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } }
    : ls;
  const session = {
    get(game) { try { return JSON.parse(sesStore.get('scg-session-' + game)); } catch (e) { return null; } },
    set(game, s) { sesStore.set('scg-session-' + game, JSON.stringify(s)); },
    clear(game) { sesStore.del('scg-session-' + game); }
  };

  /* members present in a team, oldest first */
  function onlineMembers(presence) {
    const now = Date.now();
    return Object.keys(presence || {}).map((id) => Object.assign({ id }, presence[id]))
      .filter((m) => m.online !== false && (mode === 'firebase' || now - (m.seen || 0) < 15000))
      .sort((a, b) => (a.joined || 0) - (b.joined || 0) || (a.id < b.id ? -1 : 1));
  }

  const P = {
    meta: (c) => `classes/${c}/meta`,
    teams: (c) => `classes/${c}/teams`,
    presence: (c, t) => `classes/${c}/presence/${t}`,
    play: (c, t) => `classes/${c}/play/${t}`,
    board: (c, t) => `classes/${c}/board${t ? '/' + t : ''}`
  };

  async function findClass(code) {
    await init();
    const meta = await db.get(P.meta(code));
    if (!meta) return null;
    const teams = (await db.get(P.teams(code))) || {};
    return { code, meta, teams };
  }

  const GAME_NAMES = { ss: 'Supplier Showdown', wr: 'Warehouse Rush', cc: 'Coffee Chain' };
  const GAME_PAGES = { ss: 'supplier-showdown.html', wr: 'warehouse-rush.html', cc: 'coffee-chain.html' };

  /* the join screen, shared by both games */
  function joinUI(el, game, onJoined) {
    let found = null, err = '', busy = false;
    const vals = { code: '', team: '', pin: '', name: (session.get(game) || {}).name || '' };
    function draw() {
      if (!found) {
        el.innerHTML = `
          <h3>Join your team</h3>
          <p class="small muted">Everyone in your team joins on their own phone or laptop with the same team and PIN.</p>
          <label for="jCode">Class code</label>
          <input type="text" id="jCode" maxlength="8" autocomplete="off" autocapitalize="characters" value="${esc(vals.code)}" style="text-transform:uppercase" placeholder="For example KX4P7Q">
          ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
          <button class="btn primary" type="button" data-j="find" style="width:100%;margin-top:12px" ${busy ? 'disabled' : ''}>${busy ? 'Looking for your class…' : 'Find my class'}</button>`;
      } else {
        const teams = Object.keys(found.teams).sort((a, b) => (found.teams[a].order || 0) - (found.teams[b].order || 0));
        el.innerHTML = `
          <h3>${esc(found.meta.name || 'Your class')}</h3>
          <p class="small muted">Class code ${esc(found.code)}. <button class="btn ghost small" type="button" data-j="back">Change</button></p>
          <label for="jTeam">Your team</label>
          <select id="jTeam"><option value="">Choose your team</option>${teams.map((t) => `<option value="${esc(t)}" ${vals.team === t ? 'selected' : ''}>${esc(found.teams[t].name)}</option>`).join('')}</select>
          <div style="height:10px"></div>
          <label for="jPin">Team PIN</label>
          <input type="text" id="jPin" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(vals.pin)}" placeholder="4 digits">
          <div style="height:10px"></div>
          <label for="jName">Your name</label>
          <input type="text" id="jName" maxlength="20" autocomplete="off" value="${esc(vals.name)}" placeholder="So your team knows who is who">
          ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
          <button class="btn primary" type="button" data-j="join" style="width:100%;margin-top:12px" ${busy ? 'disabled' : ''}>${busy ? 'Joining…' : 'Join team'}</button>`;
      }
      el.querySelectorAll('input,select').forEach((i) => i.addEventListener('input', () => {
        if (i.id === 'jCode') vals.code = i.value; if (i.id === 'jTeam') vals.team = i.value; if (i.id === 'jPin') vals.pin = i.value; if (i.id === 'jName') vals.name = i.value;
        if (err) { err = ''; el.querySelector('.err')?.remove(); }
      }));
      el.querySelectorAll('select').forEach((i) => i.addEventListener('change', () => { vals.team = i.value; }));
    }
    el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-j]');
      if (!b || busy) return;
      const act = b.dataset.j;
      if (act === 'back') { found = null; err = ''; draw(); return; }
      if (act === 'find') {
        const code = normCode(vals.code);
        if (code.length < 4) { err = 'Enter your class code.'; draw(); return; }
        busy = true; draw();
        try {
          const c = await findClass(code);
          busy = false;
          if (!c) { err = 'No class with code ' + code + '. Check the code.'; draw(); return; }
          if (c.meta.game !== game) {
            busy = false; found = null;
            err = '';
            el.innerHTML = `<h3>Wrong game</h3><p>Class ${esc(code)} is playing ${GAME_NAMES[c.meta.game]}.</p><a class="btn primary" href="${GAME_PAGES[c.meta.game]}">Open ${GAME_NAMES[c.meta.game]}</a> <button class="btn ghost" type="button" data-j="back">Try another code</button>`;
            return;
          }
          found = c; vals.code = code; draw();
        } catch (ex) { busy = false; err = 'Could not reach the game server. Check your internet connection and try again.'; draw(); }
        return;
      }
      if (act === 'join') {
        if (!vals.team) { err = 'Choose your team.'; draw(); return; }
        if (!/^\d{4}$/.test(vals.pin.trim())) { err = 'The team PIN is 4 digits.'; draw(); return; }
        if (!vals.name.trim()) { err = 'Enter your name.'; draw(); return; }
        const team = found.teams[vals.team];
        if (!team || team.pinHash !== pinHash(found.code, vals.pin.trim())) { err = 'That PIN doesn’t match this team. Check the PIN.'; draw(); return; }
        const s = { code: found.code, teamId: vals.team, teamName: team.name, name: vals.name.trim(), className: found.meta.name || '', game };
        session.set(game, s);
        onJoined(s);
      }
    });
    draw();
  }

  /* start presence for this device in its team; returns stop() */
  function startPresence(s) {
    const id = memberId(s.game);
    const joinedKey = 'scg-joined-' + s.game + '-' + s.code + '-' + s.teamId;
    let joined = Number(ss.get(joinedKey));
    if (!joined) { joined = Date.now(); ss.set(joinedKey, String(joined)); }
    return db.presence(P.presence(s.code, s.teamId) + '/' + id, { name: s.name, joined });
  }

  function enableDemo() { ls.set('scg-demo', '1'); }
  function disableDemo() { ls.del('scg-demo'); ls.del('scg-demo-db'); }

  return { mode, available: !!db, db, init, P, hash, pinHash, encodePin, decodePin, newCode, newPin, normCode, memberId, session, onlineMembers, findClass, joinUI, startPresence, enableDemo, disableDemo, GAME_NAMES, GAME_PAGES, esc, clone };
})();

</script>
<script>
(function () {
  const app = document.getElementById('app');
  const SAVE_KEY = 'cc-coffee-game-v1-de', BOARD_KEY = 'cc-coffee-board-v1-de';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const int = (n) => Math.round(n).toLocaleString('de-DE');
  const inr = (n) => { const v = Math.abs(n) * 0.05; const d = v < 100 ? 2 : 0; return (n < 0 ? '−' : '') + v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }) + '\u00A0€'; };
  const listNames = (arr) => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  const RC = ['var(--c-cafe)', 'var(--c-dist)', 'var(--c-whole)', 'var(--c-roaster)'];
  const RHEX = ['#A93A34', '#2C6B4C', '#1F4E8C', '#8A5B00'];

  let view = 'start', mode = null, S = null, settings = null, aiMem = null;
  let on = null, formError = '', errorMsg = '', showJoin = false, boardError = '', confirmClear = false, confirmRestart = false;
  let drafts = {}, draftWeek = 0, orderErr = {};

  function go(v) { view = v; render(); window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
  function keepScroll(fn) {
    const y = window.scrollY;
    const a = document.activeElement;
    const id = a && a.id, ss = a && a.selectionStart, se = a && a.selectionEnd;
    fn();
    window.scrollTo(0, y);
    if (id) { const el = document.getElementById(id); if (el) { el.focus({ preventScroll: true }); try { if (ss !== null && ss !== undefined) el.setSelectionRange(ss, se); } catch (e) {} } }
  }
  function save() { if (mode === 'practice' && S) store.set(SAVE_KEY, { S, settings, aiMem }); }

  /* ---------- roles ---------- */
  function members() {
    if (mode !== 'online') return [];
    const list = ONLINE.onlineMembers(on.presence);
    if (!list.some((m) => m.id === on.me)) list.push({ id: on.me, name: on.s.name, joined: Number.MAX_SAFE_INTEGER });
    return list;
  }
  function owners(mem) {
    const o = [[], [], [], []];
    const n = mem.length;
    if (!n) return o;
    if (n <= 4) for (let r = 0; r < 4; r++) o[r].push(mem[r % n]);
    else mem.forEach((m, k) => o[k % 4].push(m));
    return o;
  }
  function myRoles() {
    if (mode === 'practice') return settings.play === 'all' ? [0, 1, 2, 3] : [settings.role];
    return owners(members()).map((o, r) => (o.some((m) => m.id === on.me) ? r : -1)).filter((r) => r >= 0);
  }
  function weekOrders() {
    if (mode !== 'online' || !on.orders) return {};
    return on.orders['w' + S.week] || {};
  }
  const hasOrder = (wo, i) => wo['r' + i] !== undefined && wo['r' + i] !== null;

  function resetDraftsIfNewWeek() {
    if (draftWeek !== S.week) {
      drafts = {}; orderErr = {};
      S.roles.forEach((r, i) => { drafts[i] = String(r.lastOrder); });
      draftWeek = S.week;
    }
  }

  /* ---------- online ---------- */
  async function enterOnline(s) {
    mode = 'online'; S = null; errorMsg = ''; draftWeek = 0;
    go('connecting');
    try {
      await ONLINE.init();
      const db = ONLINE.db;
      const base = ONLINE.P.play(s.code, s.teamId);
      const team = await db.get(ONLINE.P.teams(s.code) + '/' + s.teamId);
      if (!team) throw new Error('team-missing');
      const meta = await db.get(ONLINE.P.meta(s.code));
      await db.transaction(base + '/core', (cur) => (cur ? undefined : { stateJson: JSON.stringify(CC.newGame({ team: team.name, share: !!(meta && meta.share) })) }));
      on = { s, base, db, me: ONLINE.memberId('cc'), presence: {}, orders: {}, advancing: false, mySent: {} };
      on.stop = ONLINE.startPresence(s);
      on.unsub = [
        db.on(base + '/core', (v) => { if (!v) return; const first = !S; S = JSON.parse(v.stateJson); if (first) writeBoard(S); sync(); }),
        db.on(base + '/orders', (v) => { on.orders = v || {}; sync(); }),
        db.on(ONLINE.P.presence(s.code, s.teamId), (v) => { on.presence = v || {}; sync(); })
      ];
      on.tick = setInterval(() => sync(), 5000);
    } catch (e) {
      errorMsg = e && e.message === 'team-missing'
        ? 'Your team no longer exists. Join again.'
        : 'Could not connect to your team. Check your internet connection and try again.';
      if (e && e.message === 'team-missing') ONLINE.session.clear('cc');
      go('error');
    }
  }
  function leaveOnline() {
    if (on) { try { on.unsub.forEach((u) => u()); on.stop && on.stop(); } catch (e) {} clearInterval(on.tick); }
    on = null; mode = null; S = null;
    ONLINE.session.clear('cc');
  }
  function sync() {
    if (!on || !S) return;
    if (S.done) { if (view !== 'final') go('final'); return; }
    // if an order this device sent hasn't reached the team yet, send it again
    const sentNow = on.mySent['w' + S.week] || {};
    const dbNow = on.orders['w' + S.week] || {};
    Object.keys(sentNow).forEach((k) => { if (dbNow[k] === undefined || dbNow[k] === null) on.db.set(on.base + '/orders/w' + S.week + '/' + k, sentNow[k]); });
    const sig = JSON.stringify([S.week, on.orders['w' + S.week] || null, members().map((m) => m.id + m.name)]);
    if (view !== 'play') { on.sig = sig; go('play'); }
    else if (sig !== on.sig) { on.sig = sig; keepScroll(renderPlay); }
    maybeAdvance();
  }
  function maybeAdvance() {
    if (!on || !S || S.done || on.advancing) return;
    const wo = weekOrders();
    if (![0, 1, 2, 3].every((i) => hasOrder(wo, i))) return;
    const w = S.week;
    const orders = [0, 1, 2, 3].map((i) => Number(wo['r' + i]));
    on.advancing = true;
    on.db.transaction(on.base + '/core', (cur) => {
      if (!cur) return cur;
      const st = JSON.parse(cur.stateJson);
      if (st.week !== w || st.done) return undefined;
      return { stateJson: JSON.stringify(CC.playWeek(st, orders)) };
    }).then((r) => {
      if (on) on.advancing = false;
      if (r.committed && r.value) writeBoard(JSON.parse(r.value.stateJson));
    }).catch(() => { if (on) on.advancing = false; });
  }
  function writeBoard(st) {
    if (mode !== 'online' || !on) return;
    const sm = CC.summary(st);
    on.db.set(ONLINE.P.board(on.s.code, on.s.teamId), { game: 'cc', team: st.team, week: st.week, cost: Math.round(sm.total), share: !!st.share, done: !!st.done, updated: Date.now() });
  }

  /* ---------- views ---------- */
  function render() {
    if (view === 'start') return renderStart();
    if (view === 'connecting') { app.innerHTML = `<div class="wrap" style="padding:60px 20px"><h2>Connecting to your team&hellip;</h2><p class="muted">This takes a few seconds.</p></div>`; return; }
    if (view === 'error') { app.innerHTML = `<div class="wrap" style="padding:60px 20px"><h2>Something went wrong</h2><p>${esc(errorMsg)}</p><div class="row">${ONLINE.session.get('cc') ? '<button class="btn primary" data-act="retry">Try again</button>' : ''}<button class="btn" data-act="tostart">Back to the start</button></div></div>`; return; }
    if (view === 'board') return renderBoard();
    if (!S) return renderStart();
    if (view === 'play') return renderPlay();
    if (view === 'final') return renderFinal();
  }

  function chainHtml(mine) {
    const st = (cls, title, sub, i) => `<div class="st ${cls}">${i !== undefined ? `<span class="bar4" style="background:${RC[i]}"></span>` : ''}<b>${title}</b><span>${sub}</span></div>`;
    return `<div class="chain" aria-label="The supply chain, from coffee estates to customers">
      ${st('edge', 'Kaffeeplantagen', 'Beliefern die Rösterei')}
      ${[3, 2, 1, 0].map((i) => st(mine && mine.includes(i) ? 'me' : '', CC.ROLES[i].name, CC.ROLES[i].place, i)).join('')}
      ${st('edge', 'Kundschaft', 'Kauft Kaffee im Caf\u00e9')}
    </div>
    <div class="flow"><span>Kaffee fließt in diese Richtung &rarr; (2 Wochen je Stufe)</span><span>&larr; Bestellungen fließen in diese Richtung (1 Woche)</span></div>`;
  }

  function onlineCard() {
    if (!ONLINE.available) {
      return `<div class="sheet"><h3>Play with your team online</h3>
        <p class="small">Each member plays a stage of the chain on their own phone or laptop and sees only their own stage, just like the real thing..</p>
        <p class="small muted">Online team play isn&rsquo;t set up on this site yet. You can play solo against the computer for now.</p></div>`;
    }
    const saved = ONLINE.session.get('cc');
    if (saved && !showJoin) {
      return `<div class="sheet"><h3>Play with your team online</h3>
        <p>You&rsquo;re in <b>${esc(saved.teamName)}</b>${saved.className ? ` (${esc(saved.className)})` : ''} as ${esc(saved.name)}.</p>

  /* ---------- final report ---------- */
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = (raw || 1) / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
  function lineChart(series, n, fmt, label) {
    const W = 680, H = 300, L = 56, R = 104, T = 14, B = 34;
    const all = series.flatMap((s) => s.values);
    let lo = Math.min(0, ...all), hi = Math.max(1, ...all);
    const pad = (hi - lo) * 0.06; hi += pad; if (lo < 0) lo -= pad;
    const x = (i) => L + (i * (W - L - R)) / (n - 1);
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const step = niceStep((hi - lo) / 5);
    let grid = '';
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      const z = Math.abs(v) < step / 2;
      grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${z ? '#1B2A41' : '#D5DAE1'}" stroke-width="${z ? 1.5 : 1}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#5B6676">${fmt(v)}</text>`;
    }
    let xl = '';
    for (let i = 0; i < n; i += 4) xl += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#5B6676">Wo. ${i + 1}</text>`;
    const ends = [];
    const lines = series.map((s) => {
      const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      ends.push({ y: y(s.values[s.values.length - 1]), x: x(s.values.length - 1), name: s.short || s.name, c: s.color });
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"><title>${esc(s.name)}</title></path>`;
    }).join('');
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
    const endLabels = ends.map((e) => `<text x="${e.x + 8}" y="${e.y + 4}" font-size="13" font-weight="600" fill="${e.c}">${esc(e.name)}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}${xl}${lines}${endLabels}</svg>`;
  }

  /* ---------- practice scoreboard ---------- */
  function getBoard() { return store.get(BOARD_KEY) || []; }
  function renderBoard() {
    const board = getBoard().slice().sort((a, b) => a.cost - b.cost);
    const max = Math.max(1, ...board.map((r) => r.cost));
    const bars = board.map((r, i) => `<div class="bar"><span><b>${i + 1}.</b> ${esc(r.team)}</span><span><span class="fill" style="width:${(r.cost / max) * 100}%"></span></span><span class="num" style="font-size:19px">${inr(r.cost)}</span></div>`).join('');
    const rows = board.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.team)}</td><td class="r">${inr(r.cost)}</td><td class="r"><button class="btn small" data-act="delrow" data-i="${esc(r.id)}" aria-label="Remove ${esc(r.team)}">Remove</button></td></tr>`).join('');
    app.innerHTML = `
    <div class="wrap">
      <section style="padding:26px 0 6px"><h1>Practice scoreboard</h1>
        <p style="font-size:19px">For solo games and games on one device. Type in each team&rsquo;s total cost; lowest cost ranks first. Kept on this device only.</p></section>
      <div class="grid2">
        <form class="sheet" id="boardForm" novalidate><h3>Add a team</h3>
          <label for="bTeam">Team or player name</label><input type="text" id="bTeam" maxlength="24" autocomplete="off">
          <div style="height:10px"></div>
          <label for="bCost">Total cost (€)</label><input type="number" id="bCost" min="0" inputmode="numeric" placeholder="e.g. 152340">
          ${boardError ? `<p class="err" role="alert">${esc(boardError)}</p>` : ''}
          <button class="btn primary" type="submit" style="margin-top:12px">Add to scoreboard</button></form>
        <div class="sheet"><h3>Ranking</h3>${board.length ? `<div class="bars2">${bars}</div>` : '<p class="muted">No teams yet. Add the first result on the left.</p>'}</div>
      </div>
      ${board.length ? `<section class="sheet tablewrap" style="margin-top:16px"><table class="small"><thead><tr><th>#</th><th>Team</th><th class="r">Total cost</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="row" style="margin-top:12px">${confirmClear ? `<span class="confirm small">Remove every team from this scoreboard?</span><button class="btn small dark" data-act="clear-yes">Clear scoreboard</button><button class="btn small" data-act="clear-no">Keep it</button>` : `<button class="btn small" data-act="clear">Clear scoreboard</button>`}</div></section>` : ''}
      <div class="row" style="margin:20px 0 50px"><button class="btn" data-act="home">Back to the game</button></div>
    </div>`;
    document.getElementById('boardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const team = document.getElementById('bTeam').value.trim();
      const cost = parseFloat(document.getElementById('bCost').value);
      if (!team) { boardError = 'Enter a team or player name.'; return renderBoard(); }
      if (!isFinite(cost) || cost < 0) { boardError = 'Enter the total cost in euros, for example 7617.'; return renderBoard(); }
      boardError = '';
      const b = getBoard();
      b.push({ id: String(Date.now()) + Math.random().toString(36).slice(2, 6), team, cost: Math.round(cost) });
      store.set(BOARD_KEY, b);
      renderBoard();
      document.getElementById('bTeam').focus();
    });
    ['bTeam', 'bCost'].forEach((id) => document.getElementById(id).addEventListener('input', () => { if (boardError) { boardError = ''; app.querySelector('#boardForm .err')?.remove(); } }));
  }

  /* ---------- actions ---------- */
  function readOrder(i) {
    const raw = String(drafts[i] !== undefined ? drafts[i] : '').trim();
    if (!/^\d{1,3}$/.test(raw)) return null;
    return Number(raw);
  }
  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id && t.id.startsWith('ord')) {
      const i = Number(t.dataset.i);
      drafts[i] = t.value;
      if (orderErr[i]) { delete orderErr[i]; t.closest('.orderbox').querySelector('.err')?.remove(); }
    }
  });
  app.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Enter' && t.id && t.id.startsWith('ord')) {
      e.preventDefault();
      if (mode === 'online') app.querySelector(`[data-act=send][data-i="${t.dataset.i}"]`)?.click();
      else app.querySelector('[data-act=sendall]')?.click();
    }
  });
  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'showjoin') { showJoin = true; renderStart(); return; }
    if (act === 'rejoin' || act === 'retry') { const s = ONLINE.session.get('cc'); if (s) enterOnline(s); return; }
    if (act === 'tostart') { leaveOnline(); go('start'); return; }
    if (act === 'leave') { leaveOnline(); showJoin = false; go('start'); return; }
    if (act === 'resume') { const sv = store.get(SAVE_KEY); if (sv && sv.S) { mode = 'practice'; S = sv.S; settings = sv.settings; aiMem = sv.aiMem || [{}, {}, {}, {}]; draftWeek = 0; go('play'); } return; }
    if (act === 'plus' || act === 'minus') {
      const i = Number(t.dataset.i);
      const cur = readOrder(i);
      const base = cur === null ? S.roles[i].lastOrder : cur;
      drafts[i] = String(Math.max(0, Math.min(999, base + (act === 'plus' ? 10 : -10))));
      delete orderErr[i];
      keepScroll(renderPlay);
      app.querySelector(`[data-act="${act}"][data-i="${i}"]`)?.focus({ preventScroll: true });
      return;
    }
    if (act === 'send') {
      const i = Number(t.dataset.i);
      const q = readOrder(i);
      if (q === null) { orderErr[i] = 'Geben Sie eine ganze Zahl von Säcken zwischen 0 und 999 ein.'; keepScroll(renderPlay); return; }
      on.orders = Object.assign({}, on.orders, { ['w' + S.week]: Object.assign({}, on.orders['w' + S.week] || {}, { ['r' + i]: q }) });
      on.mySent['w' + S.week] = Object.assign({}, on.mySent['w' + S.week] || {}, { ['r' + i]: q });
      on.db.set(on.base + '/orders/w' + S.week + '/r' + i, q);
      keepScroll(renderPlay);
      maybeAdvance();
      return;
    }
    if (act === 'sendall') {
      const mine = myRoles();
      let bad = false;
      mine.forEach((i) => { if (readOrder(i) === null) { orderErr[i] = 'Geben Sie eine ganze Zahl von Säcken zwischen 0 und 999 ein.'; bad = true; } });
      if (bad) { keepScroll(renderPlay); return; }
      const orders = [0, 1, 2, 3].map((i) => (mine.includes(i) ? readOrder(i) : CC.POLICIES.typical(S, i, aiMem[i])));
      S = CC.playWeek(S, orders);
      save();
      if (S.done) go('final'); else keepScroll(renderPlay);
      return;
    }
    if (act === 'restart') { confirmRestart = true; keepScroll(renderPlay); return; }
    if (act === 'restart-no') { confirmRestart = false; keepScroll(renderPlay); return; }
    if (act === 'restart-yes') { confirmRestart = false; store.del(SAVE_KEY); S = null; mode = null; go('start'); return; }
    if (act === 'copy') {
      const inp = document.getElementById('resultLine'), msg = document.getElementById('copymsg');
      try { await navigator.clipboard.writeText(inp.value); msg.textContent = 'Kopiert.'; }
      catch (err) { inp.focus(); inp.select(); msg.textContent = 'Markieren Sie die Zeile oben und kopieren Sie sie.'; }
      return;
    }
    if (act === 'board') { confirmClear = false; go('board'); return; }
    if (act === 'home') { go(S && mode === 'practice' ? (S.done ? 'final' : 'play') : 'start'); return; }
    if (act === 'again') { store.del(SAVE_KEY); S = null; mode = null; go('start'); return; }
    if (act === 'addself') {
      const b = getBoard();
      const gid = S.team + '|' + S.roles[0].hist.length + '|' + Math.round(CC.summary(S).total);
      if (b.some((r) => r.gameId === gid)) { document.getElementById('addmsg').textContent = 'This result is already on the scoreboard.'; return; }
      b.push({ id: String(Date.now()), gameId: gid, team: S.team, cost: Math.round(CC.summary(S).total) });
      store.set(BOARD_KEY, b);
      document.getElementById('addmsg').textContent = 'Added to the scoreboard.';
      return;
    }
    if (act === 'delrow') { store.set(BOARD_KEY, getBoard().filter((r) => r.id !== t.dataset.i)); renderBoard(); return; }
    if (act === 'clear') { confirmClear = true; renderBoard(); return; }
    if (act === 'clear-no') { confirmClear = false; renderBoard(); return; }
    if (act === 'clear-yes') { confirmClear = false; store.set(BOARD_KEY, []); renderBoard(); return; }
  });

  if (location.hash === '#scoreboard') view = 'board';
  render();
})();
</script>
