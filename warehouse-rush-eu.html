<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Rush</title>
<meta name="description" content="A classroom warehouse game: pick orders on a warehouse map, re-slot fast sellers with ABC analysis and try batch picking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1B2A41;
  --ink-2: #3A4A63;
  --muted: #5B6676;
  --concrete: #F2F3F5;
  --concrete-2: #DFE3E8;
  --sheet: #FFFFFF;
  --line: #D5DAE1;
  --yellow: #D6B25E;
  --yellow-soft: #F6F0DE;
  --blue: #1F4E8C;
  --blue-soft: #E4EBF5;
  --red: #A93A34;
  --red-soft: #F6E3E1;
  --green: #2C6B4C;
  --green-soft: #E1EEE6;
  --display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--concrete); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.55;
  font-variant-numeric: tabular-nums lining-nums;
}
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0 0 .45em; letter-spacing: -.005em; }
h1 { font-size: clamp(34px, 5.6vw, 56px); }
h2 { font-size: clamp(24px, 3.4vw, 32px); }
h3 { font-size: 21px; }
h4 { font-size: 18px; }
p { margin: 0 0 .8em; }
a { color: var(--blue); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.topbar { background: var(--ink); color: #fff; border-bottom: 3px solid var(--yellow); }
.topbar .wrap { display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap; }
.topbar a { color: #fff; text-decoration: none; font-family: var(--body); font-weight: 600; font-size: 16px; }
.topbar .wrap > a:first-child { font-family: var(--display); font-size: 20px; letter-spacing: .01em; }
.topbar a:hover { text-decoration: underline; }
.topbar .here { color: #C5CDD8; font-size: 15px; padding-left: 16px; border-left: 1px solid #4A5A73; }
.topbar .spacer { flex: 1; }
.topbar .versions { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; }
.switch { display: inline-flex; border: 1px solid #5A6B85; border-radius: 4px; overflow: hidden; }
.switch a { padding: 4px 12px; font-size: 14px; font-weight: 600; color: #C5CDD8; text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.switch a + a { border-left: 1px solid #5A6B85; }
.switch a:hover { color: #fff; text-decoration: none; background: #2A3D5C; }
.switch a[aria-current] { background: #fff; color: var(--ink); }
@media (max-width: 560px) { .topbar .versions { margin-left: 0; width: 100%; padding-top: 0; } }
.lane { display: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--ink-2); background: var(--sheet); color: var(--ink);
  border-radius: 4px; padding: 10px 18px; font-weight: 600; font-size: 16px;
  cursor: pointer; text-decoration: none; min-height: 44px; letter-spacing: .01em; white-space: nowrap;
}
.btn:hover { background: var(--concrete); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2A3D5C; }
.btn.dark { background: var(--sheet); color: var(--ink); border-color: var(--ink); }
.btn.dark:hover { background: var(--concrete); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary:disabled:hover { background: var(--ink); }
.actionbar .btn.primary, .orderbar .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.actionbar .btn.primary:hover, .orderbar .btn.primary:hover { background: #E2C47A; }
.actionbar .btn.primary:disabled:hover, .orderbar .btn.primary:disabled:hover { background: var(--yellow); }
.actionbar .btn:not(.primary), .orderbar .btn:not(.primary) { background: transparent; color: #fff; border-color: #8FA0B8; }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; padding-left: 4px; padding-right: 4px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 22px; }
.sheet > h3:first-child, .sheet > h2:first-child { padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.num { font-family: var(--display); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
label { display: block; font-weight: 600; font-size: 15px; }
input[type=text], input[type=number], input[type=password], select {
  font: inherit; font-weight: 400; display: block; width: 100%; margin-top: 4px;
  padding: 10px 12px; border: 1px solid #8C98A8; border-radius: 4px; background: #fff; color: var(--ink);
}
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus { border-color: var(--blue); }
.err { color: var(--red); font-size: 15px; font-weight: 600; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; border-bottom: 1px solid var(--ink-2); }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; }
.footer { padding: 40px 0 60px; color: var(--muted); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.wr-hero { padding: 36px 0 12px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: start; }
@media (max-width: 860px) { .wr-hero { grid-template-columns: 1fr; } }
.wr-hero .lede { font-size: 20px; max-width: 34em; }
.kicker { font-weight: 600; color: var(--blue); margin-bottom: 6px; }
.rounds { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-top: 3px solid var(--ink); }
.rounds li { padding: 14px 18px 6px 0; }
.rounds b { font-family: var(--display); font-size: 34px; color: var(--blue); display: block; line-height: 1; }
@media (max-width: 760px) { .rounds { grid-template-columns: 1fr; } }
.gamebar { background: var(--sheet); border-bottom: 1px solid var(--line); }
.gamebar .wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.teamtag { font-family: var(--display); font-weight: 600; font-size: 20px; }
.rsteps { display: flex; gap: 3px; flex: 1 1 300px; }
.rsteps span { flex: 1; font-size: 13px; text-align: center; padding: 3px 0 4px; border-bottom: 5px solid var(--concrete-2); color: var(--muted); }
.rsteps span.done { border-bottom-color: var(--green); }
.rsteps span.now { border-bottom-color: var(--yellow); color: var(--ink); font-weight: 600; }
.play { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(300px, .95fr); gap: 20px; margin: 18px 0 40px; align-items: start; }
@media (max-width: 900px) { .play { grid-template-columns: 1fr; } }
.mapbox { background: #D9DEE5; border: 1px solid var(--ink-2); border-radius: 4px; padding: 6px; }
.mapbox svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.slot { cursor: default; }
.slot rect { stroke: #7D8796; stroke-width: 1; fill: #FFFFFF; }
.slot text { font-family: var(--display); font-weight: 600; font-size: 15px; fill: #5B6676; pointer-events: none; }
.slot.empty rect { fill: #C3CAD4; stroke: #A7B0BC; }
.slot.target { cursor: pointer; }
.slot.target rect { fill: var(--yellow); stroke: var(--ink); stroke-width: 2.5; }
.slot.target text { fill: var(--ink); font-size: 17px; }
.slot.queued rect { fill: #EBD9A6; stroke: var(--blue); stroke-width: 3; }
.slot.picked rect { fill: var(--green); stroke: var(--green); }
.slot.picked text { fill: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .slot.target rect { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-width: 5; } }
}
.slot.clsA rect { fill: var(--blue); stroke: #163A68; }
.slot.clsA text { fill: #fff; }
.slot.clsB rect { fill: var(--blue-soft); stroke: #6C8FB8; }
.slot.clsB text { fill: #163A68; }
.slot.movable { cursor: pointer; }
.slot.sel rect { stroke: var(--red); stroke-width: 4; }
.slot.fast rect { stroke: #8A6A00; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.picklist { list-style: none; padding: 0; margin: 0 0 12px; }
.picklist li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.picklist .sku { font-family: var(--display); font-weight: 700; font-size: 22px; background: var(--yellow); text-align: center; border-radius: 4px; padding: 2px 0; }
.picklist li.done .sku { background: var(--green); color: #fff; }
.picklist li.done .pname { text-decoration: line-through; color: var(--muted); }
.tote { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 4px; border: 2px solid var(--ink); }
.tote.t1 { background: var(--sheet); }
.tote.t2 { background: var(--ink); color: #fff; }
.meter { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 12px 0; }
.meter div { background: var(--concrete); border-radius: 4px; padding: 8px 10px; }
.meter b { display: block; font-family: var(--display); font-size: 28px; line-height: 1.1; }
.meter span { font-size: 13px; color: var(--muted); }
.result { border-top: 3px solid var(--ink); padding-top: 12px; margin-top: 12px; }
.bignum { font-family: var(--display); font-weight: 700; font-size: 48px; line-height: 1; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin: 18px 0; }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } }
.kpi { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
.kpi .bignum { font-size: 40px; }
.up { color: var(--green); font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; margin: 8px 0; }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 3px; vertical-align: -3px; margin-right: 6px; border: 1px solid #7D8796; }
.questions { padding-left: 1.3em; }
.questions li { margin-bottom: 8px; }
.bars .bar { display: grid; grid-template-columns: 160px 1fr 110px; gap: 10px; align-items: center; margin-bottom: 6px; }
.bars .fill { height: 26px; background: var(--blue); border-radius: 3px; min-width: 2px; display: block; }
@media (max-width: 600px) { .bars .bar { grid-template-columns: 100px 1fr 80px; } }
.status { min-height: 1.5em; font-weight: 600; }
.confirm { color: var(--red); }
.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 8px; }
@media (max-width: 860px) { .choice { grid-template-columns: 1fr; } }
.teamstrip { background: var(--ink); color: #fff; }
.teamstrip .wrap { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-top: 8px; padding-bottom: 8px; font-size: 15px; }
.teamstrip .who { display: inline-flex; align-items: center; gap: 6px; }
.teamstrip .dot { width: 10px; height: 10px; border-radius: 50%; background: #8FD3A8; display: inline-block; }
.teamstrip .muted { color: #C5CDD8; }
.teamstrip .picking { color: var(--yellow); font-weight: 700; }
.turn { background: var(--yellow-soft); border-left: 5px solid var(--yellow); padding: 10px 12px; margin: 0 0 12px; font-weight: 600; }
.turn.mine { background: var(--yellow); border-left-color: var(--ink); }
.copybox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.copybox input { flex: 1 1 280px; margin: 0; }
</style>

<body>
<header class="topbar"><div class="wrap"><a href="index-eu.html">Supply Chain Games</a><span class="here">Warehouse Rush</span><div class="versions"><nav class="switch" aria-label="Version"><a href="warehouse-rush.html">India</a><a aria-current="page">Europe</a></nav><nav class="switch" aria-label="Language"><a aria-current="page">English</a><a href="warehouse-rush-de.html" lang="de" hreflang="de">Deutsch</a></nav></div></div></header>
<main id="app" tabindex="-1"></main>
<script>
/* Warehouse Rush engine: layout, distances, orders and best routes */
const WR = (() => {
  const AISLE_X = [3, 9, 15, 21];   // aisle centre lines, metres
  const BAYS = 8;
  const BAY_GAP = 2.5;
  const BACK_Y = 22.5;              // back cross-aisle
  const DOCK = { x: 12, y: -2 };    // dispatch door, 2 m in front of the front cross-aisle
  const SPEED = 1.2;                // walking speed with a trolley, m/s
  const PICK_SEC = 10;              // time to pick one line
  const TRIP_SEC = 20;              // print list, take trolley, drop at dispatch
  const ORDERS = 6;
  const PRODUCTS = [
    'Phone cover', 'USB-C cable', 'Wireless earbuds', 'Fast charger', 'Screen guard', 'Power bank',
    'Watch strap', 'Phone stand', 'Memory card', 'USB stick', 'Wired earphones', 'Bluetooth speaker',
    'Car charger', 'Wireless mouse', 'Fitness band', 'Selfie stick', 'Laptop sleeve', 'HDMI cable',
    'Keyboard', 'Tripod', 'Ring light', 'Headphones', 'Webcam', 'Smart bulb',
    'Extension lead', 'Game controller', 'Wi-Fi router', 'Trimmer', 'Desk lamp', 'Hard disk',
    'Smart plug', 'Mouse pad', 'Cable organiser', 'Laptop stand', 'Stylus pen', 'VR headset'
  ]; // listed from best seller to slowest seller
  const N = PRODUCTS.length;
  const WEIGHTS = PRODUCTS.map((_, k) => 1 / Math.pow(k + 1, 1.1));
  const WSUM = WEIGHTS.reduce((a, b) => a + b, 0);
  const CLASS = PRODUCTS.map((_, k) => (k < 7 ? 'A' : k < 18 ? 'B' : 'C'));

  /* seeded randomness */
  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rng(seed) {
    let a = hash(seed);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const normCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'PRACTICE';

  /* SKU codes: fixed, so the code does not reveal how well a product sells */
  const SKU = shuffle(Array.from({ length: N }, (_, i) => 11 + i * 2), rng('sku-codes'));

  /* slots: aisle a, side 0 (left face) or 1 (right face), bay b (0 = nearest the front) */
  const SLOTS = [];
  for (let a = 0; a < AISLE_X.length; a++) for (let side = 0; side < 2; side++) for (let b = 0; b < BAYS; b++) {
    SLOTS.push({ id: SLOTS.length, a, side, b, x: AISLE_X[a] + (side ? 1.7 : -1.7), y: BAY_GAP * (b + 1), label: 'ABCD'[a] + (b + 1) + (side ? 'R' : 'L') });
  }

  function node(n) { return n === 'dock' ? { x: DOCK.x, y: DOCK.y, dock: true } : { x: AISLE_X[SLOTS[n].a], y: SLOTS[n].y, a: SLOTS[n].a }; }

  /* walking distance between the dock or slot positions (picker stands in the aisle) */
  function dist(p, q) {
    const P = node(p), Q = node(q);
    if (P.dock && Q.dock) return 0;
    if (P.dock || Q.dock) { const S = P.dock ? Q : P; return Math.abs(DOCK.x - S.x) + S.y - DOCK.y; }
    if (P.a === Q.a) return Math.abs(P.y - Q.y);
    return Math.min(P.y + Q.y, 2 * BACK_Y - P.y - Q.y) + Math.abs(P.x - Q.x);
  }

  /* the corner points of that walk, for drawing and animation */
  function path(p, q) {
    const P = node(p), Q = node(q);
    if (P.dock && Q.dock) return [[P.x, P.y]];
    if (P.dock) return [[P.x, P.y], [P.x, 0], [Q.x, 0], [Q.x, Q.y]];
    if (Q.dock) return [[P.x, P.y], [P.x, 0], [Q.x, 0], [Q.x, Q.y]];
    if (P.a === Q.a) return [[P.x, P.y], [Q.x, Q.y]];
    const cy = P.y + Q.y <= 2 * BACK_Y - P.y - Q.y ? 0 : BACK_Y;
    return [[P.x, P.y], [P.x, cy], [Q.x, cy], [Q.x, Q.y]];
  }

  function routeLength(seq) {
    let d = 0, prev = 'dock';
    seq.forEach((s) => { d += dist(prev, s); prev = s; });
    return d + dist(prev, 'dock');
  }

  /* exact shortest round trip from the dock (Held-Karp); fine for up to ~12 stops */
  function bestRoute(stops) {
    const s = Array.from(new Set(stops));
    const n = s.length;
    if (n === 0) return { length: 0, order: [] };
    const FULL = 1 << n;
    const dp = new Float64Array(FULL * n).fill(Infinity);
    const par = new Int16Array(FULL * n).fill(-1);
    for (let i = 0; i < n; i++) dp[(1 << i) * n + i] = dist('dock', s[i]);
    for (let mask = 1; mask < FULL; mask++) {
      for (let i = 0; i < n; i++) {
        if (!(mask & (1 << i))) continue;
        const cur = dp[mask * n + i];
        if (cur === Infinity) continue;
        for (let j = 0; j < n; j++) {
          if (mask & (1 << j)) continue;
          const nm = mask | (1 << j);
          const v = cur + dist(s[i], s[j]);
          if (v < dp[nm * n + j]) { dp[nm * n + j] = v; par[nm * n + j] = i; }
        }
      }
    }
    let best = Infinity, last = -1;
    for (let i = 0; i < n; i++) { const v = dp[(FULL - 1) * n + i] + dist(s[i], 'dock'); if (v < best) { best = v; last = i; } }
    const order = [];
    let mask = FULL - 1, i = last;
    while (i !== -1) { order.unshift(s[i]); const p = par[mask * n + i]; mask &= ~(1 << i); i = p; }
    return { length: best, order };
  }

  /* layouts: array with one entry per slot, holding a product index or null */
  function randomLayout(code) {
    const r = rng(normCode(code) + '|layout');
    const slots = shuffle(SLOTS.map((s) => s.id), r);
    const lay = new Array(SLOTS.length).fill(null);
    for (let k = 0; k < N; k++) lay[slots[k]] = k;
    return lay;
  }
  const SLOTS_BY_DIST = SLOTS.map((s) => s.id).sort((a, b) => dist('dock', a) - dist('dock', b) || a - b);
  function bestLayout() {
    const lay = new Array(SLOTS.length).fill(null);
    for (let k = 0; k < N; k++) lay[SLOTS_BY_DIST[k]] = k;
    return lay;
  }
  const FAST_ZONE = new Set(SLOTS_BY_DIST.slice(0, 8));

  /* average walk per pick if every pick were its own round trip */
  function avgWalk(lay) {
    let t = 0;
    lay.forEach((k, slot) => { if (k !== null) t += (WEIGHTS[k] / WSUM) * 2 * dist('dock', slot); });
    return t;
  }

  function slotOf(lay, k) { return lay.indexOf(k); }

  /* the same six customer orders for every team with the same code */
  function makeOrders(code) {
    const r = rng(normCode(code) + '|orders');
    const out = [];
    for (let o = 0; o < ORDERS; o++) {
      const lines = 3 + Math.floor(r() * 3);
      const chosen = [];
      while (chosen.length < lines) {
        let x = r() * WSUM, k = 0;
        while (k < N - 1 && x > WEIGHTS[k]) { x -= WEIGHTS[k]; k++; }
        if (!chosen.includes(k)) chosen.push(k);
      }
      out.push(chosen);
    }
    return out;
  }

  /* last month's sales, for the ABC analysis */
  function salesTable() {
    const total = 9000;
    let cum = 0;
    return PRODUCTS.map((name, k) => {
      const picks = Math.round((WEIGHTS[k] / WSUM) * total);
      return { k, name, sku: SKU[k], picks, cls: CLASS[k] };
    }).map((row) => { cum += row.picks; return Object.assign(row, { cum }); })
      .map((row, _, arr) => Object.assign(row, { cumShare: row.cum / arr[arr.length - 1].cum }));
  }

  function tripTime(distance, lines) { return TRIP_SEC + lines * PICK_SEC + distance / SPEED; }

  function randomCode() {
    const words = ['DOCK', 'PALLET', 'FORKLIFT', 'TOTE', 'RACK', 'CRATE', 'PARCEL', 'SCANNER', 'LABEL', 'TROLLEY'];
    return words[Math.floor(Math.random() * words.length)] + (10 + Math.floor(Math.random() * 90));
  }

  return {

/* Online team play: Firebase Realtime Database, or a one-browser demo store */

  /* ---------- Firebase adapter ---------- */

      mode: 'firebase',

  /* ---------- demo adapter: one browser, many tabs ---------- */
  function demoAdapter() {
    const KEY = 'scg-demo-db';
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
    const listeners = new Set();
    const notify = () => listeners.forEach((l) => l.check());
    const save = (t) => { ls.set(KEY, JSON.stringify(t)); setTimeout(notify, 0); };
    const keys = (p) => p.split('/').filter(Boolean);
    const getAt = (t, p) => keys(p).reduce((o, k) => (o && typeof o === 'object' ? o[k] : undefined), t);

      const ks = keys(p);

      async init() {},
      async get(p) { const v = getAt(load(), p); return v === undefined ? null : clone(v); },

    set(game, s) { sesStore.set('scg-session-' + game, JSON.stringify(s)); },

          <input type="text" id="jName" maxlength="20" autocomplete="off" value="${esc(vals.name)}" placeholder="So your team knows who is who">

  /* start presence for this device in its team; returns stop() */

<script>
(function () {
  const app = document.getElementById('app');

  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const int = (n) => Math.round(n).toLocaleString('en-IE');
  const m1 = (n) => (Math.round(n * 10) / 10).toLocaleString('en-IE');
  const mmss = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');

    const list = ONLINE.onlineMembers(on.presence);

    return list;
  }

  }

    s.results[s.round].push(r);
    s.trip.done = true;
  }

    const rs = s.results[round] || [];
    const dist = rs.reduce((a, r) => a + r.dist, 0);
    const best = rs.reduce((a, r) => a + r.best, 0);
    const time = rs.reduce((a, r) => a + r.time, 0);

      const copy = JSON.parse(JSON.stringify(S));
      if (fn(copy) === false) return;
      S = copy; onState();
      return;
    }
    on.db.transaction(on.base + '/core', (cur) => {
      if (!cur) return cur;

      if (fn(s) === false) return undefined;

      r1: s.results[1].length === 6 ? Math.round(r[0].lph) : 0,
      r2: s.results[2].length === 6 ? Math.round(r[1].lph) : 0,

  /* ---------- map ---------- */
  const S_ = 20, X0 = 0.5, TOP = WR.BACK_Y + 2.2;
  const sx = (x) => (x + X0) * S_;
  const sy = (y) => (TOP - y) * S_;
  const MAP_W = 25 * S_, MAP_H = (TOP + 4.8) * S_;

  function slotStates() {
    const st = {};
    if (!S || !S.trip) return st;
    targetsOf(S).forEach((id) => { st[id] = 'target'; });
    S.trip.seq.forEach((id, i) => { st[id] = anim && i < anim.shown ? 'picked' : 'queued'; });
    return st;
  }

  function mapSvg(mode2, layout) {
    let floor = '';
    floor += `<rect x="${sx(0)}" y="${sy(0.8)}" width="${24 * S_}" height="${1.6 * S_}" fill="#EEF1F5"/>`;
    floor += `<rect x="${sx(0)}" y="${sy(WR.BACK_Y + 0.8)}" width="${24 * S_}" height="${1.6 * S_}" fill="#EEF1F5"/>`;
    WR.AISLE_X.forEach((ax, a) => {
      floor += `<rect x="${sx(ax - 0.8)}" y="${sy(WR.BACK_Y + 0.8)}" width="${1.6 * S_}" height="${(WR.BACK_Y + 1.6) * S_}" fill="#EEF1F5"/>`;
      floor += `<line x1="${sx(ax - 0.8)}" x2="${sx(ax - 0.8)}" y1="${sy(WR.BACK_Y - 0.8)}" y2="${sy(0.8)}" stroke="#D6B25E" stroke-width="2.5"/>`;
      floor += `<line x1="${sx(ax + 0.8)}" x2="${sx(ax + 0.8)}" y1="${sy(WR.BACK_Y - 0.8)}" y2="${sy(0.8)}" stroke="#D6B25E" stroke-width="2.5"/>`;
      floor += `<text x="${sx(ax)}" y="${sy(WR.BACK_Y + 1.35)}" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-weight="700" font-size="22" fill="#1B2A41">${'ABCD'[a]}</text>`;
    });
    floor += `<defs><pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#D6B25E"/><rect x="8" width="8" height="16" fill="#1B2A41"/></pattern></defs>`;
    floor += `<rect x="${sx(8)}" y="${sy(-1.2)}" width="${8 * S_}" height="${0.5 * S_}" fill="url(#haz)"/>`;
    floor += `<rect x="${sx(8)}" y="${sy(-1.7)}" width="${8 * S_}" height="${2.8 * S_}" fill="#1B2A41" rx="4"/>`;
    floor += `<text x="${sx(12)}" y="${sy(-3.85)}" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-weight="700" font-size="22" fill="#fff">Dispatch</text>`;
    const states = mode2 === 'pick' ? slotStates() : {};
    const canPick = mode2 === 'pick' && S.trip && !S.trip.done && S.trip.picker === myId();
    let slots = '';
    WR.SLOTS.forEach((s) => {
      const k = layout[s.id];
      const cls = ['slot'];
      if (k === null) cls.push('empty');
      if (states[s.id]) cls.push(states[s.id]);
      if (mode2 === 'slotting') {
        cls.push('movable');
        if (k !== null && WR.CLASS[k] !== 'C') cls.push('cls' + WR.CLASS[k]);
        if (WR.FAST_ZONE.has(s.id)) cls.push('fast');
        if (sel === s.id) cls.push('sel');
      }
      const w = 1.8 * S_, h = 2.2 * S_;
      const label = k === null ? '' : WR.SKU[k];
      const title = k === null ? `Empty slot ${s.label}` : `#${WR.SKU[k]} ${WR.PRODUCTS[k]} (slot ${s.label})`;
      const focusable = mode2 === 'slotting' || (canPick && states[s.id] === 'target');
      slots += `<g class="${cls.join(' ')}" data-slot="${s.id}" ${focusable ? `tabindex="0" role="button" aria-label="${esc(title)}"` : ''}><title>${esc(title)}</title>
        <rect x="${sx(s.x) - w / 2}" y="${sy(s.y) - h / 2}" width="${w}" height="${h}" rx="3"/>
        <text x="${sx(s.x)}" y="${sy(s.y) + 5}" text-anchor="middle">${label}</text></g>`;
    });
    let zone = '';
    if (mode2 === 'slotting') {
      WR.FAST_ZONE.forEach((id) => {
        const s = WR.SLOTS[id];
        zone += `<rect x="${sx(s.x) - 1.2 * S_}" y="${sy(s.y) - 1.35 * S_}" width="${2.4 * S_}" height="${2.7 * S_}" fill="none" stroke="#A8873A" stroke-width="3" stroke-dasharray="6 4" rx="5"/>`;
      });
    }
    const pick = mode2 === 'pick' ? `<polyline id="best" fill="none" stroke="#A93A34" stroke-width="4" stroke-dasharray="9 7" stroke-linejoin="round" points="" opacity="0"/>
      <polyline id="trail" fill="none" stroke="#1F4E8C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".75" points=""/>
      <g id="picker"><circle r="11" fill="#1B2A41" stroke="#D6B25E" stroke-width="4"/></g>` : '';
    return `<svg viewBox="0 0 ${MAP_W} ${MAP_H}" role="group" aria-label="Warehouse map with four aisles, A to D, and the dispatch door at the bottom">
      <rect width="${MAP_W}" height="${MAP_H}" fill="#D9DEE5"/>${floor}${zone}${slots}${pick}</svg>`;
  }

  /* ---------- picker animation, the same on every device ---------- */
  function syncAnim() {
    if (anim && anim.key === S.trip.key) return;
    anim = { key: S.trip.key, shown: 0, pos: 'dock', trail: [[WR.DOCK.x, WR.DOCK.y]], walked: 0, busy: false, returned: false, showBest: false };
    if (S.trip.seq.length) {
      // joined or reloaded part-way through a trip: jump straight to where the picker is
      S.trip.seq.forEach((id) => { WR.path(anim.pos, id).forEach((p) => anim.trail.push(p)); anim.walked += WR.dist(anim.pos, id); anim.pos = id; anim.shown++; });
      if (S.trip.done) { WR.path(anim.pos, 'dock').forEach((p) => anim.trail.push(p)); anim.walked += WR.dist(anim.pos, 'dock'); anim.pos = 'dock'; anim.returned = true; }
    }
  }
  function placePicker(pt) { const p = document.getElementById('picker'); if (p) p.setAttribute('transform', `translate(${sx(pt[0])},${sy(pt[1])})`); }
  function drawTrail() { const t = document.getElementById('trail'); if (t && anim) t.setAttribute('points', anim.trail.map((p) => `${sx(p[0])},${sy(p[1])}`).join(' ')); }
  function drawBest() {
    const b = document.getElementById('best');
    if (!b || !S.trip) return;
    const best = WR.bestRoute(targetsOf(S));
    const pts = [];
    let prev = 'dock';
    best.order.concat(['dock']).forEach((n) => { WR.path(prev, n).forEach((p) => pts.push(p)); prev = n; });
    b.setAttribute('points', pts.map((p) => `${sx(p[0])},${sy(p[1])}`).join(' '));
    b.setAttribute('opacity', '1');
  }
  function walk(from, to, done) {
    const a = anim;
    const pts = WR.path(from, to);
    a.walked += WR.dist(from, to);
    if (reduced || pts.length < 2) { pts.forEach((p) => a.trail.push(p)); drawTrail(); placePicker(pts[pts.length - 1]); done(); return; }
    const segs = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
    const speed = 22;
    const startTrail = a.trail.slice();
    let t0 = null;
    function step(ts) {
      if (anim !== a) return;
      if (t0 === null) t0 = ts;
      const d = Math.min(total, ((ts - t0) / 1000) * speed);
      const cur = [pts[0]];
      let rem = d, pos = pts[0];
      for (let i = 0; i < segs.length; i++) {
        if (rem >= segs[i]) { pos = pts[i + 1]; cur.push(pos); rem -= segs[i]; continue; }
        const f = segs[i] ? rem / segs[i] : 0;
        pos = [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f];
        cur.push(pos); break;
      }
      a.trail = startTrail.concat(cur);
      drawTrail(); placePicker(pos);
      if (d < total) requestAnimationFrame(step);
      else { a.trail = startTrail.concat(pts); done(); }
    }
    requestAnimationFrame(step);
  }
  function pump() {
    if (!anim || anim.busy || !S.trip || anim.key !== S.trip.key) return;
    const a = anim;
    if (a.shown < S.trip.seq.length) {
      const target = S.trip.seq[a.shown];
      a.busy = true;
      walk(a.pos, target, () => {
        if (anim !== a) return;
        a.pos = target; a.shown++; a.busy = false;
        const el = app.querySelector(`.slot[data-slot="${target}"]`);
        if (el) { el.classList.remove('queued', 'target'); el.classList.add('picked'); el.removeAttribute('tabindex'); }
        updateList();
        const mw = document.getElementById('mWalk'); if (mw) mw.textContent = m1(a.walked) + ' m';
        pump();
      });
      return;
    }
    if (S.trip.done && !a.returned && a.pos !== 'dock') {
      a.busy = true;
      walk(a.pos, 'dock', () => { if (anim !== a) return; a.pos = 'dock'; a.busy = false; a.returned = true; keepScroll(renderPlay); });
    }
  }
  function updateList() {
    const lis = app.querySelectorAll('.picklist li');
    const st = slotStates();
    tripLines(S).forEach((l, i) => { if (st[l.slot] === 'picked' && lis[i]) lis[i].classList.add('done'); });
  }

  /* ---------- views ---------- */
  function render() {
    if (view === 'start') return renderStart();
    if (view === 'connecting') { app.innerHTML = `<div class="wrap" style="padding:60px 20px"><h2>Connecting to your team&hellip;</h2><p class="muted">This takes a few seconds.</p></div>`; return; }
    if (view === 'error') { app.innerHTML = `<div class="wrap" style="padding:60px 20px"><h2>Something went wrong</h2><p>${esc(errorMsg)}</p><div class="row">${ONLINE.session.get('wr') ? '<button class="btn primary" data-act="retry">Try again</button>' : ''}<button class="btn" data-act="tostart">Back to the start</button></div></div>`; return; }
    if (view === 'board') return renderBoard();
    if (!S) return renderStart();
    if (view === 'intro') return renderIntro();
    if (view === 'play') return renderPlay();
    if (view === 'summary') return renderSummary();
    if (view === 'abc') return renderAbc();
    if (view === 'final') return renderFinal();
  }

  function bar() {
    const steps = [1, 2, 3].map((r) => `<span class="${r < S.round || S.view === 'final' ? 'done' : r === S.round ? 'now' : ''}">Round ${r}: ${ROUND_NAMES[r]}</span>`).join('');
    return `<div class="gamebar"><div class="wrap"><span class="teamtag">${esc(S.team)}</span><span class="small muted">${mode === 'online' ? 'Class ' + esc(on.s.code) : 'Code ' + esc(S.code)}</span><div class="rsteps">${steps}</div></div></div>` + teamStrip();
  }
  function teamStrip() {
    if (mode !== 'online') return '';
    const picking = S && S.view === 'play' && S.trip && !S.trip.done ? S.trip.picker : null;
    const who = members().map((m) => `<span class="who"><span class="dot" aria-hidden="true"></span><b>${esc(m.id === on.me ? m.name + ' (you)' : m.name)}</b>${m.id === picking ? ' <span class="picking">picking</span>' : ''}</span>`).join('');
    return `<div class="teamstrip" id="teamstrip"><div class="wrap"><span class="muted">Online now:</span>${who}</div></div>`;
  }

  function onlineCard() {
    if (!ONLINE.available) {
      return `<div class="sheet"><h3>Play with your team online</h3>
        <p class="small">Each member plays on their own phone or laptop. You take turns as the picker, and everyone sees the picker move live..</p>
        <p class="small muted">Online team play isn&rsquo;t set up on this site yet. You can practise on one device for now.</p></div>`;
    }
    const saved = ONLINE.session.get('wr');
    if (saved && !showJoin) {
      return `<div class="sheet"><h3>Play with your team online</h3>
        <p>You&rsquo;re in <b>${esc(saved.teamName)}</b>${saved.className ? ` (${esc(saved.className)})` : ''} as ${esc(saved.name)}.</p>
        <button class="btn primary" type="button" data-act="rejoin" style="width:100%">Continue with ${esc(saved.teamName)}</button>
        <button class="btn ghost small" type="button" data-act="showjoin" style="margin-top:8px">Join a different team</button></div>`;
    }
    return `<div class="sheet" id="joinBox"></div>`;
  }

  function renderStart() {
    app.innerHTML = `
    <div class="wrap">
      <section style="padding:36px 0 8px">
        <p class="kicker">A warehouse picking game in three rounds</p>
        <h1>Warehouse Rush</h1>
        <p class="lede" style="font-size:20px;max-width:36em">Black Friday week has started at a fulfilment centre outside Leipzig. You pick customer orders for phone and gadget accessories. Every metre you walk is time the customer waits. Find out how much faster the same orders can go.</p>
        <p class="muted">On day one, products were put wherever there was space. That is where you start.</p>
      </section>
      <div class="choice">
        <form class="sheet" id="startForm" novalidate>
          <h3>Start a game</h3>

          <input type="text" id="team" maxlength="24" autocomplete="off" placeholder="For example, Team Falcon">
          <div style="height:12px"></div>

          <div class="row" style="flex-wrap:nowrap">
            <input type="text" id="code" maxlength="16" autocomplete="off" value="${esc(WR.randomCode())}" style="text-transform:uppercase">
            <button type="button" class="btn small" data-act="newcode" style="margin-top:4px">New code</button>
          </div>
          <p class="tiny muted" style="margin-top:6px">Teams with the same code get the same warehouse and the same orders.</p>
          ${formError ? `<p class="err" role="alert">${esc(formError)}</p>` : ''}
          <button class="btn primary" type="submit" style="width:100%;margin-top:6px">Start the game</button>
        </form>

          <h3>How picking time is counted</h3>

            <li>Every trip starts and ends at dispatch and takes ${WR.TRIP_SEC} seconds to set up.</li>
            <li>Each line picked takes ${WR.PICK_SEC} seconds.</li>
            <li>Walking with a trolley covers ${WR.SPEED} metres a second. You can only walk along aisles.</li>

        <li><b>2</b><strong>ABC slotting.</strong> Study last month&rsquo;s sales, move the fast sellers next to dispatch, then pick the same orders again.</li>
        <li><b>3</b><strong>Batch picking.</strong> Pick two orders in one trip with a two-tote trolley, using your new layout.</li>
      </ol>
      <p class="footer">Products, sales figures and the warehouse in this game are made up for teaching.</p>

    const jb = document.getElementById('joinBox');
    if (jb) ONLINE.joinUI(jb, 'wr', (s) => { showJoin = false; enterOnline(s); });
    const f = document.getElementById('startForm');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const team = document.getElementById('team').value.trim();
      const code = WR.normCode(document.getElementById('code').value);
      if (!team) { formError = 'Enter a team name to start.'; renderStart(); document.getElementById('team').focus(); return; }
      formError = '';
      mode = 'practice'; anim = null; shown = '';
      S = newState(team, code);
      onState();
    });
    document.getElementById('team').addEventListener('input', () => { if (formError) { formError = ''; f.querySelector('.err')?.remove(); } });
  }

  function renderIntro() {
    const r = S.round;
    const text = {
      1: 'Six customer orders are waiting. Each order is one trip: start at dispatch, tap the gold shelves in the order you want to visit them, and the picker walks the route. Fewer metres means faster delivery.',
      2: 'The same six orders, now with your new layout. Choose your route again and watch the metres drop.',
      3: 'Now you pick two orders per trip, one in each tote on your trolley. You make three trips instead of six, using your ABC layout.'
    }[r];

  }

  function turnHtml() {
    if (mode !== 'online' || !S.trip || S.trip.done) return '<div id="turn"></div>';
    if (S.trip.picker === on.me) return `<div id="turn" class="turn mine">Your turn to pick. Tap the gold shelves in the order you want to walk.</div>`;
    const pickerOn = members().some((m) => m.id === S.trip.picker);
    if (!pickerOn) return `<div id="turn" class="turn">${esc(S.trip.pickerName)} has left. <button class="btn small" data-act="takeover">Take over picking</button></div>`;
    return `<div id="turn" class="turn">${esc(S.trip.pickerName)} is picking this trip. Help plan the route: which shelf next?</div>`;
  }

  function renderPlay() {
    const lay = layoutFor(S);
    const trips = tripsFor(S.round);
    const lines = tripLines(S);
    const st = slotStates();
    const listHtml = lines.map((l) => {
      const done = st[l.slot] === 'picked';
      return `<li class="${done ? 'done' : ''}"><span class="sku">${WR.SKU[l.k]}</span><span><span class="pname">${esc(WR.PRODUCTS[l.k])}</span><br><span class="tiny muted">Slot ${WR.SLOTS[l.slot].label}</span></span>${S.round === 3 ? `<span class="tote t${l.tote + 1}">Tote ${l.tote + 1}</span>` : `<span class="tiny muted">${done ? 'Picked' : ''}</span>`}</li>`;
    }).join('');
    const stops = targetsOf(S).length;
    const doneCount = lines.filter((l) => st[l.slot] === 'picked').length;
    const showDone = S.trip.done && anim && anim.returned;
    let resultHtml = '';
    if (showDone) {
      const r = S.results[S.round][S.tripIdx];
      const eff = r.best / r.dist;
      resultHtml = `<div class="result" role="status">
        <h3>Trip done</h3>
        <p>${mode === 'online' ? esc(r.by) + ' walked' : 'You walked'} <b>${m1(r.dist)} m</b>. The shortest route to the same shelves is <b>${m1(r.best)} m</b>${eff > 0.995 ? ', so the route was the best possible.' : ` (the route was ${Math.round(eff * 100)}% efficient).`}</p>
        <p class="small muted">Picker time for this trip: ${mmss(r.time)} (setup ${WR.TRIP_SEC} s, picking ${r.lines * WR.PICK_SEC} s, walking ${Math.round(r.dist / WR.SPEED)} s).</p>
        <div class="row">
          <button class="btn" data-act="togglebest" aria-pressed="${anim.showBest}">${anim.showBest ? 'Hide' : 'Show'} the shortest route</button>
          <button class="btn primary" data-act="nexttrip">${S.tripIdx + 1 < trips.length ? (S.round === 3 ? 'Next trip' : 'Next order') : 'See round results'}</button>
        </div></div>`;
    }
    const waitingText = S.trip.done && !showDone ? 'Walking back to dispatch…' : doneCount === 0 && S.trip.seq.length === 0 ? `${stops} stop${stops > 1 ? 's' : ''}, ${lines.length} line${lines.length > 1 ? 's' : ''}.` : 'The picker returns to dispatch after the last shelf.';
    app.innerHTML = bar() + `
    <div class="wrap">
      <div class="play">
        <div class="mapbox">${mapSvg('pick', lay)}</div>
        <div class="panel">
          <p class="kicker" style="margin:0">Round ${S.round}: ${ROUND_NAMES[S.round]}</p>
          <h2>${S.round === 3 ? `Trip ${S.tripIdx + 1} of ${trips.length}` : `Order ${S.tripIdx + 1} of ${trips.length}`}</h2>
          ${turnHtml()}
          <p class="small">${showDone ? 'Back at dispatch.' : (mode === 'practice' && S.trip.seq.length === 0 ? 'Tap the gold shelves in the order you want to walk. ' : '') + waitingText}</p>
          <ul class="picklist">${listHtml}</ul>
          <div class="meter">
            <div><b id="mWalk">${m1(anim ? anim.walked : 0)} m</b><span>Walked this trip</span></div>
            <div><b>${doneCount}/${lines.length}</b><span>Lines picked</span></div>
            <div><b>${S.results[S.round].length}/${trips.length}</b><span>Trips done</span></div>
          </div>
          <p class="status" id="status" aria-live="polite"></p>
          ${resultHtml}
        </div>
      </div>
    </div>`;
    drawTrail();
    if (anim) placePicker(anim.pos === 'dock' && !anim.busy ? [WR.DOCK.x, WR.DOCK.y] : anim.trail[anim.trail.length - 1]);
    if (showDone && anim.showBest) drawBest();
  }

  function renderSummary() {
    const r = S.round;
    const s = roundStats(S, r);
    const prev = r > 1 ? roundStats(S, r - 1) : null;
    const change = prev ? (s.lph / prev.lph - 1) : 0;
    const nextText = { 1: 'Next: study the sales data and re-slot the warehouse', 2: 'Next: batch picking', 3: 'See the final results' }[r];
    app.innerHTML = bar() + `
    <div class="wrap" style="padding-bottom:50px">
      <h2 style="margin-top:22px">Round ${r} results: ${ROUND_NAMES[r]}</h2>
      <div class="kpis">
        <div class="kpi"><div class="small muted">Lines per hour</div><div class="bignum">${int(s.lph)}</div>${prev ? `<div class="small ${change >= 0 ? 'up' : 'confirm'}">${change >= 0 ? '+' : ''}${Math.round(change * 100)}% on round ${r - 1}</div>` : ''}</div>
        <div class="kpi"><div class="small muted">Metres walked</div><div class="bignum">${int(s.dist)}</div><div class="small">${m1(s.perLine)} m per line</div></div>
        <div class="kpi"><div class="small muted">Picker time</div><div class="bignum">${mmss(s.time)}</div><div class="small">for ${s.lines} lines</div></div>
        <div class="kpi"><div class="small muted">Route efficiency</div><div class="bignum">${Math.round(s.eff * 100)}%</div><div class="small">shortest ${int(s.best)} m</div></div>
      </div>
      <p style="font-size:19px;max-width:40em">${r === 1 ? 'Look at where the gold shelves were: all over the warehouse. The best sellers were no closer to dispatch than products nobody buys.' : r === 2 ? 'Same orders, same picker. Only the layout changed.' : 'Fewer trips means fewer walks back to dispatch and less setup time.'}</p>
      <button class="btn primary" data-act="${r === 1 ? 'toabc' : r === 2 ? 'toround3' : 'tofinal'}">${nextText}</button>
    </div>`;
  }

  function paretoSvg() {
    const rows = WR.salesTable();
    const W = 680, H = 280, L = 48, R = 48, T = 14, B = 40;
    const maxP = rows[0].picks;
    const bw = (W - L - R) / rows.length;
    const y = (v) => T + (1 - v / maxP) * (H - T - B);
    const yc = (f) => T + (1 - f) * (H - T - B);
    const col = { A: '#1F4E8C', B: '#9DB8DA', C: '#D5DAE1' };
    const bars = rows.map((r, i) => `<rect x="${L + i * bw + 1}" y="${y(r.picks)}" width="${bw - 2}" height="${H - B - y(r.picks)}" fill="${col[r.cls]}"><title>#${r.sku} ${esc(r.name)}: ${int(r.picks)} picks (${r.cls})</title></rect>`).join('');
    const line = rows.map((r, i) => `${i ? 'L' : 'M'}${(L + (i + 0.5) * bw).toFixed(1)},${yc(r.cumShare).toFixed(1)}`).join(' ');
    let axes = '';
    [0, 0.25, 0.5, 0.75, 1].forEach((f) => { axes += `<line x1="${L}" x2="${W - R}" y1="${yc(f)}" y2="${yc(f)}" stroke="#D5DAE1"/><text x="${W - R + 6}" y="${yc(f) + 4}" font-size="12" fill="#5B6676">${f * 100}%</text>`; });
    [0, 1000, 2000].forEach((v) => { axes += `<text x="${L - 6}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="#5B6676">${int(v)}</text>`; });
    const a = rows[6], b = rows[17];
    const mark = (i, txt) => `<line x1="${L + (i + 1) * bw}" x2="${L + (i + 1) * bw}" y1="${T}" y2="${H - B}" stroke="#1B2A41" stroke-dasharray="4 4"/><text x="${L + (i + 1) * bw + 4}" y="${T + 12}" font-size="12" fill="#1B2A41" font-weight="600">${txt}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pareto chart of last month's picks by product. The top 7 products make ${Math.round(a.cumShare * 100)}% of picks.">${axes}${bars}<path d="${line}" fill="none" stroke="#A93A34" stroke-width="2.5"/>${mark(6, 'A: ' + Math.round(a.cumShare * 100) + '%')}${mark(17, 'A+B: ' + Math.round(b.cumShare * 100) + '%')}
      <text x="${L}" y="${H - 18}" font-size="12" fill="#5B6676">Best seller</text><text x="${W - R}" y="${H - 18}" font-size="12" text-anchor="end" fill="#5B6676">Slowest seller</text>
      <text x="${L}" y="${H - 4}" font-size="12" fill="#5B6676">Bars: picks last month (left scale). Red line: running share of all picks (right scale).</text></svg>`;
  }

  function renderAbc() {
    const lay = S.layouts[2];
    const before = WR.avgWalk(S.layouts[1]);
    const now = WR.avgWalk(lay);
    const best = WR.avgWalk(WR.bestLayout());
    const rows = WR.salesTable();
    const fastCount = [...WR.FAST_ZONE].filter((id) => lay[id] !== null && WR.CLASS[lay[id]] === 'A').length;
    const selInfo = sel === null ? 'Tap a shelf to pick it up, then tap where it should go. The two swap places.'
      : lay[sel] === null ? `Selected empty slot ${WR.SLOTS[sel].label}. Tap a product to move it here.`
      : `Selected #${WR.SKU[lay[sel]]} ${WR.PRODUCTS[lay[sel]]} (class ${WR.CLASS[lay[sel]]}, ${int(rows[lay[sel]].picks)} picks). Now tap where it should go.`;
    app.innerHTML = bar() + `
    <div class="wrap" style="padding-bottom:50px">
      <section style="padding:22px 0 6px">
        <p class="kicker">Round 2 of 3, before you pick</p>
        <h2>Which products earn a spot near dispatch?</h2>
        <p style="max-width:42em">This chart shows last month&rsquo;s picks for all 36 products, from best seller to slowest. A small group of products makes most of the picks. That is the Pareto (80/20) pattern, and it is the basis of ABC analysis.</p>
      </section>
      <section class="sheet chart">
          ${paretoSvg()}
          <div class="legend"><span><span class="sw" style="background:#1F4E8C"></span>A: top 7 products, ${Math.round(rows[6].cumShare * 100)}% of picks</span><span><span class="sw" style="background:#9DB8DA"></span>B: next 11, ${Math.round(rows[17].cumShare * 100) - Math.round(rows[6].cumShare * 100)}%</span><span><span class="sw" style="background:#D5DAE1"></span>C: last 18, ${100 - Math.round(rows[17].cumShare * 100)}%</span></div>
        </section>
      <h2 style="margin-top:26px">Re-slot the warehouse</h2>
      <div class="play" style="margin-top:8px">
        <div class="mapbox">${mapSvg('slotting', lay)}</div>
        <div class="panel">
          <p>Move the A products (dark blue) into the <b>fast-pick zone</b>, the 8 slots with dashed gold outlines nearest dispatch. Then put B products (light blue) close behind them.${mode === 'online' ? ' Everyone in the team can move shelves, and moves show up on every screen.' : ''}</p>
          <p class="status" aria-live="polite">${esc(selInfo)}</p>
          <div class="meter">
            <div><b>${m1(before)} m</b><span>Walk per pick on day one</span></div>
            <div><b>${m1(now)} m</b><span>Walk per pick now</span></div>
            <div><b>${fastCount}/7</b><span>A products in the fast zone</span></div>
          </div>
          <p class="tiny muted">Walk per pick is the average round trip from dispatch to a product and back, weighted by how often it sells. The best possible layout gives ${m1(best)} m.</p>
          <div class="row" style="margin-top:10px">
            <button class="btn primary" data-act="beginround2">Pick with this layout</button>
            <button class="btn" data-act="autoslot">Do it for me</button>
            <button class="btn ghost" data-act="resetslot">Undo all moves</button>
          </div>
          <div class="tablewrap" style="margin-top:14px">
            <h4>Top sellers and where they are now</h4>
            <table class="small"><thead><tr><th>SKU</th><th>Product</th><th class="r">Picks</th><th>Class</th><th>Now in</th></tr></thead>
            <tbody>${rows.slice(0, 10).map((r) => `<tr><td><b>${r.sku}</b></td><td>${esc(r.name)}</td><td class="r">${int(r.picks)}</td><td>${r.cls}</td><td>${WR.SLOTS[WR.slotOf(lay, r.k)].label}${WR.FAST_ZONE.has(WR.slotOf(lay, r.k)) ? ' <span class="up">fast zone</span>' : ''}</td></tr>`).join('')}</tbody></table>
          </div>
        </div>
      </div>
    </div>`;
  }

  function renderFinal() {
    const s = [1, 2, 3].map((r) => roundStats(S, r));
    const W = 680, H = 226, L = 236, R = 70;
    const max = Math.max(...s.map((x) => x.lph)) * 1.1 || 1;
    const bh = 46;
    const bars = s.map((x, i) => {
      const w = ((W - L - R) * x.lph) / max;
      const y = 8 + i * (bh + 24);
      return `<text x="${L - 10}" y="${y + bh / 2 + 5}" text-anchor="end" font-size="15" fill="#1B2A41" font-weight="600">Round ${i + 1}: ${ROUND_NAMES[i + 1]}</text>
        <rect x="${L}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${i === 0 ? '#D5DAE1' : i === 1 ? '#9DB8DA' : '#1F4E8C'}"/>
        <text x="${L + w + 8}" y="${y + bh / 2 + 6}" font-size="20" font-weight="700" fill="#1B2A41" font-family="Source Sans 3, Arial, sans-serif">${int(x.lph)}</text>`;
    }).join('');
    const gain = s[0].lph ? s[2].lph / s[0].lph - 1 : 0;
    const scoreSection = mode === 'online'
      ? `<section class="sheet"><h3>Class results</h3><p class="small">Your team&rsquo;s result is saved.</p><button class="btn" data-act="leave">Leave the team on this device</button></section>`
      : `<section class="sheet">
          <h3>Share your result</h3>
          <p class="small">Copy this line to share your team&rsquo;s result.</p>
          <div class="copybox"><input type="text" id="resultLine" readonly value="${esc(`Warehouse Rush | ${S.team} | code ${S.code} | round 1: ${int(s[0].lph)} lines an hour | round 3: ${int(s[2].lph)} lines an hour`)}"><button class="btn primary" data-act="copy">Copy my result</button></div>
          <p class="small" id="copymsg" role="status"></p>
          <button class="btn" data-act="again" style="margin-top:8px">Play again</button>
        </section>`;
    app.innerHTML = bar() + `
    <div class="wrap" style="padding-bottom:40px">
      <section style="padding:26px 0 8px">
        <p class="kicker">Final results for ${esc(S.team)}, ${mode === 'online' ? 'class ' + esc(on.s.code) : 'game code ' + esc(S.code)}</p>
        <h1 style="font-size:clamp(40px,6vw,60px)">${gain >= 0 ? '+' : ''}${Math.round(gain * 100)}% faster</h1>
        <p style="font-size:20px;max-width:40em">You picked the same six orders three times. Better slotting and batch picking took you from ${int(s[0].lph)} to ${int(s[2].lph)} lines per hour, and cut walking from ${int(s[0].dist)} m to ${int(s[2].dist)} m.</p>
      </section>
      <section class="sheet chart">
        <h3>Lines picked per hour</h3>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lines per hour: round 1 ${int(s[0].lph)}, round 2 ${int(s[1].lph)}, round 3 ${int(s[2].lph)}">${bars}</svg>
      </section>
      <section class="sheet tablewrap" style="margin-top:16px">
        <table class="small"><thead><tr><th>Round</th><th class="r">Trips</th><th class="r">Metres walked</th><th class="r">Shortest possible</th><th class="r">Route efficiency</th><th class="r">Picker time</th><th class="r">Lines per hour</th></tr></thead>
        <tbody>${s.map((x, i) => `<tr><td>${i + 1}: ${ROUND_NAMES[i + 1]}</td><td class="r">${S.results[i + 1].length}</td><td class="r">${int(x.dist)}</td><td class="r">${int(x.best)}</td><td class="r">${Math.round(x.eff * 100)}%</td><td class="r">${mmss(x.time)}</td><td class="r"><b>${int(x.lph)}</b></td></tr>`).join('')}</tbody></table>
      </section>
      <div class="grid2" style="margin-top:16px">
        <section class="sheet">
          <h3>Talk it over</h3>
          <ol class="questions small">
            <li>How much of the gain came from slotting, and how much from batch picking?</li>
            <li>Why does the Pareto pattern make ABC slotting so powerful?</li>
            <li>Was your own route close to the shortest one? When was it hardest to plan?</li>
            <li>Batch picking needs more sorting at dispatch. When would it not be worth it?</li>
            <li>Sales change with the seasons. How often should a warehouse re-slot, and what does moving stock cost?</li>
            <li>Where else could you save time: pick time, setup, or the warehouse layout itself?</li>
          </ol>
        </section>
        ${scoreSection}
      </div>
    </div>`;
  }

  /* ---------- practice scoreboard ---------- */
  function getBoard() { return store.get(BOARD_KEY) || []; }
  function renderBoard() {
    const board = getBoard().slice().sort((a, b) => b.r3 - a.r3);
    const max = Math.max(1, ...board.map((r) => r.r3));
    const bars = board.map((r, i) => `<div class="bar"><span><b>${i + 1}.</b> ${esc(r.team)}</span><span><span class="fill" style="width:${(r.r3 / max) * 100}%"></span></span><span class="num" style="font-size:19px">${int(r.r3)}</span></div>`).join('');
    const rows = board.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.team)}</td><td class="r">${r.r1 ? int(r.r1) : ''}</td><td class="r"><b>${int(r.r3)}</b></td><td class="r">${r.r1 ? '+' + Math.round((r.r3 / r.r1 - 1) * 100) + '%' : ''}</td><td class="r"><button class="btn small" data-act="delrow" data-i="${esc(r.id)}" aria-label="Remove ${esc(r.team)}">Remove</button></td></tr>`).join('');
    app.innerHTML = `
    <div class="wrap">
      <section style="padding:26px 0 6px">
        <h1>Practice scoreboard</h1>
        <p style="font-size:19px">For games played on one device per team. Type in each team&rsquo;s lines per hour. Teams are ranked on round 3.</p>
      </section>
      <div class="grid2">
        <form class="sheet" id="boardForm" novalidate>
          <h3>Add a team</h3>
          <label for="bTeam">Team name</label><input type="text" id="bTeam" maxlength="24" autocomplete="off">
          <div style="height:10px"></div>
          <div class="grid2" style="gap:10px">
            <div><label for="bR1">Round 1 lines per hour</label><input type="number" id="bR1" min="0" inputmode="numeric" placeholder="e.g. 98"></div>
            <div><label for="bR3">Round 3 lines per hour</label><input type="number" id="bR3" min="0" inputmode="numeric" placeholder="e.g. 176"></div>
          </div>
          ${boardError ? `<p class="err" role="alert">${esc(boardError)}</p>` : ''}
          <button class="btn primary" type="submit" style="margin-top:12px">Add to scoreboard</button>
        </form>
        <div class="sheet">
          <h3>Ranking, round 3</h3>
          ${board.length ? `<div class="bars">${bars}</div>` : '<p class="muted">No teams yet. Add the first team&rsquo;s result on the left.</p>'}
        </div>
      </div>
      ${board.length ? `<section class="sheet tablewrap" style="margin-top:16px"><table class="small"><thead><tr><th>#</th><th>Team</th><th class="r">Round 1</th><th class="r">Round 3</th><th class="r">Gain</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="row" style="margin-top:12px">${confirmClear ? `<span class="confirm small">Remove every team from this scoreboard?</span><button class="btn small dark" data-act="clear-yes">Clear scoreboard</button><button class="btn small" data-act="clear-no">Keep it</button>` : `<button class="btn small" data-act="clear">Clear scoreboard</button>`}</div></section>` : ''}
      <div class="row" style="margin:20px 0 50px"><button class="btn" data-act="home">Back to the game</button></div>
    </div>`;
    document.getElementById('boardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const team = document.getElementById('bTeam').value.trim();
      const r1raw = document.getElementById('bR1').value.trim();
      const r3 = parseFloat(document.getElementById('bR3').value);
      const r1 = r1raw === '' ? 0 : parseFloat(r1raw);
      if (!team) { boardError = 'Enter a team name.'; return renderBoard(); }
      if (!isFinite(r3) || r3 <= 0) { boardError = 'Enter round 3 lines per hour, for example 176.'; return renderBoard(); }
      if (!isFinite(r1) || r1 < 0) { boardError = 'Round 1 lines per hour must be a number.'; return renderBoard(); }
      boardError = '';
      const b = getBoard();
      b.push({ id: String(Date.now()) + Math.random().toString(36).slice(2, 6), team, r1, r3 });
      store.set(BOARD_KEY, b);
      renderBoard();
      document.getElementById('bTeam').focus();
    });
    ['bTeam', 'bR1', 'bR3'].forEach((id) => document.getElementById(id).addEventListener('input', () => {
      if (boardError) { boardError = ''; app.querySelector('#boardForm .err')?.remove(); }
    }));
  }

  /* ---------- taps and buttons ---------- */
  function tapSlot(id) {
    if (view === 'play') {
      const status = document.getElementById('status');
      if (!S.trip || S.trip.done) return;
      if (S.trip.picker !== myId()) { if (status) status.textContent = `It’s ${S.trip.pickerName}’s turn to pick. Tell them which shelf to go to next.`; return; }
      const targets = targetsOf(S);
      if (!targets.includes(id)) { if (status && !S.trip.seq.includes(id)) status.textContent = 'That shelf is not on this pick list. Look for the gold shelves.'; return; }
      if (S.trip.seq.includes(id)) return;
      if (status) status.textContent = '';
      const el = app.querySelector(`.slot[data-slot="${id}"]`);
      if (el) { el.classList.remove('target'); el.classList.add('queued'); }
      const key = S.trip.key;
      commit((s) => {
        if (!s.trip || s.trip.key !== key || s.trip.done || s.trip.seq.includes(id)) return false;
        s.trip.seq.push(id);
        if (targetsOf(s).every((t) => s.trip.seq.includes(t))) completeTrip(s);
      });
    } else if (view === 'abc') {
      if (sel === null) { sel = id; keepScroll(renderAbc); }
      else if (sel === id) { sel = null; keepScroll(renderAbc); }
      else {
        const a = sel, b = id;
        sel = null;
        commit((s) => { const lay = s.layouts[2]; const t = lay[a]; lay[a] = lay[b]; lay[b] = t; });
      }
      app.querySelector(`.slot[data-slot="${id}"]`)?.focus({ preventScroll: true });
    }
  }

  app.addEventListener('click', async (e) => {
    const slot = e.target.closest('.slot');
    if (slot) { tapSlot(Number(slot.dataset.slot)); return; }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'newcode') { document.getElementById('code').value = WR.randomCode(); return; }
    if (act === 'showjoin') { showJoin = true; renderStart(); return; }
    if (act === 'rejoin' || act === 'retry') { const s = ONLINE.session.get('wr'); if (s) enterOnline(s); return; }
    if (act === 'tostart') { leaveOnline(); go('start'); return; }
    if (act === 'leave') { leaveOnline(); showJoin = false; go('start'); return; }
    if (act === 'beginround') {
      const r = S.round;
      commit((s) => { if (s.view !== 'intro' || s.round !== r) return false; s.view = 'play'; s.tripIdx = 0; startTrip(s); });
      return;
    }
    if (act === 'nexttrip') {
      const idx = S.tripIdx, r = S.round;
      commit((s) => {
        if (s.round !== r || s.tripIdx !== idx || !s.trip || !s.trip.done) return false;
        s.tripIdx++;
        if (s.tripIdx < tripsFor(s.round).length) startTrip(s);
        else { s.view = 'summary'; s.trip = null; s.tripIdx = idx; }
      });
      return;
    }
    if (act === 'takeover') {
      const key = S.trip && S.trip.key;
      commit((s) => { if (!s.trip || s.trip.key !== key || s.trip.done) return false; s.trip.picker = on.me; s.trip.pickerName = on.s.name; });
      return;
    }
    if (act === 'togglebest') {
      anim.showBest = !anim.showBest;
      const b = document.getElementById('best');
      if (anim.showBest) drawBest(); else if (b) b.setAttribute('opacity', '0');
      t.textContent = (anim.showBest ? 'Hide' : 'Show') + ' the shortest route';
      t.setAttribute('aria-pressed', anim.showBest);
      return;
    }
    if (act === 'toabc') { commit((s) => { if (s.view !== 'summary' || s.round !== 1) return false; s.round = 2; s.view = 'abc'; }); return; }
    if (act === 'autoslot') { sel = null; commit((s) => { s.layouts[2] = WR.bestLayout(); }); return; }
    if (act === 'resetslot') { sel = null; commit((s) => { s.layouts[2] = s.layouts[1].slice(); }); return; }
    if (act === 'beginround2') { commit((s) => { if (s.view !== 'abc') return false; s.view = 'play'; s.round = 2; s.tripIdx = 0; startTrip(s); }); return; }
    if (act === 'toround3') { commit((s) => { if (s.view !== 'summary' || s.round !== 2) return false; s.round = 3; s.layouts[3] = s.layouts[2].slice(); s.view = 'intro'; }); return; }
    if (act === 'tofinal') { commit((s) => { if (s.view !== 'summary' || s.round !== 3) return false; s.view = 'final'; }); return; }
    if (act === 'copy') {
      const inp = document.getElementById('resultLine'), msg = document.getElementById('copymsg');
      try { await navigator.clipboard.writeText(inp.value); msg.textContent = 'Copied.'; }
      catch (err) { inp.focus(); inp.select(); msg.textContent = 'Select the line above and copy it.'; }
      return;
    }
    if (act === 'board') { confirmClear = false; go('board'); return; }
    if (act === 'home') { if (S && mode === 'practice') { shown = ''; onState(); } else go('start'); return; }
    if (act === 'again') { S = null; mode = null; anim = null; shown = ''; go('start'); return; }
    if (act === 'addself') {
      const s1 = roundStats(S, 1), s3 = roundStats(S, 3);
      const b = getBoard();
      const gid = S.team + S.code;
      if (b.some((r) => r.gameId === gid)) { document.getElementById('addmsg').textContent = 'This result is already on the scoreboard.'; return; }
      b.push({ id: String(Date.now()), gameId: gid, team: S.team, r1: Math.round(s1.lph), r3: Math.round(s3.lph) });
      store.set(BOARD_KEY, b);
      document.getElementById('addmsg').textContent = 'Added to the scoreboard.';
      return;
    }
    if (act === 'delrow') { store.set(BOARD_KEY, getBoard().filter((r) => r.id !== t.dataset.i)); renderBoard(); return; }
    if (act === 'clear') { confirmClear = true; renderBoard(); return; }
    if (act === 'clear-no') { confirmClear = false; renderBoard(); return; }
    if (act === 'clear-yes') { confirmClear = false; store.set(BOARD_KEY, []); renderBoard(); return; }
  });
  app.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('slot')) {
      e.preventDefault(); tapSlot(Number(e.target.dataset.slot));
    }
  });

  if (location.hash === '#scoreboard') view = 'board';
  render();
})();
</script>
</body>
</html>
