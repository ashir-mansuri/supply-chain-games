<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Showdown</title>
<meta name="description" content="A classroom sourcing game: choose suppliers for an electric e-bike maker and survive eight months of supply shocks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1B2A41;
  --ink-2: #3A4A63;
  --muted: #5B6676;
  --concrete: #F2F3F5;
  --concrete-2: #DFE3E8;
  --sheet: #FFFFFF;
  --line: #D5DAE1;
  --yellow: #D6B25E;
  --yellow-soft: #F6F0DE;
  --blue: #1F4E8C;
  --blue-soft: #E4EBF5;
  --red: #A93A34;
  --red-soft: #F6E3E1;
  --green: #2C6B4C;
  --green-soft: #E1EEE6;
  --display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--concrete); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.55;
  font-variant-numeric: tabular-nums lining-nums;
}
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0 0 .45em; letter-spacing: -.005em; }
h1 { font-size: clamp(34px, 5.6vw, 56px); }
h2 { font-size: clamp(24px, 3.4vw, 32px); }
h3 { font-size: 21px; }
h4 { font-size: 18px; }
p { margin: 0 0 .8em; }
a { color: var(--blue); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.topbar { background: var(--ink); color: #fff; border-bottom: 3px solid var(--yellow); }
.topbar .wrap { display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap; }
.topbar a { color: #fff; text-decoration: none; font-family: var(--body); font-weight: 600; font-size: 16px; }
.topbar .wrap > a:first-child { font-family: var(--display); font-size: 20px; letter-spacing: .01em; }
.topbar a:hover { text-decoration: underline; }
.topbar .here { color: #C5CDD8; font-size: 15px; padding-left: 16px; border-left: 1px solid #4A5A73; }
.topbar .spacer { flex: 1; }
.topbar .versions { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0; }
.switch { display: inline-flex; border: 1px solid #5A6B85; border-radius: 4px; overflow: hidden; }
.switch a { padding: 4px 12px; font-size: 14px; font-weight: 600; color: #C5CDD8; text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.switch a + a { border-left: 1px solid #5A6B85; }
.switch a:hover { color: #fff; text-decoration: none; background: #2A3D5C; }
.switch a[aria-current] { background: #fff; color: var(--ink); }
@media (max-width: 560px) { .topbar .versions { margin-left: 0; width: 100%; padding-top: 0; } }
.lane { display: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--ink-2); background: var(--sheet); color: var(--ink);
  border-radius: 4px; padding: 10px 18px; font-weight: 600; font-size: 16px;
  cursor: pointer; text-decoration: none; min-height: 44px; letter-spacing: .01em; white-space: nowrap;
}
.btn:hover { background: var(--concrete); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2A3D5C; }
.btn.dark { background: var(--sheet); color: var(--ink); border-color: var(--ink); }
.btn.dark:hover { background: var(--concrete); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary:disabled:hover { background: var(--ink); }
.actionbar .btn.primary, .orderbar .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.actionbar .btn.primary:hover, .orderbar .btn.primary:hover { background: #E2C47A; }
.actionbar .btn.primary:disabled:hover, .orderbar .btn.primary:disabled:hover { background: var(--yellow); }
.actionbar .btn:not(.primary), .orderbar .btn:not(.primary) { background: transparent; color: #fff; border-color: #8FA0B8; }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; padding-left: 4px; padding-right: 4px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 22px; }
.sheet > h3:first-child, .sheet > h2:first-child { padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.num { font-family: var(--display); font-weight: 600; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
label { display: block; font-weight: 600; font-size: 15px; }
input[type=text], input[type=number], input[type=password], select {
  font: inherit; font-weight: 400; display: block; width: 100%; margin-top: 4px;
  padding: 10px 12px; border: 1px solid #8C98A8; border-radius: 4px; background: #fff; color: var(--ink);
}
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus { border-color: var(--blue); }
.err { color: var(--red); font-size: 15px; font-weight: 600; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; border-bottom: 1px solid var(--ink-2); }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; }
.footer { padding-top: 40px; padding-bottom: 16px; color: var(--muted); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.credit { margin-top: 40px; border-top: 1px solid var(--line); background: var(--sheet); color: var(--muted); font-size: 13px; }
.credit .wrap { padding-top: 14px; padding-bottom: 18px; }
.credit a { color: inherit; text-decoration: underline; }
.credit a:hover { color: var(--ink); }

.ss-hero { padding: 36px 0 12px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: start; }
@media (max-width: 860px) { .ss-hero { grid-template-columns: 1fr; } }
.ss-hero .lede { font-size: 20px; max-width: 34em; }
.kicker { font-weight: 600; color: var(--blue); margin-bottom: 6px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; border-top: 3px solid var(--ink); }
.steps li { padding: 14px 16px 6px 0; }
.steps b { font-family: var(--display); font-size: 34px; color: var(--blue); display: block; line-height: 1; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr 1fr; } }
.gamebar { background: var(--sheet); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.gamebar .wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.months { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; flex: 1 1 420px; }
.months span { font-size: 12px; text-align: center; padding: 3px 0 4px; border-bottom: 5px solid var(--concrete-2); color: var(--muted); }
.months span.now { color: var(--ink); font-weight: 600; border-bottom-color: var(--yellow); }
.months span.up { border-bottom-color: var(--green); }
.months span.down { border-bottom-color: var(--red); }
.teamtag { font-family: var(--display); font-weight: 600; font-size: 20px; }
.score { font-family: var(--display); font-weight: 600; font-size: 22px; }
.brief { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; margin: 20px 0; }
@media (max-width: 860px) { .brief { grid-template-columns: 1fr; } }
.bignum { font-family: var(--display); font-weight: 700; font-size: 48px; line-height: 1; }
.news { list-style: none; padding: 0; margin: 0; }
.news li { padding: 10px 12px; border-left: 5px solid var(--line); background: #fff; margin-bottom: 8px; border-radius: 0; }
.news li.warn { border-left-color: var(--yellow); background: var(--yellow-soft); }
.news li.still { border-left-color: var(--red); background: var(--red-soft); }
.news li.lasting { border-left-color: var(--blue); background: var(--blue-soft); }
.news li.late { border-left-color: var(--ink-2); }
.part { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.part-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px 10px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
.part-head h3 { margin: 0; }
.sup { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 16px 12px; border-bottom: 1px solid var(--line); }
.sup:last-of-type { border-bottom: 0; }
.sup.on { background: #fff; box-shadow: inset 4px 0 0 var(--blue); }
.sup .name b { font-size: 18px; margin-right: 6px; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font-size: 15px; }
.risk-High { color: var(--red); font-weight: 600; }
.risk-Medium { color: #8A5B00; font-weight: 600; }
.risk-Low { color: var(--green); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border: 2px solid var(--ink); background: var(--sheet); border-radius: 6px; font-size: 22px; line-height: 1; cursor: pointer; font-weight: 600; }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.stepper output { min-width: 56px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; }
.tagnew { display: inline-block; font-size: 12px; background: var(--yellow-soft); color: #6B5200; padding: 1px 6px; border-radius: 4px; margin-top: 3px; }
.part-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; background: var(--concrete); font-size: 15px; flex-wrap: wrap; }
.total-ok { color: var(--green); font-weight: 600; }
.total-bad { color: var(--red); font-weight: 600; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--ink); background: var(--sheet); padding: 10px 16px; cursor: pointer; font-weight: 600; min-height: 44px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed=true] { background: var(--ink); color: #fff; }
.orderbar { position: sticky; bottom: 0; background: var(--ink); color: #fff; margin-top: 20px; z-index: 4; }
.orderbar .wrap { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
.orderbar .muted { color: #C5CDD8; }
@media (max-width: 600px) { .orderbar .wrap { padding-top: 8px; padding-bottom: 8px; gap: 8px; font-size: 15px; } }
.event-stage { min-height: 70vh; display: grid; place-items: center; padding: 30px 0; }
.event { width: min(640px, 100%); background: var(--sheet); border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .event { animation: cardin .7s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 0; }
  @keyframes cardin { from { transform: perspective(900px) rotateX(-75deg); opacity: 0; } to { transform: none; opacity: 1; } }
}
.event-band { height: 6px; background: var(--red); }
.event.good .event-band { background: var(--green); }
.event.calm .event-band { background: var(--ink-2); }
.event-body { padding: 22px 26px 26px; }
.event-body .when { font-weight: 600; color: var(--muted); }
.event-body h2 { font-size: clamp(36px, 6vw, 56px); margin: 6px 0 14px; }
.event-body p { font-size: 20px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin: 18px 0; }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } }
.kpi { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
.kpi .bignum { font-size: 40px; }
.kpi.bad .bignum { color: var(--red); }
.kpi.good .bignum { color: var(--green); }
.pl td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.pl tr.total td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; font-size: 19px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; margin-top: 6px; }
.legend span::before { content: ''; display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--c); vertical-align: middle; margin-right: 6px; }
.legend span.dash::before { border-top-style: dashed; }
.legend span.dot::before { border-top-style: dotted; }
.questions { padding-left: 1.3em; }
.questions li { margin-bottom: 8px; }
.bars .bar { display: grid; grid-template-columns: 160px 1fr 110px; gap: 10px; align-items: center; margin-bottom: 6px; }
.bars .fill { height: 26px; background: var(--blue); border-radius: 3px; min-width: 2px; }
.bars .fill.neg { background: var(--red); }
@media (max-width: 600px) { .bars .bar { grid-template-columns: 100px 1fr 90px; } }
.confirm { color: var(--red); }
.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 8px; }
@media (max-width: 860px) { .choice { grid-template-columns: 1fr; } }
.teamstrip { background: var(--ink); color: #fff; }
.teamstrip .wrap { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-top: 8px; padding-bottom: 8px; font-size: 15px; }
.teamstrip .who { display: inline-flex; align-items: center; gap: 6px; }
.teamstrip .dot { width: 10px; height: 10px; border-radius: 50%; background: #8FD3A8; display: inline-block; }
.teamstrip .who.ready .tick { color: var(--yellow); font-weight: 700; }
.teamstrip .muted { color: #C5CDD8; }
.owner { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--concrete); color: var(--ink-2); }
.owner.mine { background: var(--yellow); color: var(--ink); }
.part.locked .stepper button { opacity: .25; }
.waiting { color: #FFE27A; font-weight: 600; }
.copybox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.copybox input { flex: 1 1 280px; margin: 0; }
</style>
</head>

<header class="topbar"><div class="wrap"><a href="index-eu.html">Supply Chain Games</a><span class="here">Supplier Showdown</span><div class="versions"><nav class="switch" aria-label="Version"><a href="supplier-showdown.html">India</a><a aria-current="page">Europe</a></nav><nav class="switch" aria-label="Language"><a aria-current="page">English</a><a href="supplier-showdown-de.html" lang="de" hreflang="de">Deutsch</a></nav></div></div></header>
<main id="app" tabindex="-1"></main>
<script>
/* Supplier Showdown engine: pure functions, same results for the same game code */
const SS = (() => {
  const MONTHS = ['April', 'May', 'June', 'July', 'August', 'September', 'October', 'November'];
  const FORECAST = [950, 1000, 1000, 1050, 1100, 1150, 1400, 1250];
  const PRICE = 75000;          // selling price to dealers, per e-bike
  const ASSEMBLY = 12000;       // labour and other variable cost per e-bike built
  const FIXED = 15000000;       // fixed costs per month (shown as €450,000)
  const PENALTY = 5000;         // dealer penalty per e-bike not delivered
  const HOLD_RATE = 0.02;       // stock holding cost per month, share of unit price
  const PIPE_RATE = 0.015;      // money tied up in transit, per month of lead time
  const ONBOARD_FEE = 500000;   // one-time cost to approve a new supplier for a part
  const START_STOCK = 250;
  const BUFFERS = [
    { w: 0, label: 'None' },
    { w: 1, label: '1 week' },
    { w: 2, label: '2 weeks' },
    { w: 4, label: '4 weeks' }
  ];

  const REGIONS = {
    CN: { city: 'Shenzhen', country: 'China', lead: 6, duty: 0.15, freight: 0.04, defect: 0.03, rel: 0.93, carbon: 1.0, risk: 'High' },
    VN: { city: 'Hanoi', country: 'Vietnam', lead: 4, duty: 0.10, freight: 0.035, defect: 0.02, rel: 0.95, carbon: 0.85, risk: 'Medium' },
    IN: { city: 'Wrocław', country: 'Poland', lead: 1, duty: 0, freight: 0.01, defect: 0.015, rel: 0.97, carbon: 0.4, risk: 'Low' },
    DE: { city: 'Taichung', country: 'Taiwan', lead: 3, duty: 0.10, freight: 0.06, defect: 0.004, rel: 0.99, carbon: 0.9, risk: 'Low' }
  };
  const REGION_IDS = ['CN', 'VN', 'IN', 'DE'];

  const PARTS = [
    { id: 'battery', name: 'Battery pack', base: 28000, carbon: 60, mult: { CN: 0.74, VN: 0.88, IN: 1.00, DE: 1.28 }, cap: { IN: 60 }, freight: {} },
    { id: 'motor', name: 'Hub motor', base: 9000, carbon: 15, mult: { CN: 0.80, VN: 0.90, IN: 0.96, DE: 1.22 }, cap: {}, freight: {} },
    { id: 'chip', name: 'Controller chip', base: 4000, carbon: 2, mult: { CN: 0.78, VN: 0.86, IN: 1.12, DE: 1.20 }, cap: { IN: 40 }, freight: {} },
    { id: 'tyres', name: 'Tyre set', base: 2000, carbon: 6, mult: { CN: 0.82, VN: 0.90, IN: 0.94, DE: 1.25 }, cap: {}, freight: { CN: 0.12, VN: 0.09, DE: 0.10 } }
  ];

  const EVENTS = {
    fire: {
      title: 'Fire at the Shenzhen battery plant', kind: 'bad',
      text: 'Your Shenzhen battery supplier has shut down after a fire. No batteries will come from China this month or next month.',
      effects: [{ type: 'delivery', regions: ['CN'], parts: ['battery'], factors: [0, 0] }]
    },
    shipping: {
      title: 'Shipping lane blocked', kind: 'bad',
      text: 'Container ships from East Asia are being sent the long way round Africa. Only 30% of this month’s shipments from China and Vietnam arrive on time. The rest arrive next month.',
      effects: [{ type: 'delivery', regions: ['CN', 'VN'], parts: null, factors: [0.3], late: true }]
    },
    lockdown: {
      title: 'Lockdown in Shenzhen', kind: 'bad',
      text: 'Factories in Shenzhen are closed for three weeks. Chinese suppliers deliver 25% of orders this month and 60% next month.',
      effects: [{ type: 'delivery', regions: ['CN'], parts: null, factors: [0.25, 0.6] }]
    },
    floods: {
      title: 'Floods around Wrocław', kind: 'bad',
      text: 'Heavy rain has flooded roads and factories around Wrocław. Wrocław suppliers deliver only 40% of orders this month.',
      warn: 'Weather services expect very heavy rain over southern Poland this month.',
      effects: [{ type: 'delivery', regions: ['IN'], parts: null, factors: [0.4] }]
    },
    strike: {
      title: 'Truckers’ strike in Poland', kind: 'bad',
      text: 'A transport strike stops trucks leaving Wrocław for two weeks. Wrocław suppliers deliver half of this month’s orders.',
      warn: 'Truckers’ unions in Poland are threatening a strike this month.',
      effects: [{ type: 'delivery', regions: ['IN'], parts: null, factors: [0.5] }]
    },
    chips: {
      title: 'Global chip shortage', kind: 'bad',
      text: 'Car makers are buying every chip they can find. Chip suppliers deliver 60% of orders this month and next month. Taichung has long-term contracts and delivers 90%.',
      effects: [
        { type: 'delivery', regions: ['CN', 'VN', 'IN'], parts: ['chip'], factors: [0.6, 0.6] },
        { type: 'delivery', regions: ['DE'], parts: ['chip'], factors: [0.9, 0.9] }
      ]
    },
    rupee: {
      title: 'Euro falls 8%', kind: 'bad',
      text: 'The euro has dropped against the dollar and Asian currencies. Every part from Asia costs 8% more from this month, for the rest of the year.',
      effects: [{ type: 'price', regions: ['CN', 'VN', 'DE'], mult: 1.08 }]
    },
    tariff: {
      title: 'New tariff on Chinese EV parts', kind: 'bad',
      text: 'The EU has added 20% import duty on e-bike parts from China, starting this month.',
      effects: [{ type: 'duty', regions: ['CN'], add: 0.20 }]
    },
    recall: {
      title: 'Faulty motors from Hanoi', kind: 'bad',
      text: 'A batch of hub motors from Hanoi has faulty wiring. 25% of this month’s Vietnamese motors fail inspection and are scrapped.',
      effects: [{ type: 'defect', regions: ['VN'], parts: ['motor'], rate: 0.25 }]
    },
    recallCN: {
      title: 'Faulty chips from Shenzhen', kind: 'bad',
      text: 'A batch of controller chips from Shenzhen fails testing. 20% of this month’s Chinese chips are scrapped.',
      effects: [{ type: 'defect', regions: ['CN'], parts: ['chip'], rate: 0.20 }]
    },
    incentive: {
      title: 'EU support for local suppliers', kind: 'good',
      text: 'A new EU programme supports European part makers. Wrocław suppliers cut their prices by 6% from this month.',
      effects: [{ type: 'price', regions: ['IN'], mult: 0.94 }]
    },
    festive: {
      title: 'Christmas pre-order rush', kind: 'good',
      text: 'Dealers’ Christmas pre-orders are 15% above forecast this month. Can you build enough e-bikes?',
      effects: [{ type: 'demand', mult: 1.15 }]
    },
    rival: {
      title: 'Rival e-bike recalled', kind: 'good',
      text: 'A competitor has recalled its e-bikes. Dealers want 10% more of yours this month.',
      effects: [{ type: 'demand', mult: 1.10 }]
    },
    calm: {
      title: 'A quiet month', kind: 'calm',
      text: 'No surprises this month. Suppliers deliver as normal.',
      effects: []
    }
  };

  /* ---------- seeded randomness ---------- */
  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {

    return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'PRACTICE';
  }

  /* ---------- event schedule: same for every team with the same code ---------- */
  function schedule(code) {
    const r = rng(normCode(code) + '|schedule');
    const s = new Array(8).fill(null);
    s[0] = 'calm';
    s[6] = 'festive';
    s[pick(r, [2, 3])] = pick(r, ['fire', 'shipping', 'lockdown']);
    s[pick(r, [4, 5])] = pick(r, ['floods', 'strike']);

    free = free.filter((m) => m !== g);
    const q = pick(r, free); s[q] = pick(r, ['recall', 'recallCN']);
    free = free.filter((m) => m !== q);

        const offset = m - k;
        if (e.type === 'delivery' || e.type === 'defect' || e.type === 'demand') {
          const len = e.factors ? e.factors.length : 1;
          if (offset < len) out.push({ e, offset, id: s[k], start: k });

      if (e.type === 'delivery') {
        notes.push({ kind: 'still', id, text: ev.title + ': still affecting deliveries this month (' + Math.round(e.factors[offset] * 100) + '% of orders from ' + e.regions.map((r) => REGIONS[r].city).join(', ') + (e.parts ? ', ' + e.parts.map(partName).join(', ') : '') + ').' });

        notes.push({ kind: 'lasting', id, text: ev.title + ': prices from ' + e.regions.map((r) => REGIONS[r].city).join(', ') + ' are ' + (e.mult > 1 ? 'up ' : 'down ') + Math.round(Math.abs(e.mult - 1) * 100) + '%.' });
      } else if (e.type === 'duty') {
        notes.push({ kind: 'lasting', id, text: ev.title + ': import duty from ' + e.regions.map((r) => REGIONS[r].city).join(', ') + ' is ' + Math.round(e.add * 100) + ' points higher.' });

    });
    PARTS.forEach((p) => {
      const units = st.stock[p.id] + good[p.id];

    res.pipeline = Math.round(res.pipeline);
    res.holding = Math.round(res.holding);

})();

  function memberId(game) {
    const k = 'scg-member-' + game;
    let id = ss.get(k);
    if (!id) { id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); ss.set(k, id); }
    return id;
  }
  /* demo mode runs every player in one browser, so it keeps each tab's login separate */
  const sesStore = mode === 'demo'
    ? { get: ss.get, set: ss.set, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } }
    : ls;
  const session = {
    get(game) { try { return JSON.parse(sesStore.get('scg-session-' + game)); } catch (e) { return null; } },
    set(game, s) { sesStore.set('scg-session-' + game, JSON.stringify(s)); },
    clear(game) { sesStore.del('scg-session-' + game); }
  };

  /* members present in a team, oldest first */
  function onlineMembers(presence) {
    const now = Date.now();
    return Object.keys(presence || {}).map((id) => Object.assign({ id }, presence[id]))
      .filter((m) => m.online !== false && (mode === 'firebase' || now - (m.seen || 0) < 15000))
      .sort((a, b) => (a.joined || 0) - (b.joined || 0) || (a.id < b.id ? -1 : 1));
  }

  const P = {
    meta: (c) => `classes/${c}/meta`,
    teams: (c) => `classes/${c}/teams`,
    presence: (c, t) => `classes/${c}/presence/${t}`,
    play: (c, t) => `classes/${c}/play/${t}`,
    board: (c, t) => `classes/${c}/board${t ? '/' + t : ''}`
  };

  async function findClass(code) {
    await init();
    const meta = await db.get(P.meta(code));
    if (!meta) return null;
    const teams = (await db.get(P.teams(code))) || {};
    return { code, meta, teams };
  }

  const GAME_NAMES = { ss: 'Supplier Showdown', wr: 'Warehouse Rush', cc: 'Coffee Chain' };
  const GAME_PAGES = { ss: 'supplier-showdown.html', wr: 'warehouse-rush.html', cc: 'coffee-chain.html' };

  /* the join screen, shared by both games */
  function joinUI(el, game, onJoined) {
    let found = null, err = '', busy = false;
    const vals = { code: '', team: '', pin: '', name: (session.get(game) || {}).name || '' };
    function draw() {
      if (!found) {
        el.innerHTML = `
          <h3>Join your team</h3>
          <p class="small muted">Everyone in your team joins on their own phone or laptop with the same team and PIN.</p>
          <label for="jCode">Class code</label>
          <input type="text" id="jCode" maxlength="8" autocomplete="off" autocapitalize="characters" value="${esc(vals.code)}" style="text-transform:uppercase" placeholder="For example KX4P7Q">
          ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
          <button class="btn primary" type="button" data-j="find" style="width:100%;margin-top:12px" ${busy ? 'disabled' : ''}>${busy ? 'Looking for your class…' : 'Find my class'}</button>`;
      } else {
        const teams = Object.keys(found.teams).sort((a, b) => (found.teams[a].order || 0) - (found.teams[b].order || 0));
        el.innerHTML = `
          <h3>${esc(found.meta.name || 'Your class')}</h3>
          <p class="small muted">Class code ${esc(found.code)}. <button class="btn ghost small" type="button" data-j="back">Change</button></p>
          <label for="jTeam">Your team</label>
          <select id="jTeam"><option value="">Choose your team</option>${teams.map((t) => `<option value="${esc(t)}" ${vals.team === t ? 'selected' : ''}>${esc(found.teams[t].name)}</option>`).join('')}</select>
          <div style="height:10px"></div>
          <label for="jPin">Team PIN</label>
          <input type="text" id="jPin" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(vals.pin)}" placeholder="4 digits">
          <div style="height:10px"></div>
          <label for="jName">Your name</label>
          <input type="text" id="jName" maxlength="20" autocomplete="off" value="${esc(vals.name)}" placeholder="So your team knows who is who">
          ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ''}
          <button class="btn primary" type="button" data-j="join" style="width:100%;margin-top:12px" ${busy ? 'disabled' : ''}>${busy ? 'Joining…' : 'Join team'}</button>`;
      }
      el.querySelectorAll('input,select').forEach((i) => i.addEventListener('input', () => {
        if (i.id === 'jCode') vals.code = i.value; if (i.id === 'jTeam') vals.team = i.value; if (i.id === 'jPin') vals.pin = i.value; if (i.id === 'jName') vals.name = i.value;
        if (err) { err = ''; el.querySelector('.err')?.remove(); }
      }));
      el.querySelectorAll('select').forEach((i) => i.addEventListener('change', () => { vals.team = i.value; }));
    }
    el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-j]');
      if (!b || busy) return;
      const act = b.dataset.j;
      if (act === 'back') { found = null; err = ''; draw(); return; }
      if (act === 'find') {
        const code = normCode(vals.code);
        if (code.length < 4) { err = 'Enter your class code.'; draw(); return; }
        busy = true; draw();
        try {
          const c = await findClass(code);
          busy = false;
          if (!c) { err = 'No class with code ' + code + '. Check the code.'; draw(); return; }
          if (c.meta.game !== game) {
            busy = false; found = null;
            err = '';
            el.innerHTML = `<h3>Wrong game</h3><p>Class ${esc(code)} is playing ${GAME_NAMES[c.meta.game]}.</p><a class="btn primary" href="${GAME_PAGES[c.meta.game]}">Open ${GAME_NAMES[c.meta.game]}</a> <button class="btn ghost" type="button" data-j="back">Try another code</button>`;
            return;
          }
          found = c; vals.code = code; draw();
        } catch (ex) { busy = false; err = 'Could not reach the game server. Check your internet connection and try again.'; draw(); }
        return;
      }
      if (act === 'join') {
        if (!vals.team) { err = 'Choose your team.'; draw(); return; }
        if (!/^\d{4}$/.test(vals.pin.trim())) { err = 'The team PIN is 4 digits.'; draw(); return; }
        if (!vals.name.trim()) { err = 'Enter your name.'; draw(); return; }
        const team = found.teams[vals.team];
        if (!team || team.pinHash !== pinHash(found.code, vals.pin.trim())) { err = 'That PIN doesn’t match this team. Check the PIN.'; draw(); return; }
        const s = { code: found.code, teamId: vals.team, teamName: team.name, name: vals.name.trim(), className: found.meta.name || '', game };
        session.set(game, s);
        onJoined(s);
      }
    });
    draw();
  }

  /* start presence for this device in its team; returns stop() */
  function startPresence(s) {
    const id = memberId(s.game);
    const joinedKey = 'scg-joined-' + s.game + '-' + s.code + '-' + s.teamId;
    let joined = Number(ss.get(joinedKey));
    if (!joined) { joined = Date.now(); ss.set(joinedKey, String(joined)); }
    return db.presence(P.presence(s.code, s.teamId) + '/' + id, { name: s.name, joined });
  }

  function enableDemo() { ls.set('scg-demo', '1'); }
  function disableDemo() { ls.del('scg-demo'); ls.del('scg-demo-db'); }

  return { mode, available: !!db, db, init, P, hash, pinHash, encodePin, decodePin, newCode, newPin, normCode, memberId, session, onlineMembers, findClass, joinUI, startPresence, enableDemo, disableDemo, GAME_NAMES, GAME_PAGES, esc, clone };
})();

</script>
<script>
(function () {
  const app = document.getElementById('app');
  const SAVE_KEY = 'ss-game-v1-eu', BOARD_KEY = 'ss-board-v1-eu';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const sstore = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  };
  let game = null, draft = null, view = 'start', confirmRestart = false, formError = '', errorMsg = '';
  let mode = null; // 'practice' or 'online'
  let on = null;   // online team connection
  let showJoin = false;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const int = (n) => Math.round(n).toLocaleString('en-IE');
  const inr = (n) => (n < 0 ? '−' : '') + '€' + Math.round(Math.abs(n) * 0.03).toLocaleString('en-IE');
  const lakh = (n) => (n < 0 ? '−' : '') + '€' + Math.round(Math.abs(n) * 0.03).toLocaleString('en-IE');
  const pct = (x, d) => (x * 100).toFixed(d || 0) + '%';
  const M = SS.MONTHS;
  const partById = (id) => SS.PARTS.find((p) => p.id === id);
  const partTotal = (sp) => SS.REGION_IDS.reduce((a, r) => a + ((sp && sp[r]) || 0), 0);
  const listNames = (arr) => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

  function go(v) { view = v; render(); window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
  function save() { if (game && mode === 'practice') store.set(SAVE_KEY, { game }); }

  function newDraft() {
    const split = {};
    SS.PARTS.forEach((p) => { split[p.id] = Object.assign({}, game.split[p.id]); });
    return { split, buffer: game.buffer };
  }

  /* ---------- online team play ---------- */
  function normDraft(raw, g) {
    const split = {};
    SS.PARTS.forEach((p) => {
      const src = raw && raw.split && raw.split[p.id] ? raw.split[p.id] : g.split[p.id];
      split[p.id] = Object.assign({ CN: 0, VN: 0, IN: 0, DE: 0 }, src);
    });
    return { split, buffer: raw && raw.buffer !== undefined && raw.buffer !== null ? raw.buffer : g.buffer };
  }
  function teamMembers() {
    const list = ONLINE.onlineMembers(on.presence);
    if (!list.some((m) => m.id === on.me)) list.push({ id: on.me, name: on.s.name, joined: Number.MAX_SAFE_INTEGER });
    return list;
  }
  function roles(members) {
    const r = {};
    SS.PARTS.forEach((p, i) => { r[p.id] = members[i % members.length]; });
    return r;
  }
  const isReady = (id) => on && game && on.ready && on.ready[id] === game.month;

  async function enterOnline(s) {
    mode = 'online';
    errorMsg = '';
    game = null; draft = null;
    go('connecting');
    try {
      await ONLINE.init();
      const db = ONLINE.db;
      const base = ONLINE.P.play(s.code, s.teamId);
      const team = await db.get(ONLINE.P.teams(s.code) + '/' + s.teamId);
      if (!team) throw new Error('team-missing');
      await db.transaction(base + '/core', (cur) => (cur ? undefined : { gameJson: JSON.stringify(SS.newGame(s.code, team.name)) }));
      on = { s, base, db, me: ONLINE.memberId('ss'), presence: {}, ready: {}, draftRaw: null, core: null, advancing: false, seenKey: 'ss-seen-' + s.code + '-' + s.teamId };
      const seen = sstore.get(on.seenKey);
      on.seen = seen === null ? null : Number(seen);
      on.stop = ONLINE.startPresence(s);
      on.unsub = [
        db.on(base + '/core', (v) => { on.core = v; sync(); }),
        db.on(base + '/draft', (v) => { on.draftRaw = v; sync(); }),
        db.on(base + '/ready', (v) => { on.ready = v || {}; sync(); }),
        db.on(ONLINE.P.presence(s.code, s.teamId), (v) => { on.presence = v || {}; sync(); })
      ];
      on.tick = setInterval(sync, 5000);
    } catch (e) {
      errorMsg = e && e.message === 'team-missing'
        ? 'Your team no longer exists. Join again.'
        : 'Could not connect to your team. Check your internet connection and try again.';
      if (e && e.message === 'team-missing') ONLINE.session.clear('ss');
      go('error');
    }
  }

  function leaveOnline() {
    if (on) {
      try { on.unsub.forEach((u) => u()); on.stop && on.stop(); } catch (e) {}
      clearInterval(on.tick);
    }
    on = null; mode = null; game = null; draft = null;
    ONLINE.session.clear('ss');
  }

  function sync() {
    if (!on || !on.core) return;
    const firstLoad = !game;
    game = JSON.parse(on.core.gameJson);
    draft = normDraft(on.draftRaw, game);
    on.members = teamMembers();
    on.roles = roles(on.members);
    const len = game.history.length;
    if (on.seen === null) { on.seen = len; sstore.set(on.seenKey, String(len)); }
    if (firstLoad) writeBoard(game);
    // keep this device's Ready in place until the month is played, unless the buffer changed
    if (on.myReady !== null && on.myReady !== undefined) {
      if (on.myReady !== game.month || draft.buffer !== on.myReadyBuffer) on.myReady = null;
      else if (on.ready[on.me] !== game.month) { on.ready = Object.assign({}, on.ready, { [on.me]: game.month }); on.db.set(on.base + '/ready/' + on.me, game.month); }
    }
    if (len > on.seen) {
      if (view !== 'event' && view !== 'results') go('event');
      return;
    }
    if (game.done) {
      if (view !== 'final') go('final');
      return;
    }
    const sig = JSON.stringify([on.core, on.draftRaw, on.ready, on.members.map((x) => x.id + x.name)]);
    if (view === 'plan') { if (sig !== on.sig) keepScroll(renderPlan); }
    else if (view === 'connecting' || view === 'start') go('plan');
    on.sig = sig;
    maybeAdvance();
  }

  function maybeAdvance() {
    if (!on || !game || game.done || on.advancing) return;
    const m = game.month;
    const allReady = on.members.length > 0 && on.members.every((mem) => isReady(mem.id));
    const valid = SS.PARTS.every((p) => partTotal(draft.split[p.id]) === 100);
    if (!allReady || !valid) return;
    on.advancing = true;
    const d = JSON.parse(JSON.stringify(draft));
    on.db.transaction(on.base + '/core', (cur) => {
      if (!cur) return cur;
      const g = JSON.parse(cur.gameJson);
      if (g.month !== m) return undefined;
      return { gameJson: JSON.stringify(SS.playMonth(g, d)) };
    }).then((r) => {
      if (on) on.advancing = false;
      if (r.committed && r.value) writeBoard(JSON.parse(r.value.gameJson));
    }).catch(() => { if (on) on.advancing = false; });
  }

  function writeBoard(g) {
    if (!on) return;
    const s = SS.summary(g);
    on.db.set(ONLINE.P.board(on.s.code, on.s.teamId), {
      game: 'ss', team: g.team, month: g.month, done: !!g.done,
      profit: Math.round(s.profit), fill: Math.round(s.fillRate * 1000) / 10, updated: Date.now()
    });
  }

  /* ---------- views ---------- */
  function render() {
    if (view === 'start') return renderStart();
    if (view === 'connecting') return renderConnecting();
    if (view === 'error') return renderError();
    if (view === 'plan') return renderPlan();
    if (view === 'event') return renderEvent();
    if (view === 'results') return renderResults();
    if (view === 'final') return renderFinal();
    if (view === 'board') return renderBoard();
  }

  function renderConnecting() {
    app.innerHTML = `<div class="wrap" style="padding:60px 20px"><h2>Connecting to your team&hellip;</h2><p class="muted">This takes a few seconds.</p></div>`;
  }
  function renderError() {
    app.innerHTML = `<div class="wrap" style="padding:60px 20px"><h2>Something went wrong</h2><p>${esc(errorMsg)}</p>
      <div class="row">${ONLINE.session.get('ss') ? '<button class="btn primary" data-act="retry">Try again</button>' : ''}<button class="btn" data-act="tostart">Back to the start</button></div></div>`;
  }

  function onlineCard() {
    if (!ONLINE.available) {
      return `<div class="sheet"><h3>Play with your team online</h3>
        <p class="small">Each member plays on their own phone or laptop, and the screens stay in sync..</p>
        <p class="small muted">Online team play isn&rsquo;t set up on this site yet. You can practise on one device for now.</p></div>`;
    }
    const saved = ONLINE.session.get('ss');
    if (saved && !showJoin) {
      return `<div class="sheet"><h3>Play with your team online</h3>
        <p>You&rsquo;re in <b>${esc(saved.teamName)}</b>${saved.className ? ` (${esc(saved.className)})` : ''} as ${esc(saved.name)}.</p>
        <button class="btn primary" type="button" data-act="rejoin" style="width:100%">Continue with ${esc(saved.teamName)}</button>
        <button class="btn ghost small" type="button" data-act="showjoin" style="margin-top:8px">Join a different team</button></div>`;
    }
    return `<div class="sheet" id="joinBox"></div>`;
  }

  function renderStart() {
    const saved = store.get(SAVE_KEY);
    const resumable = saved && saved.game && !saved.game.done && saved.game.history.length > 0;
    app.innerHTML = `
    <div class="wrap">
      <section style="padding:36px 0 8px">
        <p class="kicker">A sourcing game for teams, played over 8 months</p>
        <h1>Supplier Showdown</h1>
        <p class="lede" style="font-size:20px;max-width:36em">You run purchasing at Elster E-Bikes in Leipzig. Every e-bike needs a battery pack, a hub motor, a controller chip and a tyre set. Choose who supplies them, keep the assembly line running, and finish November with the most profit.</p>
        <p class="muted">The previous manager bought everything from Shenzhen because it was cheapest. That is where you start.</p>
      </section>
      <div class="choice">
        <form class="sheet" id="startForm" novalidate>
          <h3>Start a game</h3>
          <p class="small muted">The whole team plays together on one phone or laptop.</p>
          <label for="team">Team name</label>
          <input type="text" id="team" maxlength="24" autocomplete="off" placeholder="For example, Team Falcon">
          <div style="height:12px"></div>
          <label for="code">Game code</label>
          <div class="row" style="flex-wrap:nowrap">
            <input type="text" id="code" maxlength="16" autocomplete="off" value="${esc(SS.randomCode())}" style="text-transform:uppercase">
            <button type="button" class="btn small" data-act="newcode" style="margin-top:4px">New code</button>
          </div>
          <p class="tiny muted" style="margin-top:6px">Teams that use the same code get the same news in the same months.</p>
          ${formError ? `<p class="err" role="alert">${esc(formError)}</p>` : ''}
          <button class="btn primary" type="submit" style="width:100%;margin-top:6px">Start the game</button>
          ${resumable ? `<button class="btn" type="button" data-act="resume" style="width:100%;margin-top:10px">Continue ${esc(saved.game.team)} (${M[saved.game.month]})</button>` : ''}
        </form>
        <div class="sheet">
          <h3>Rules worth knowing</h3>
          <ul class="small" style="padding-left:1.2em;margin:0">
            <li>A new supplier costs ${lakh(SS.ONBOARD_FEE)} to approve and ships only half your order in its first month.</li>
            <li>Wrocław can make at most 60% of your battery packs and 40% of your chips.</li>
            <li>E-bikes you can&rsquo;t build are lost sales, and dealers charge ${inr(SS.PENALTY)} for each one.</li>
            <li>Buffer stock protects you but costs ${pct(SS.HOLD_RATE)} of its value every month.</li>
          </ul>
        </div>
      </div>
      <h2 style="margin-top:32px">Each month</h2>
      <ol class="steps">
        <li><b>1</b>Read the briefing: forecast demand, your stock and the latest news.</li>
        <li><b>2</b>Split each part&rsquo;s order between suppliers and choose how much buffer stock to keep.</li>
        <li><b>3</b>Draw the news card. Fires, floods and tariffs can hit any supplier.</li>
        <li><b>4</b>See what you built and what you earned. An e-bike needs all four parts, so the scarcest part sets your output.</li>
      </ol>
      <p class="footer">All companies, prices and events in this game are made up for teaching.</p>
    </div>`;
    const jb = document.getElementById('joinBox');
    if (jb) ONLINE.joinUI(jb, 'ss', (s) => { showJoin = false; enterOnline(s); });
    const f = document.getElementById('startForm');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const team = document.getElementById('team').value.trim();
      const code = SS.normCode(document.getElementById('code').value);
      if (!team) { formError = 'Enter a team name to start.'; renderStart(); document.getElementById('team').focus(); return; }
      formError = '';
      mode = 'practice';
      game = SS.newGame(code, team);
      draft = newDraft();
      save();
      go('plan');
    });
    document.getElementById('team').addEventListener('input', () => { if (formError) { formError = ''; const er = f.querySelector('.err'); if (er) er.remove(); } });
  }

  function gameBar(viewing) {
    const nowI = viewing === undefined ? game.month : viewing;
    const total = game.history.reduce((a, r) => a + r.profit, 0);
    const cells = M.map((name, i) => {
      const h = game.history[i];
      const cls = i === nowI && nowI < M.length ? 'now' : h ? (h.profit >= 0 ? 'up' : 'down') : '';
      return `<span class="${cls}" title="${name}${h ? ': ' + lakh(h.profit) : ''}">${name.slice(0, 3)}</span>`;
    }).join('');
    return `<div class="gamebar"><div class="wrap">
      <span class="teamtag">${esc(game.team)}</span>
      <span class="small muted">${mode === 'online' ? 'Class ' + esc(on.s.code) : 'Code ' + esc(game.code)}</span>
      <div class="months" aria-label="Months played">${cells}</div>
      <span class="score" title="Profit so far">${lakh(total)}</span>
    </div></div>`;
  }

  function teamStrip() {
    if (mode !== 'online') return '';
    const who = on.members.map((m) => {
      const parts = SS.PARTS.filter((p) => on.roles[p.id] && on.roles[p.id].id === m.id).map((p) => p.name.toLowerCase());
      const r = isReady(m.id);
      return `<span class="who ${r ? 'ready' : ''}"><span class="dot" aria-hidden="true"></span><b>${esc(m.id === on.me ? m.name + ' (you)' : m.name)}</b> <span class="muted">${esc(parts.join(', ') || 'watching')}</span>${r ? ' <span class="tick">Ready</span>' : ''}</span>`;
    }).join('');
    return `<div class="teamstrip"><div class="wrap"><span class="muted">Online now:</span>${who}</div></div>`;
  }

  function lateArrivals() {
    const out = [];
    SS.PARTS.forEach((p) => {
      Object.keys(game.late[p.id] || {}).forEach((r) => {
        const n = game.late[p.id][r];
        if (n > 0) out.push(`${int(n)} ${p.name.toLowerCase()}${n === 1 ? '' : 's'} from ${SS.REGIONS[r].city} arrive late this month.`);
      });
    });
    return out;
  }

  function renderPlan() {
    const m = game.month;
    const F = SS.FORECAST[m];
    const notes = SS.briefing(game.code, m);
    const late = lateArrivals();
    const cond = SS.conditions(game.code, m, false);
    const bufferW = draft.buffer;
    const online = mode === 'online';
    const meReady = online && isReady(on.me);
    let allOk = true, myOk = true, landedPerScooter = 0, quotedPerScooter = 0, fees = 0, newOnes = 0;

    const partsHtml = SS.PARTS.map((p) => {
      const sp = draft.split[p.id];
      const total = partTotal(sp);
      const owner = online ? on.roles[p.id] : null;

  /* ---------- charts ---------- */
  function lineChart(series, labels, fmt) {
    const W = 680, H = 300, L = 62, R = 118, T = 16, B = 34;
    const all = series.flatMap((s) => s.values);
    let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const x = (i) => L + (i * (W - L - R)) / (labels.length - 1);
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const step = niceStep((hi - lo) / 5);
    let grid = '';
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < step / 2 ? '#1B2A41' : '#D5DAE1'}" stroke-width="${Math.abs(v) < step / 2 ? 1.5 : 1}"/>
        <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#5B6676">${fmt(v)}</text>`;
    }
    const xl = labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#5B6676">${l}</text>`).join('');
    const ends = [];
    const lines = series.map((s) => {
      const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const lastI = s.values.length - 1;
      ends.push({ y: y(s.values[lastI]), x: x(lastI), name: s.short || s.name, c: s.color });
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round"/>` +
        s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${s.width > 3 ? 4 : 3}" fill="${s.color}"><title>${esc(s.name)}, ${labels[i]}: ${fmt(v)}</title></circle>`).join('');
    }).join('');
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
    const endLabels = ends.map((e) => `<text x="${e.x + 8}" y="${e.y + 4}" font-size="13" font-weight="600" fill="${e.c}">${esc(e.name)}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of profit so far for your team and three fixed strategies">${grid}${xl}${lines}${endLabels}</svg>`;
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
  }

  function renderFinal() {
    const you = SS.summary(game);
    const bench = SS.BENCHMARKS.map((b) => { const st = SS.runBenchmark(game.code, b); return { b, st, s: SS.summary(st) }; });
    const cum = (h) => { let a = 0; return h.map((r) => (a += r.profit) * 0.03 / 1000); };
    const colors = { you: '#1F4E8C', cheap: '#A93A34', local: '#2C6B4C', dual: '#3A4A63' };
    const dashes = { cheap: '7 5', local: '2 5', dual: '12 4 2 4' };
    const series = [{ name: game.team, short: 'You', values: cum(game.history), color: colors.you, width: 4 }]
      .concat(bench.map((x) => ({ name: x.b.name, short: x.b.short, values: cum(x.st.history), color: colors[x.b.id], dash: dashes[x.b.id], width: 2.5 })));
    const sched = SS.schedule(game.code);

        <h1 style="font-size:clamp(40px,6vw,60px)">${lakh(you.profit)}</h1>
        <p style="font-size:20px">Total profit from April to November. You built ${int(you.built)} of ${int(you.demand)} e-bikes ordered (${pct(you.fillRate, 1)}). Against the three fixed strategies below, you placed ${pos} of 4.</p>
      </section>
      <div class="kpis">
        <div class="kpi"><div class="small muted">Orders delivered</div><div class="bignum">${pct(you.fillRate, 1)}</div></div>

        <div class="kpi"><div class="small muted">Suppliers per part, at the end</div><div class="bignum">${you.suppliersPerPart.toFixed(1)}</div></div>
        <div class="kpi"><div class="small muted">Shipping carbon per e-bike</div><div class="bignum">${int(you.carbonPerScooter)}<span style="font-size:18px"> kg</span></div></div>
      </div>
      <section class="sheet chart">

        </div>
      </div>
      ${board.length ? `<section class="sheet tablewrap" style="margin-top:16px"><table class="small"><thead><tr><th>#</th><th>Team</th><th class="r">Profit</th><th class="r">Delivered</th><th>Code</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="row" style="margin-top:12px">${confirmRestart ? `<span class="confirm small">Remove every team from this scoreboard?</span><button class="btn small dark" data-act="clearboard-yes">Clear scoreboard</button><button class="btn small" data-act="restart-no">Keep it</button>` : `<button class="btn small" data-act="clearboard">Clear scoreboard</button>`}</div></section>` : ''}
      <div class="row" style="margin:20px 0 50px">
        <button class="btn" data-act="home">Back to the game</button>
      </div>
    </div>`;
    document.getElementById('boardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const team = document.getElementById('bTeam').value.trim();
      const profit = parseFloat(document.getElementById('bProfit').value);
      const fillRaw = document.getElementById('bFill').value.trim();
      const fill = fillRaw === '' ? '' : parseFloat(fillRaw);
      if (!team) { boardError = 'Enter a team name.'; return renderBoard(); }
      if (!isFinite(profit)) { boardError = 'Enter the profit in thousand euros, for example 120.'; return renderBoard(); }
      if (fill !== '' && (!isFinite(fill) || fill < 0 || fill > 100)) { boardError = 'Orders delivered must be between 0 and 100.'; return renderBoard(); }
      boardError = '';
      const b = getBoard();
      b.push({ id: String(Date.now()) + Math.random().toString(36).slice(2, 6), team, profit, fill: fill === '' ? '' : Math.round(fill * 10) / 10 });
      store.set(BOARD_KEY, b);
      renderBoard();
      document.getElementById('bTeam').focus();
    });
    ['bTeam', 'bProfit', 'bFill'].forEach((id) => document.getElementById(id).addEventListener('input', () => {
      if (boardError) { boardError = ''; const er = app.querySelector('#boardForm .err'); if (er) er.remove(); }
    }));
  }

  /* ---------- actions ---------- */
  function setShare(p, r, act) {
    const sp = Object.assign({}, draft.split[p.id]);
    const total = partTotal(sp);
    const cap = p.cap[r] !== undefined ? p.cap[r] : 100;
    if (act === 'inc') sp[r] = Math.min(cap, (sp[r] || 0) + Math.min(10, 100 - total));
    else sp[r] = Math.max(0, (sp[r] || 0) - 10);
    draft.split[p.id] = sp;
    if (mode === 'online') on.db.set(on.base + '/draft/split/' + p.id, sp);
  }

  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'newcode') { document.getElementById('code').value = SS.randomCode(); return; }
    if (act === 'showjoin') { showJoin = true; renderStart(); return; }
    if (act === 'rejoin' || act === 'retry') { const s = ONLINE.session.get('ss'); if (s) enterOnline(s); return; }
    if (act === 'tostart') { leaveOnline(); go('start'); return; }
    if (act === 'leave') { leaveOnline(); showJoin = false; go('start'); return; }
    if (act === 'resume') {
      const saved = store.get(SAVE_KEY);
      if (saved && saved.game) { mode = 'practice'; game = saved.game; draft = newDraft(); go('plan'); }
      return;
    }
    if (act === 'inc' || act === 'dec') {
      const p = partById(t.dataset.p), r = t.dataset.r;
      if (mode === 'online' && (on.roles[p.id].id !== on.me || isReady(on.me))) return;
      setShare(p, r, act);
      keepScroll(renderPlan);
      const again = app.querySelector(`[data-act="${act}"][data-p="${p.id}"][data-r="${r}"]`);
      if (again && !again.disabled) again.focus({ preventScroll: true });
      else { const o = app.querySelector(`[data-p="${p.id}"][data-r="${r}"]`); if (o) o.parentElement.querySelector('button:not([disabled])')?.focus({ preventScroll: true }); }
      return;
    }
    if (act === 'buffer') {
      if (mode === 'online' && isReady(on.me)) return;
      draft.buffer = Number(t.dataset.w);
      if (mode === 'online') { on.myReady = null; on.db.update(on.base, { 'draft/buffer': draft.buffer, ready: null }); }
      keepScroll(renderPlan);
      app.querySelector(`[data-act=buffer][data-w="${draft.buffer}"]`)?.focus({ preventScroll: true });
      return;
    }
    if (act === 'ready') {
      on.myReady = game.month; on.myReadyBuffer = draft.buffer;
      on.ready = Object.assign({}, on.ready, { [on.me]: game.month });
      on.db.set(on.base + '/ready/' + on.me, game.month);
      keepScroll(renderPlan);
      maybeAdvance();
      return;
    }
    if (act === 'unready') {
      on.myReady = null;
      on.ready = Object.assign({}, on.ready); delete on.ready[on.me];
      on.db.remove(on.base + '/ready/' + on.me);
      keepScroll(renderPlan);
      return;
    }
    if (act === 'order') { game = SS.playMonth(game, draft); save(); go('event'); return; }
    if (act === 'results') { go('results'); return; }
    if (act === 'next') {
      if (mode === 'online') {
        on.seen = game.history.length; sstore.set(on.seenKey, String(on.seen));
        go(game.done ? 'final' : 'plan');
        maybeAdvance();
      } else { draft = newDraft(); go('plan'); }
      return;
    }
    if (act === 'final') {
      if (mode === 'online') { on.seen = game.history.length; sstore.set(on.seenKey, String(on.seen)); }
      go('final'); return;
    }
    if (act === 'restart') { confirmRestart = true; renderPlan(); return; }
    if (act === 'restart-no') { confirmRestart = false; render(); return; }
    if (act === 'restart-yes') { confirmRestart = false; store.del(SAVE_KEY); game = null; mode = null; go('start'); return; }
    if (act === 'copy') {
      const inp = document.getElementById('resultLine'), msg = document.getElementById('copymsg');
      try { await navigator.clipboard.writeText(inp.value); msg.textContent = 'Copied.'; }
      catch (err) { inp.focus(); inp.select(); msg.textContent = 'Select the line above and copy it.'; }
      return;
    }
    if (act === 'board') { confirmRestart = false; go('board'); return; }
    if (act === 'home') { go(game && mode === 'practice' ? (game.done ? 'final' : 'plan') : 'start'); return; }
    if (act === 'again') { store.del(SAVE_KEY); game = null; mode = null; go('start'); return; }
    if (act === 'addself') {
      const s = SS.summary(game);
      const b = getBoard();
      if (b.some((r) => r.gameId === game.team + game.code)) { document.getElementById('addmsg').textContent = 'This result is already on the scoreboard.'; return; }
      b.push({ id: String(Date.now()), gameId: game.team + game.code, team: game.team, profit: Math.round(s.profit / 1e4) / 10, fill: Math.round(s.fillRate * 1000) / 10, code: game.code });
      store.set(BOARD_KEY, b);
      document.getElementById('addmsg').textContent = 'Added to the scoreboard.';
      return;
    }
    if (act === 'delrow') { store.set(BOARD_KEY, getBoard().filter((r) => r.id !== t.dataset.i)); renderBoard(); return; }
    if (act === 'clearboard') { confirmRestart = true; renderBoard(); return; }
    if (act === 'clearboard-yes') { confirmRestart = false; store.set(BOARD_KEY, []); renderBoard(); return; }
  });

  if (location.hash === '#scoreboard') view = 'board';
  render();
})();
</script>
