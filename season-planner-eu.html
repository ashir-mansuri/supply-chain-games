<script>
/* Season Planner engine: aggregate production planning for a garden furniture maker */
const FP = (() => {
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June'];
  const FORECAST = [7000, 8000, 10000, 14000, 18000, 9000];
  const PER_WORKER = 400;       // furniture sets per worker per month, regular time
  const WAGE = 16000;           // per worker per month, paid whether busy or not
  const OT_LEVELS = [0, 10, 20, 25];  // overtime as % of regular capacity
  const OT_COST = 60;           // per set made on overtime
  const SUB_COST = 90;          // per set from a subcontractor
  const SUB_MAX = 5000;
  const SUB_STEP = 250;
  const HIRE_COST = 10000;      // per worker hired
  const FIRE_COST = 15000;      // per worker laid off
  const HIRE_MAX = 20;          // most workers you can hire in one month
  const HOLD_COST = 8;          // per set in stock at month end
  const SHORT_COST = 150;       // per set of lost sales
  const CLEAR_COST = 50;        // per set left after June, cleared at a loss
  const START_WORKERS = 20;
  const START_STOCK = 2000;

  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rand(seed) {
    let a = hash(seed);
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const normCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'PRACTICE';
  /* actual orders: within 8% of the forecast, the same for everyone with the same code */
  const actual = (code, m) => Math.round((FORECAST[m] * (1 + (rand(normCode(code) + '|fp|' + m) * 2 - 1) * 0.08)) / 50) * 50;

  /* cost of one month's plan */
  function month(m, startWorkers, startStock, plan, dem) {
    const workers = Math.max(0, Math.round(plan.workers));
    const ot = OT_LEVELS.includes(plan.ot) ? plan.ot : 0;
    const sub = Math.max(0, Math.min(SUB_MAX, Math.round(plan.sub / SUB_STEP) * SUB_STEP));
    const hired = Math.max(0, workers - startWorkers);
    const fired = Math.max(0, startWorkers - workers);
    const regular = workers * PER_WORKER;
    const overtime = Math.round((regular * ot) / 100);
    const made = regular + overtime + sub;
    const available = startStock + made;
    const sold = Math.min(available, dem);
    const short = dem - sold;
    let stock = available - sold;
    const cost = {
      wages: workers * WAGE,
      overtime: overtime * OT_COST,
      sub: sub * SUB_COST,
      hiring: hired * HIRE_COST,
      layoffs: fired * FIRE_COST,
      storage: stock * HOLD_COST,
      lost: short * SHORT_COST,
      clearance: m === MONTHS.length - 1 ? stock * CLEAR_COST : 0
    };
    cost.total = Object.values(cost).reduce((a, b) => a + b, 0);
    return { month: m, workers, ot, sub, hired, fired, regular, overtime, made, demand: dem, sold, short, stock, cost };
  }

  function newGame(code, name) { return { v: 1, code: normCode(code), name: name || 'Player', m: 0, workers: START_WORKERS, stock: START_STOCK, history: [], done: false }; }

  function playMonth(s0, plan) {
    const s = JSON.parse(JSON.stringify(s0));
    if (s.done) return s;
    const hireCap = s.workers + HIRE_MAX;
    const p = { workers: Math.min(hireCap, plan.workers), ot: plan.ot, sub: plan.sub };
    const r = month(s.m, s.workers, s.stock, p, actual(s.code, s.m));
    s.history.push(r);
    s.workers = r.workers; s.stock = r.stock; s.m += 1;
    if (s.m >= MONTHS.length) s.done = true;
    return s;
  }

  function summary(s) {
    const keys = ['wages', 'overtime', 'sub', 'hiring', 'layoffs', 'storage', 'lost', 'clearance', 'total'];
    const cost = {};
    keys.forEach((k) => { cost[k] = s.history.reduce((a, r) => a + r.cost[k], 0); });
    const demand = s.history.reduce((a, r) => a + r.demand, 0);
    const sold = s.history.reduce((a, r) => a + r.sold, 0);
    const changes = s.history.reduce((a, r) => a + r.hired + r.fired, 0);
    return { cost, demand, sold, fill: demand ? sold / demand : 1, changes, perSet: sold ? cost.total / sold : 0 };
  }

  /* fixed plans, made from the forecast in advance */
  const LEVEL = (() => {
    const total = FORECAST.reduce((a, b) => a + b, 0) - START_STOCK;
    const w = Math.ceil(total / FORECAST.length / PER_WORKER);
    return FORECAST.map(() => ({ workers: w, ot: 0, sub: 0 }));
  })();
  const CHASE = (() => {
    let stock = START_STOCK;
    return FORECAST.map((f) => {
      const need = Math.max(0, f - stock);
      const w = Math.ceil(need / PER_WORKER);
      stock = Math.max(0, stock + w * PER_WORKER - f);
      return { workers: w, ot: 0, sub: 0 };
    });
  })();
  // the cheapest plan for the forecast, worked out in advance with findBest()
  let BEST = [{ workers: 21, ot: 0, sub: 0 }, { workers: 26, ot: 0, sub: 0 }, { workers: 26, ot: 0, sub: 0 }, { workers: 27, ot: 10, sub: 0 }, { workers: 27, ot: 25, sub: 0 }, { workers: 23, ot: 0, sub: 0 }];
  function findBest() {
    // dynamic programming over workers and stock, using the forecast
    const STOCK_STEP = 250, MAX_STOCK = 20000, MAX_W = 60;
    let layer = new Map(); layer.set(START_WORKERS + '|' + START_STOCK, { cost: 0, plan: [] });
    for (let m = 0; m < MONTHS.length; m++) {
      const next = new Map();
      layer.forEach((v, key) => {
        const [w0, s0] = key.split('|').map(Number);
        for (let w = 0; w <= Math.min(MAX_W, w0 + HIRE_MAX); w++) {
          for (const ot of OT_LEVELS) {
            for (let sub = 0; sub <= SUB_MAX; sub += SUB_STEP) {
              const r = month(m, w0, s0, { workers: w, ot, sub }, FORECAST[m]);
              if (r.short > 0 && sub > 0) continue;
              const st = Math.min(MAX_STOCK, Math.round(r.stock / STOCK_STEP) * STOCK_STEP);
              const k = w + '|' + st;
              const c = v.cost + r.cost.total;
              const e = next.get(k);
              if (!e || c < e.cost) next.set(k, { cost: c, plan: v.plan.concat([{ workers: w, ot, sub }]) });
            }
          }
        }
      });
      layer = next;
    }
    let best = null;
    layer.forEach((v) => { if (!best || v.cost < best.cost) best = v; });
    return best.plan;
  }
  const STRATEGIES = [
    { id: 'level', name: 'Level plan', desc: 'The same workforce every month, building stock before the peak.', plan: () => LEVEL },
    { id: 'chase', name: 'Chase plan', desc: 'Hires and lays off every month so output matches the forecast.', plan: () => CHASE },
    { id: 'mixed', name: 'Best mixed plan', desc: 'The cheapest mix of workforce, stock, overtime and subcontracting for the forecast, found by the computer.', plan: () => BEST }
  ];
  function setBest(plan) { BEST = plan; }
  function runStrategy(code, st) {
    let s = newGame(code, st.name);
    st.plan().forEach((p) => { s = playMonth(s, p); });
    return s;
  }
  function randomCode() {
    const w = ['GARDEN', 'TERRACE', 'PATIO', 'BENCH', 'TABLE', 'CHAIR', 'PARASOL', 'SPRING'];
    return w[Math.floor(Math.random() * w.length)] + (10 + Math.floor(Math.random() * 90));
  }
  return {
    MONTHS, FORECAST, PER_WORKER, WAGE, OT_LEVELS, OT_COST, SUB_COST, SUB_MAX, SUB_STEP, HIRE_COST, FIRE_COST, HIRE_MAX, HOLD_COST, SHORT_COST, CLEAR_COST, START_WORKERS, START_STOCK,
    actual, month, newGame, playMonth, summary, LEVEL, CHASE, findBest, setBest, STRATEGIES, runStrategy, normCode, randomCode
  };
})();
if (typeof module !== 'undefined') module.exports = FP;

</script>

  const lakh = (n) => '€' + Math.round(n * 0.2).toLocaleString('en-IE');

          <p class="kicker">A solo decision game about aggregate planning, 6 months</p>
          <h1>Season Planner</h1>
          <p style="font-size:20px;max-width:34em">You run production at a garden furniture maker in Bielefeld that makes table-and-chair sets. Orders from garden centres build up from January to a big peak in May, as spring arrives, then drop in June. Each month you choose how many workers to employ, how much overtime to run and how much to send to a subcontractor. Meet the orders at the lowest total cost.</p>
        </div>
        <form class="sheet" id="startForm" novalidate>
          <h3>Start a game</h3>
          <label for="name">Your name</label>
          <input type="text" id="name" maxlength="24" autocomplete="off" placeholder="For example, Lena">
          <div style="height:12px"></div>
          <label for="code">Game code</label>
          <div class="row" style="flex-wrap:nowrap">
            <input type="text" id="code" maxlength="16" autocomplete="off" value="${esc(FP.randomCode())}" style="text-transform:uppercase">
            <button type="button" class="btn small" data-act="newcode" style="margin-top:4px">New code</button>
          </div>
          <p class="tiny muted" style="margin-top:6px">Players with the same code get the same orders, so results can be compared.</p>
          ${formError ? `<p class="err" role="alert">${esc(formError)}</p>` : ''}
          <button class="btn primary" type="submit" style="width:100%;margin-top:6px">Start the game</button>
          ${resumable ? `<button class="btn" type="button" data-act="resume" style="width:100%;margin-top:10px">Continue ${esc(saved.name)} (${M[saved.m]})</button>` : ''}
        </form>
      </section>
      <div class="grid2" style="margin-top:12px">
        <section class="sheet"><h3>Your levers</h3>
          <ul class="small" style="padding-left:1.2em;margin:0">
            <li><b>Workers:</b> each makes ${int(FP.PER_WORKER)} sets a month and costs ${inr(FP.WAGE)} a month, busy or not. Hiring costs ${inr(FP.HIRE_COST)} per worker (up to ${FP.HIRE_MAX} a month); a layoff costs ${inr(FP.FIRE_COST)}.</li>
            <li><b>Overtime:</b> up to 25% extra output, at ${inr(FP.OT_COST)} per set.</li>
            <li><b>Subcontracting:</b> up to ${int(FP.SUB_MAX)} sets a month, at ${inr(FP.SUB_COST)} per set.</li>
            <li><b>Stock:</b> sets you make early wait in the store at ${inr(FP.HOLD_COST)} per set per month.</li>
          </ul></section>
        <section class="sheet"><h3>What can go wrong</h3>
          <ul class="small" style="padding-left:1.2em;margin:0">
            <li>Orders you can&rsquo;t fill are lost: ${inr(FP.SHORT_COST)} per set in lost profit and goodwill.</li>
            <li>Actual orders can be up to 8% above or below the forecast.</li>
            <li>Sets left after June are sold off cheaply, losing ${inr(FP.CLEAR_COST)} each.</li>
            <li>You start with ${FP.START_WORKERS} workers and ${int(FP.START_STOCK)} sets in stock.</li>
          </ul></section>
      </div>
      <p class="footer">The company, costs and orders in this game are made up for teaching.</p>
    </div>`;
    const f = document.getElementById('startForm');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      if (!name) { formError = 'Enter your name to start.'; renderStart(); document.getElementById('name').focus(); return; }
      formError = '';
      S = FP.newGame(document.getElementById('code').value, name);
      resetPlan(); save(); go('month');
    });
    document.getElementById('name').addEventListener('input', () => { if (formError) { formError = ''; f.querySelector('.err')?.remove(); } });
  }

  function bar(viewM) {
    const now = viewM === undefined ? S.m : viewM;
    const total = S.history.reduce((a, r) => a + r.cost.total, 0);
    return `<div class="gamebar"><div class="wrap"><span class="teamtag">${esc(S.name)}</span><span class="small muted">Code ${esc(S.code)}</span>
      <div class="months" aria-label="Months">${M.map((n, i) => `<span class="${i === now ? 'now' : i < S.history.length ? 'done' : ''}">${n.slice(0, 3)}</span>`).join('')}</div>
      <span class="score" title="Total cost so far">${lakh(total)}</span></div></div>`;
  }

  function renderMonth() {
    const m = S.m;
    const max = Math.max(...FP.FORECAST);
    const cols = FP.FORECAST.map((f, i) => {
      const h = S.history[i];
      const v = h ? h.demand : f;
      return `<div class="col ${i === m ? 'now' : i < m ? 'past' : ''}"><span class="v">${int(v)}</span><div class="b" style="height:${(v / max) * 140}px" title="${M[i]}: ${h ? 'actual orders' : 'forecast'} ${int(v)}"></div><span class="m">${M[i].slice(0, 3)}</span></div>`;
    }).join('');
    const p = FP.month(m, S.workers, S.stock, plan, FP.FORECAST[m]);
    const hireCap = S.workers + FP.HIRE_MAX;
    const endText = p.short > 0 ? `<span class="bad">${int(p.short)} sets short if orders match the forecast</span>` : `<span class="good">${int(p.stock)} sets left in stock if orders match the forecast</span>`;
    const remaining = FP.FORECAST.slice(m + 1).reduce((a, b) => a + b, 0);
    app.innerHTML = bar() + `
      <div class="wrap">
        <h2 style="margin-top:22px">${M[m]} plan</h2>
        <div class="plan">
          <section class="sheet">
            <h3>Orders: forecast for each month</h3>
            <p class="small muted" style="margin:0">Past months show actual orders. The gold bar is this month.</p>
            <div class="fcbars" aria-hidden="true">${cols}</div>
            <div class="status">
              <div><b>${S.workers}</b><span>Workers now</span></div>
              <div><b>${int(S.stock)}</b><span>Sets in stock now</span></div>
            </div>
            <p class="small" style="margin-top:10px">Forecast for ${M[m]}: <b>${int(FP.FORECAST[m])}</b> sets. Still to come after ${M[m]}: <b>${int(remaining)}</b> sets.</p>
          </section>
          <section class="sheet">
            <div class="lever"><h3>Workers</h3><span class="small muted">Each worker makes ${int(FP.PER_WORKER)} sets a month. You can hire up to ${FP.HIRE_MAX} this month.</span>
              <div class="ctrl" role="group" aria-label="Workers">
                <button class="step" data-act="w" data-d="-5" ${plan.workers < 5 ? 'disabled' : ''}>&minus;5</button><button class="step" data-act="w" data-d="-1" ${plan.workers < 1 ? 'disabled' : ''}>&minus;1</button>
                <output aria-live="polite">${plan.workers}</output>
                <button class="step" data-act="w" data-d="1" ${plan.workers >= hireCap ? 'disabled' : ''}>+1</button><button class="step" data-act="w" data-d="5" ${plan.workers + 5 > hireCap ? 'disabled' : ''}>+5</button>
                <span class="small">${p.hired ? `Hire ${p.hired}: ${inr(p.cost.hiring)}` : p.fired ? `Lay off ${p.fired}: ${inr(p.cost.layoffs)}` : 'No change'}</span>
              </div></div>
            <div class="lever"><h3>Overtime</h3><span class="small muted">Extra output from your own workers, at ${inr(FP.OT_COST)} per set.</span>
              <div class="ctrl"><div class="seg" role="group" aria-label="Overtime">${FP.OT_LEVELS.map((o) => `<button type="button" data-act="ot" data-v="${o}" aria-pressed="${plan.ot === o}">${o === 0 ? 'None' : '+' + o + '%'}</button>`).join('')}</div></div></div>
            <div class="lever"><h3>Subcontracting</h3><span class="small muted">Sets made by another factory, at ${inr(FP.SUB_COST)} each, up to ${int(FP.SUB_MAX)}.</span>
              <div class="ctrl" role="group" aria-label="Subcontracting">
                <button class="step" data-act="sub" data-d="-1000" ${plan.sub < 1000 ? 'disabled' : ''}>&minus;1,000</button><button class="step" data-act="sub" data-d="-250" ${plan.sub < 250 ? 'disabled' : ''}>&minus;250</button>
                <output aria-live="polite">${int(plan.sub)}</output>
                <button class="step" data-act="sub" data-d="250" ${plan.sub + 250 > FP.SUB_MAX ? 'disabled' : ''}>+250</button><button class="step" data-act="sub" data-d="1000" ${plan.sub + 1000 > FP.SUB_MAX ? 'disabled' : ''}>+1,000</button>
              </div></div>
          </section>
        </div>
        <section class="sheet">
          <h3>If ${M[m]} orders match the forecast</h3>
          <div class="grid2">
            <table class="small preview"><tbody>
              <tr><td>Stock at the start</td><td>${int(S.stock)}</td></tr>
              <tr><td>Made in regular time</td><td>${int(p.regular)}</td></tr>
              <tr><td>Made on overtime</td><td>${int(p.overtime)}</td></tr>
              <tr><td>From the subcontractor</td><td>${int(plan.sub)}</td></tr>
              <tr><td>Forecast orders</td><td>&minus;${int(FP.FORECAST[m])}</td></tr>
              <tr class="total"><td>End of month</td><td>${endText}</td></tr>
            </tbody></table>
            <table class="small preview"><tbody>
              ${COST_LABELS.filter(([k]) => p.cost[k] > 0).map(([k, l]) => `<tr><td>${l}</td><td>${inr(p.cost[k])}</td></tr>`).join('')}
              <tr class="total"><td>Expected cost this month</td><td>${inr(p.cost.total)}</td></tr>
            </tbody></table>
          </div>
        </section>
      </div>
      <div class="actionbar"><div class="wrap"><span class="muted small">Actual orders are revealed after you run the month.</span><button class="btn primary" data-act="run">Run ${M[m]}</button></div></div>
      <div class="wrap footer">${confirmRestart ? `<span style="color:var(--red)">This deletes the game on this device.</span> <button class="btn small dark" data-act="restart-yes">Delete and start over</button> <button class="btn small" data-act="restart-no">Keep playing</button>` : `<button class="btn ghost small" data-act="restart">Start over</button>`}</div>`;
  }

  function renderResult() {
    const r = S.history[S.history.length - 1];
    const diff = r.demand - FP.FORECAST[r.month];
    app.innerHTML = bar(r.month) + `
      <div class="wrap" style="padding-bottom:40px">
        <h2 style="margin-top:22px">${M[r.month]} results</h2>
        <div class="kpis">
          <div class="kpi"><div class="small muted">Actual orders</div><div class="bignum">${int(r.demand)}</div><div class="small">${diff === 0 ? 'Exactly the forecast' : (diff > 0 ? int(diff) + ' above' : int(-diff) + ' below') + ' the forecast'}</div></div>
          <div class="kpi"><div class="small muted">Sets made</div><div class="bignum">${int(r.made)}</div><div class="small">${r.workers} workers${r.ot ? ', +' + r.ot + '% overtime' : ''}${r.sub ? ', ' + int(r.sub) + ' subcontracted' : ''}</div></div>
          <div class="kpi ${r.short ? 'bad' : ''}"><div class="small muted">Orders lost</div><div class="bignum">${int(r.short)}</div></div>
          <div class="kpi"><div class="small muted">Stock at month end</div><div class="bignum">${int(r.stock)}</div></div>
        </div>
        <section class="sheet" style="max-width:560px"><h3>Cost of ${M[r.month]}</h3>
          <table class="small preview"><tbody>${COST_LABELS.filter(([k]) => r.cost[k] > 0).map(([k, l]) => `<tr><td>${l}</td><td>${inr(r.cost[k])}</td></tr>`).join('')}
          <tr class="total"><td>Total</td><td>${inr(r.cost.total)}</td></tr></tbody></table></section>
        <div class="row" style="margin-top:20px"><button class="btn primary" data-act="${S.done ? 'final' : 'next'}">${S.done ? 'See the final report' : 'Plan ' + M[S.m]}</button></div>
      </div>`;
    app.querySelector('[data-act=next],[data-act=final]')?.focus({ preventScroll: true });
  }

  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = (raw || 1) / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
  function chart(hist) {
    const W = 680, H = 280, L = 56, R = 20, T = 14, B = 30;
    const n = hist.length;
    const hi = Math.max(...hist.map((r) => Math.max(r.demand, r.made, r.stock))) * 1.1;
    const x = (i) => L + ((i + 0.5) * (W - L - R)) / n;
    const y = (v) => T + ((hi - v) * (H - T - B)) / hi;
    const step = niceStep(hi / 5);
    let g = '';
    for (let v = 0; v <= hi; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#1B2A41' : '#D5DAE1'}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#5B6676">${int(v)}</text>`;
    const bw = ((W - L - R) / n) * 0.35;
    const bars = hist.map((r, i) => `<rect x="${x(i) - bw / 2}" y="${y(r.stock)}" width="${bw}" height="${y(0) - y(r.stock)}" fill="#DCE7F4" stroke="#1F4E8C"><title>${M[i]} stock at month end: ${int(r.stock)}</title></rect>`).join('');
    const line = (k, c, dash) => `<path d="${hist.map((r, i) => `${i ? 'L' : 'M'}${x(i)},${y(r[k])}`).join(' ')}" fill="none" stroke="${c}" stroke-width="3" ${dash ? `stroke-dasharray="${dash}"` : ''}/>` + hist.map((r, i) => `<circle cx="${x(i)}" cy="${y(r[k])}" r="4" fill="${c}"><title>${M[i]}: ${int(r[k])}</title></circle>`).join('');
    const xl = hist.map((r, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#5B6676">${M[i].slice(0, 3)}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Orders, production and stock by month">${g}${bars}${line('demand', '#1B2A41', '6 5')}${line('made', '#A93A34')}${xl}</svg>`;
  }

  function renderFinal() {
    const you = FP.summary(S);
    const bench = FP.STRATEGIES.map((st) => ({ st, run: FP.runStrategy(S.code, st) })).map((b) => Object.assign(b, { s: FP.summary(b.run) }));
    const rank = [{ n: 'you', c: you.cost.total }].concat(bench.map((b) => ({ n: b.st.id, c: b.s.cost.total }))).sort((a, b) => a.c - b.c);
    const pos = rank.findIndex((r) => r.n === 'you') + 1;
    const rows = [{ name: S.name + ' (you)', desc: S.history.map((r) => r.workers).join(', ') + ' workers', s: you }].concat(bench.map((b) => ({ name: b.st.name, desc: b.st.desc + ' Workers: ' + b.run.history.map((r) => r.workers).join(', ') + '.', s: b.s })))
      .map((r) => `<tr><td><b>${esc(r.name)}</b><br><span class="tiny muted">${esc(r.desc)}</span></td><td class="r" style="white-space:nowrap"><b>${lakh(r.s.cost.total)}</b></td><td class="r">${inr(r.s.perSet)}</td><td class="r">${(r.s.fill * 100).toFixed(1)}%</td><td class="r">${r.s.changes}</td></tr>`).join('');
    const costRows = COST_LABELS.map(([k, l]) => `<tr><td>${l}</td><td class="r">${inr(you.cost[k])}</td>${bench.map((b) => `<td class="r">${inr(b.s.cost[k])}</td>`).join('')}</tr>`).join('');
    const result = `Season Planner | ${S.name} | code ${S.code} | total cost ${lakh(you.cost.total)} | orders delivered ${(you.fill * 100).toFixed(1)}%`;
    app.innerHTML = bar(M.length) + `
    <div class="wrap" style="padding-bottom:40px">
      <section style="padding:26px 0 6px">
        <p class="kicker">Final report for ${esc(S.name)}, game code ${esc(S.code)}</p>
        <h1 style="font-size:clamp(40px,6vw,60px)">${lakh(you.cost.total)}</h1>
        <p style="font-size:20px;max-width:40em">Total cost for the season, January to June. You delivered ${(you.fill * 100).toFixed(1)}% of orders at ${inr(you.perSet)} per set. Against the three standard plans below, you placed ${pos} of 4. Lower cost is better.</p>
      </section>
      <section class="sheet chart"><h3>Orders, production and stock</h3>
        ${chart(S.history)}
        <div class="legend"><span class="dash" style="--c:#1B2A41">Orders</span><span style="--c:#A93A34">Sets made</span><span class="blk" style="--c:#9DB8DA">Stock at month end</span></div></section>
      <section class="sheet tablewrap" style="margin-top:16px"><h3>How the plans compare</h3>
        <table class="small"><thead><tr><th>Plan</th><th class="r">Total cost</th><th class="r">Cost per set sold</th><th class="r">Orders delivered</th><th class="r">Workers hired or laid off</th></tr></thead><tbody>${rows}</tbody></table>
        <p class="tiny muted" style="margin-top:8px">All four plans faced the same actual orders. The three standard plans were fixed in advance from the forecast.</p></section>
      <section class="sheet tablewrap" style="margin-top:16px"><h3>Where the money went</h3>
        <table class="small"><thead><tr><th>Cost</th><th class="r">You</th>${bench.map((b) => `<th class="r">${esc(b.st.name)}</th>`).join('')}</tr></thead><tbody>${costRows}
        <tr><td><b>Total</b></td><td class="r"><b>${inr(you.cost.total)}</b></td>${bench.map((b) => `<td class="r"><b>${inr(b.s.cost.total)}</b></td>`).join('')}</tr></tbody></table></section>
      <div class="grid2" style="margin-top:16px">
        <section class="sheet"><h3>Talk it over</h3>
          <ol class="questions small">
            <li>Was your plan closer to a level plan or a chase plan? Why did you choose it?</li>
            <li>Building stock early costs storage. Hiring for the peak costs hiring and layoffs. Which cost more for you?</li>
            <li>When did overtime or subcontracting make sense, and when was it too expensive?</li>
            <li>Laying off workers after the peak saves wages but hurts people and the company&rsquo;s name. How would that change your plan in real life?</li>
            <li>Orders were up to 8% away from the forecast. How did you protect yourself against that?</li>
          </ol></section>
        <section class="sheet"><h3>Share your result</h3>
          <p class="small">Copy this line to share your result.</p>
          <div class="copybox"><input type="text" id="resultLine" readonly value="${esc(result)}"><button class="btn primary" data-act="copy">Copy my result</button></div>
          <p class="small" id="copymsg" role="status"></p>
          <button class="btn" data-act="again" style="margin-top:8px">Play again</button></section>
      </div>
      <p class="footer">The company, costs and orders in this game are made up for teaching.</p>
    </div>`;
  }

  app.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'newcode') { document.getElementById('code').value = FP.randomCode(); return; }
    if (act === 'resume') { S = store.get(SAVE_KEY); resetPlan(); go('month'); return; }
    const refocus = (sel) => { keepScroll(renderMonth); const el = app.querySelector(sel); if (el && !el.disabled) el.focus({ preventScroll: true }); };
    if (act === 'w') { plan.workers = Math.max(0, Math.min(S.workers + FP.HIRE_MAX, plan.workers + Number(t.dataset.d))); refocus(`[data-act=w][data-d="${t.dataset.d}"]`); return; }
    if (act === 'ot') { plan.ot = Number(t.dataset.v); refocus(`[data-act=ot][data-v="${t.dataset.v}"]`); return; }
    if (act === 'sub') { plan.sub = Math.max(0, Math.min(FP.SUB_MAX, plan.sub + Number(t.dataset.d))); refocus(`[data-act=sub][data-d="${t.dataset.d}"]`); return; }
    if (act === 'run') { S = FP.playMonth(S, plan); save(); go('result'); return; }
    if (act === 'next') { resetPlan(); go('month'); return; }
    if (act === 'final') { go('final'); return; }
    if (act === 'restart') { confirmRestart = true; keepScroll(renderMonth); return; }
    if (act === 'restart-no') { confirmRestart = false; keepScroll(renderMonth); return; }
    if (act === 'restart-yes' || act === 'again') { confirmRestart = false; store.del(SAVE_KEY); S = null; go('start'); return; }
    if (act === 'copy') {
      const inp = document.getElementById('resultLine');
      const msg = document.getElementById('copymsg');
      try { await navigator.clipboard.writeText(inp.value); msg.textContent = 'Copied.'; }
      catch (err) { inp.focus(); inp.select(); msg.textContent = 'Select the line above and copy it.'; }
    }
  });

  render();
})();
</script>
<footer class="credit"><div class="wrap">Created by Ashir Mansuri</div></footer>
</body>
</html>
